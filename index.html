.ml-sub{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml-sum{font-size:13.5px;color:var(--cc-mut,var(--muted));line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ml-dl{align-self:flex-start;font-size:12.5px;font-weight:650;color:#ffd27a;background:rgba(255,194,74,.12);border-radius:8px;padding:2px 8px;margin-top:2px}
.ml-dl.late{color:#ffb0a8;background:rgba(255,107,94,.14)}
.ml-task{align-self:flex-start;border:0;background:none;color:var(--cc-cy,var(--accent));font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:2px 0}
.ml-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ml-b{border:1px solid rgba(130,185,255,.26);background:rgba(255,255,255,.07);color:inherit;border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap;text-decoration:none;min-height:34px;display:inline-flex;align-items:center}
.ml-b:hover{background:rgba(255,255,255,.14)}
.ml-b.ok{border-color:rgba(62,214,160,.45);color:#8ff0c6}
.ml-b.pri{background:linear-gradient(160deg,#8fd0ff,#2f7bff);color:#041530;border-color:transparent}
.ml-b.ic{width:34px;justify-content:center;padding:0}
.ml-form{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.ml-form input{flex:1 1 220px;min-width:0;background:rgba(3,12,40,.4);border:1px solid rgba(130,185,255,.3);color:inherit;border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.ml-form input[type=date]{flex:0 0 auto}
.ds-svg{width:100%;height:auto;display:block;overflow:visible}
.ds-bv{fill:#cfe0fb;font-size:10px;font-family:var(--f-mono)}
.ds-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--cc-mut,var(--muted));margin-top:6px}
.ds-leg span{display:inline-flex;align-items:center;gap:6px}.ds-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ds-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.ds-mini div{background:rgba(3,12,40,.30);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.ds-mini b{font-family:var(--f-display);font-size:22px;font-weight:800}
.ds-mini span{font-size:12px;color:var(--cc-mut)}
.ds-hb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.ds-hb li{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 2.2em;gap:10px;align-items:center;font-size:13px}
.ds-hb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-hb .b{position:relative;height:9px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.ds-hb .b i{position:absolute;left:0;top:0;bottom:0;background:#4aa8ff;opacity:.6;border-radius:5px}
.ds-hb .b i.imp{background:#ff8a6b;opacity:1}
.ds-hb b{text-align:right;font-family:var(--f-mono);font-weight:500}
.ds-hb .e{display:block;color:var(--muted)}

/* Priority */
.ds-pri .hp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:none;border:0;padding:0}
.ds-pri .hp-row{background:rgba(3,12,40,.32);border:1px solid rgba(130,185,255,.16);border-radius:16px;padding:12px 14px;min-height:58px;color:#fff}
.ds-pri .hp-row .n{font-size:15px}
.ds-pri .hp-row input[type=text]{background:transparent;border:0;color:#fff;font-size:15px}
.ds-pri .chk{border-color:rgba(255,255,255,.6);background:transparent}
.ds-pri .hp-w{grid-column:1/-1;color:var(--cc-mut);font-size:13.5px}

/* Ciele */
.ds-goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ds-goal{position:relative;border:1px solid rgba(130,185,255,.18);border-radius:18px;overflow:hidden;min-height:190px;display:flex;align-items:flex-end;background:linear-gradient(160deg,#3557e8,#0d1a5a);color:#fff;font:inherit;text-align:left;cursor:pointer;padding:0}
.ds-goal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ds-goal-ph{position:absolute;top:16px;left:16px;opacity:.5}.ds-goal-ph svg{width:44px;height:44px}
.ds-goal .cap{position:relative;width:100%;padding:12px 14px;background:linear-gradient(180deg,transparent,rgba(3,12,40,.88) 38%);display:flex;flex-direction:column;gap:5px}
.ds-goal .h{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--cc-mut)}
.ds-goal b{font-size:16px;font-weight:720;line-height:1.25}
.ds-goal .s{font-size:12.5px;color:var(--cc-mut)}

/* Výlety */
.ds-trips{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:12px}
.ds-trip{border:1px solid rgba(130,185,255,.18);border-radius:18px;background:rgba(3,12,40,.30);color:#fff;font:inherit;text-align:left;cursor:pointer;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ds-trip b{font-size:16px;font-weight:720}
.ds-trip .s{font-size:13px;color:var(--cc-mut)}
.ds-trip .cd2{margin-top:auto;font-family:var(--f-display);font-size:20px;font-weight:800}
.ds-trip.big{padding:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);overflow:hidden}
.ds-trip.big .ill{position:relative;min-height:150px}
.ds-trip.big .ill svg{position:absolute;inset:0;width:100%;height:100%}
.ds-trip.big .cd{position:absolute;left:14px;bottom:10px;display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:650;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.ds-trip.big .cd b{font-family:var(--f-display);font-stretch:118%;font-size:42px;font-weight:800;line-height:1}
.ds-trip.big .tx{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ds-trip .pg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:12.5px;color:var(--cc-mut);margin-top:4px}
.ds-trip .todo{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:#cfe0fb;margin-top:4px}

/* Financie */
.ds-fstats{background:rgba(3,12,40,.28)}
.ds-fch .cc-donut{grid-template-columns:minmax(110px,150px) minmax(0,1fr)}

/* Tablet na výšku a menšie notebooky */
@container dash (max-width:980px){
  .ds-hero-ill{display:none}
  .ds-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ds-stat:nth-child(4){border-left:0}
  .ds-stat:nth-child(n+4){border-top:1px solid var(--cc-line)}
  .ds-goals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ds-trips{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ds-trip.big{grid-column:1/-1}
}
@container dash (max-width:980px){
  .ds-cols-mail{grid-template-columns:minmax(0,1fr);gap:16px}
  .ds-cols-mail>.ds-col+.ds-col{border-left:0;padding-left:0;border-top:1px solid var(--cc-line);padding-top:14px}
  .ds-mstat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 24px;align-items:start}
  .ds-mstat .ds-ct{grid-column:1/-1}
  .ds-mstat .ds-mini{margin-top:0}
}
@container dash (max-width:760px){
  .ds-cols,.ds-cols-mail,.ds-fch{grid-template-columns:minmax(0,1fr);gap:16px}
  .ds-cols>.ds-col+.ds-col{border-left:0;padding-left:0;border-top:1px solid var(--cc-line);padding-top:14px}
}
/* Mobil – jednoduchšie */
@container dash (max-width:600px){
  .view-dash.ds{gap:14px}
  .ds-hero{padding:18px 16px;gap:14px;border-radius:22px}
  .ds-hero-top{grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .ds-hero h1{font-size:27px}
  .ds-lead{font-size:14px}
  .ds-clock{font-size:34px!important}
  .ds-hero-r{display:contents}
  .ds-clock{grid-column:2;grid-row:1;align-self:start}
  .ds-acts{grid-column:1/-1;justify-content:flex-start}
  .ds-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ds-stat{border-left:1px solid var(--cc-line)!important;border-top:1px solid var(--cc-line)}
  .ds-stat:nth-child(odd){border-left:0!important}
  .ds-stat:nth-child(-n+2){border-top:0}
  .ds-stat b{font-size:22px}
  .ds-tl{display:none}
  .ds-agenda{display:flex}
  .ds-detail{display:none!important}
  .ds-sec{padding:14px 14px 16px;border-radius:22px}
  .ds-sh h2{font-size:18px}
  .ds-ht{flex-direction:column;gap:0}
  .ds-more{padding:5px 10px;font-size:12.5px}
  .ds-more{font-size:0}.ds-more span{font-size:16px}
  .ds-mails .ml:nth-child(n+4){display:none}
  .ml{grid-template-columns:minmax(0,1fr)}
  .ml-act{justify-content:flex-start}
  .ds-pri .hp{grid-template-columns:minmax(0,1fr)}
  .ds-goals,.ds-trips{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:4px}
  .ds-goal{flex:0 0 78%;scroll-snap-align:start;min-height:170px}
  .ds-trip.big{flex:0 0 100%;grid-template-columns:minmax(0,1fr)}
  .ds-trip.big .ill{min-height:110px}
  .ds-fstats .ds-stat:nth-child(n+5){display:none}
}
/* Pošta – štatistika */
.pm-sum{display:flex;flex-direction:column;gap:14px}
.pm-h{display:flex;align-items:center;gap:10px}.pm-h h2{font-size:17px;font-weight:720}.pm-h .sp{flex:1}
.pm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pm-st{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 3px 0 transparent}
.pm-st.imp{box-shadow:inset 0 3px 0 #ff8a6b}.pm-st.warn{box-shadow:inset 0 3px 0 #ffc24a}.pm-st.ok{box-shadow:inset 0 3px 0 #3ed6a0}
.pm-st .k{font-size:12px;font-weight:650;color:var(--muted)}
.pm-st b{font-family:var(--f-display);font-stretch:112%;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.pm-st .s{font-size:12px;color:var(--muted)}
.pm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.pm-tip{margin:0;font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.view-posta .ml{background:var(--surface);border-color:var(--line)}
.view-posta .ds-ct{color:var(--muted)}
.view-posta .cc-ax{fill:var(--muted)}
@media (max-width:600px){ .view-posta .ml{grid-template-columns:minmax(0,1fr)} .view-posta .ml-act{justify-content:flex-start} }
.pm-mute{display:flex;flex-direction:column;gap:10px}
.pm-mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pm-mlist li{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.pm-mlist small{color:var(--muted);font-size:12px}
.pm-cand{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.pm-empty{margin:0;font-size:13px;color:var(--muted)}
.ds-legacy{background:#ffc24a;color:#2a1a00;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}.ds-legacy a{color:#2a1a00;text-decoration:underline}

.ds-goal-svg{position:absolute;inset:0}.ds-goal-svg svg{width:100%;height:100%;display:block}
.ds-mis{font-size:13px;color:var(--cc-mut);margin:0 0 10px}.ds-mis b{color:var(--cc-ink)}

/* ===== Nástenka cieľov (vision board) ===== */
.vb-view{max-width:1240px;gap:16px;container-type:inline-size;container-name:vb}
.vb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vb-head h1{margin:2px 0 0;font-family:var(--f-display);font-size:30px;letter-spacing:-.01em}
.vb-actions{display:flex;gap:8px;flex-wrap:wrap}
.vb-mission{position:relative;border-radius:14px;padding:18px 54px 18px 22px;background:linear-gradient(120deg,#0f3d8f,#1f6fe0 55%,#2aa1d8);color:#fff;box-shadow:0 10px 30px rgba(10,40,120,.35);overflow:hidden}
.vb-mission::after{content:"";position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.vb-mis-l{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:700}
.vb-mission p{margin:4px 0 0;font-family:var(--f-display);font-size:clamp(20px,3.2cqi,30px);font-weight:700;line-height:1.15}
.vb-mission p::before{content:"🛡️ "}
.vb-mis-e{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer;z-index:1}
.vb-mis-ed textarea{width:100%;margin-top:6px;border-radius:10px;border:0;padding:10px;font:600 18px/1.3 var(--f-body);background:rgba(255,255,255,.95);color:#0b1d3f;resize:vertical}
.vb-mis-b{display:flex;gap:8px;margin-top:8px}
.vb-bar1{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vb-chips{display:flex;gap:6px;flex-wrap:wrap}
.vb-chip,.vb-tag{border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 13px;font:600 13px var(--f-body);cursor:pointer;white-space:nowrap}
.vb-chip i,.vb-tag i{font-style:normal;opacity:.6;margin-left:3px}
.vb-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vb-tag{--tc:var(--accent);padding:6px 11px;font-size:12.5px}
.vb-tag.on{background:color-mix(in srgb,var(--tc) 28%,var(--surface));border-color:var(--tc);color:#fff}
.vb-tag.sm{padding:5px 9px;font-size:12px}
.vb-tools{display:flex;gap:8px;align-items:center}
.vb-tools .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.vb-tools .seg button{border:0;background:var(--surface);color:var(--muted);padding:7px 13px;font:600 13px var(--f-body);cursor:pointer}
.vb-tools .seg button.on{background:var(--surface-2);color:var(--fg)}
/* korková tabuľa */
.vb-board{column-count:5;column-gap:22px;padding:30px 26px 34px;border-radius:16px;
  background-color:#b98c5e;
  background-image:radial-gradient(rgba(90,55,25,.35) 1px,transparent 1.6px),radial-gradient(rgba(255,230,190,.25) 1px,transparent 1.8px),radial-gradient(rgba(70,40,15,.22) 1.4px,transparent 2px),linear-gradient(135deg,#c79a69,#a87a4c);
  background-size:9px 9px,13px 13px,17px 17px,100% 100%;background-position:0 0,4px 7px,9px 3px,0 0;
  box-shadow:inset 0 0 0 10px #6e4a2a,inset 0 0 0 12px #8a6038,inset 0 0 40px rgba(60,30,10,.45),0 14px 40px rgba(0,0,0,.45)}
.vb-card,.vb-note{break-inside:avoid;display:inline-block;vertical-align:top;box-sizing:border-box;position:relative;margin:var(--dy,0px) 0 26px;transform:rotate(var(--rot,0deg));transition:transform .2s ease,box-shadow .2s ease;width:100%}
.vb-card{background:#fdfcf7;padding:9px 9px 10px;border-radius:2px;box-shadow:0 2px 3px rgba(0,0,0,.25),0 10px 22px rgba(40,20,5,.35);cursor:pointer;color:#1d2433;text-align:left;border:0;font:inherit}
.vb-card:hover,.vb-card:focus-visible{transform:rotate(0) scale(1.04);z-index:3;box-shadow:0 4px 6px rgba(0,0,0,.25),0 22px 40px rgba(40,20,5,.45);outline:none}
.vb-ph{position:relative;overflow:hidden;background:#dfe6f0;border-radius:1px}
.vb-ph img,.vb-ph svg{display:block;width:100%;height:100%;object-fit:cover}
.vb-cap{display:flex;flex-direction:column;gap:5px;padding:9px 3px 1px}
.vb-cap b{font-family:"Bradley Hand","Segoe Print","Marker Felt","Comic Sans MS",cursive;font-size:17px;line-height:1.15;font-weight:700;color:#1b2232}
.vb-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.vb-hz{font:700 10.5px var(--f-body);letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:#e8eefc;color:#2a4fb0}
.vb-hz-dalsi{background:#e4f6ee;color:#1d7a52}.vb-hz-5r{background:#fdf0dc;color:#a0620a}.vb-hz-zivot{background:#f1e8fd;color:#6a3fb5}
.vb-bar{height:4px;border-radius:4px;background:#e4e7ee;overflow:hidden}.vb-bar i{display:block;height:100%;background:#2fa86a}
.vb-done{position:absolute;left:8px;top:8px;background:#2fa86a;color:#fff;font:700 12px var(--f-body);padding:4px 9px;border-radius:999px}
.vb-card.done .vb-ph{filter:saturate(.75)}
.vb-pin{position:absolute;left:50%;top:-8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 40%),var(--pc,#e63946);box-shadow:0 3px 4px rgba(0,0,0,.4);z-index:2}
.vb-tape{position:absolute;left:50%;top:-11px;width:84px;height:22px;margin-left:-42px;transform:rotate(var(--tr,0deg));background:rgba(255,250,225,.62);box-shadow:0 1px 2px rgba(0,0,0,.15);z-index:2;backdrop-filter:blur(1px)}
.vb-note{--nc:#fff3a8;background:var(--nc);color:#3a2f12;padding:22px 18px 16px;box-shadow:0 3px 5px rgba(0,0,0,.2),0 12px 20px rgba(40,20,5,.3);border-radius:2px 2px 14px 2px}
.vb-note q{display:block;font-family:"Bradley Hand","Segoe Print","Marker Felt","Comic Sans MS",cursive;font-size:19px;line-height:1.25;font-weight:700;quotes:"„" "“"}
.vb-note cite{display:block;margin-top:8px;font:italic 600 12.5px var(--f-body);opacity:.75}
.vb-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:170px;background:rgba(253,252,247,.55);border:2px dashed rgba(70,40,15,.45);box-shadow:none;color:#3a2a18;text-align:center}
.vb-add span{font-size:34px;line-height:1}.vb-add b{font-size:15px}.vb-add small{font-size:12px;opacity:.75;max-width:180px}
.vb-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.vb-foot span{flex:1;min-width:200px}
.vb-lsec .panel-h small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.vb-lsec .th svg{width:100%;height:100%;display:block}
@container vb (max-width:1100px){.vb-board{column-count:4}}
@container vb (max-width:880px){.vb-board{column-count:3;column-gap:18px;padding:26px 18px 28px}}
@container vb (max-width:600px){.vb-board{column-count:2;column-gap:14px;padding:22px 12px 22px;box-shadow:inset 0 0 0 6px #6e4a2a,inset 0 0 30px rgba(60,30,10,.45),0 10px 26px rgba(0,0,0,.4)}.vb-cap b{font-size:14.5px}.vb-note q{font-size:15.5px}.vb-note{padding:18px 12px 12px}.vb-card{padding:6px 6px 8px}.vb-meta{font-size:12px}.vb-tags,.vb-bar1>.vb-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;max-width:100%}.vb-bar1{flex-direction:column;align-items:stretch}.vb-tools{justify-content:space-between}.vb-head h1{font-size:24px}.vb-mission{padding:14px 48px 14px 16px}}
@container vb (max-width:300px){.vb-board{column-count:1}}
/* modálne okná */
html.vb-lock,html.vb-lock body{overflow:hidden}
.vb-ov{position:fixed;inset:0;z-index:200;background:rgba(2,6,14,.72);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;backdrop-filter:blur(3px)}
.vb-modal{width:min(860px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:none}
.vb-modal.wide{width:min(1100px,100%)}
.vb-mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.vb-mh b{display:block;font-size:17px}.vb-mh span{font-size:12.5px;color:var(--muted)}
.vb-x{border:0;background:var(--surface-2);color:var(--fg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;flex:none}
.vb-mf{display:flex;align-items:center;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 16px 16px}
.vb-mf>span:first-child,.vb-mf>.vb-delb{margin-right:auto}
.vb-mf>span{font-size:13px;color:var(--muted)}
.vb-del{color:var(--crit)!important;font-weight:600}
.vb-ed{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;padding:18px}
.vb-ed-img .vb-ph{aspect-ratio:4/3;border-radius:10px;border:6px solid #fdfcf7;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.vb-ed-ib{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.vb-ed-ib small{font-size:12px;color:var(--muted)}
.vb-ed-f{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.vb-ed-f .wide{grid-column:1/-1}
.vb-ed-f input[type=text],.vb-ed-f input[type=date],.vb-ed-f input[type=number],.vb-ed-f textarea,.vb-ed-f select,.vb-ii input,.vb-ii select{width:100%;box-sizing:border-box;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);border-radius:9px;padding:9px 11px;font:500 14px var(--f-body)}
.vb-ed-f input[type=range]{width:100%;accent-color:var(--ok)}
.vb-tchips{display:flex;gap:5px;flex-wrap:wrap}
.vb-fin summary{cursor:pointer;font-size:13px;color:var(--fg);padding:4px 0}
.vb-fin-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.vb-split{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:12px 18px 0;font-size:13px;color:var(--muted)}
.vb-note2{margin:10px 18px 0;padding:9px 12px;border-radius:9px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--fg);font-size:13px}
.vb-imp{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:16px 18px}
.vb-ii{display:flex;flex-direction:column;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px}
.vb-ii.off{opacity:.38}
.vb-ii-img{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#000}
.vb-ii-img img{width:100%;height:100%;object-fit:contain;display:block}

const ageDays = (iso)=>iso? Math.floor((Date.now()-new Date(iso).getTime())/864e5) : 9999;
const fmtDate = (iso)=>{ if(!iso) return ""; const d=new Date(iso.length<=10?iso+"T00:00:00":iso); return d.getDate()+". "+(d.getMonth()+1)+". "+d.getFullYear(); };

const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

const ISO_RE=/^\d{4}-\d{2}-\d{2}$/;
/* Výskyty udalosti v intervale <from,to> vrátane opakovania */
function occurrences(it,from,to){
  const out=[], start=it.date||"", r=it.repeat||"";
  if(!ISO_RE.test(start) || start>to) return out;
  if(!r){ if(start>=from) out.push(start); return out; }
  if(r==="tyzdenne"){
    const d=pd(start);
    if(start<from){ const days=Math.round((pd(from)-d)/864e5); d.setDate(d.getDate()+Math.ceil(days/7)*7); }
    while(isoD(d)<=to && out.length<120){ out.push(isoD(d)); d.setDate(d.getDate()+7); }
    return out;
  }
  const s=pd(start), day=s.getDate(), f=pd(from);
  for(let i=0;i<60&&out.length<120;i++){
    let yy,mm;
    if(r==="rocne"){ yy=f.getFullYear()+i; mm=s.getMonth(); }
    else { const k=f.getMonth()+i; yy=f.getFullYear()+Math.floor(k/12); mm=k%12; }
    const last=new Date(yy,mm+1,0).getDate(); const c=isoD(new Date(yy,mm,Math.min(day,last)));
    if(c>to) break; if(c>=from && c>=start) out.push(c);
  }
  return out;
}
/* Agenda: udalosti (s opakovaním) + otvorené úlohy s termínom */
function agenda(from,to,o={}){
  const out=[];
  for(const it of S.items.values()){
    if(o.filter && !o.filter(it)) continue;
    if(it.type==="udalost") for(const d of occurrences(it,from,to)) out.push({d,it});
    else if(o.tasks && isOpenTask(it) && ISO_RE.test(it.due||"") && it.due<=to && (it.due>=from || o.late)) out.push({d:it.due<from?from:it.due,it,late:it.due<from});
  }
  if(!o.noVirtual) for(const v of virtualEvents(from,to)) if(!o.filter||o.filter(v.it)) out.push(v);
  return out.sort((a,b)=>a.d.localeCompare(b.d) || (a.late?-1:0)-(b.late?-1:0) || (a.it.time||"99").localeCompare(b.it.time||"99"));
}

function findByTitle(t){ const n=norm(t).trim(); for(const it of S.items.values()) if(norm(it.title).trim()===n) return it; return null; }
function wikiTargets(body){ const out=[]; String(body||"").replace(/\[\[([^\]\n]{1,160})\]\]/g,(m,t)=>{const it=findByTitle(t); if(it) out.push(it.id); return m;}); return out; }
function outLinks(it){ const s=new Set(it.links||[]); if(it.project) s.add(it.project); wikiTargets(it.body).forEach(x=>s.add(x)); s.delete(it.id); return [...s].filter(id=>S.items.has(id)); }
function buildEdges(){
  const out=new Map(), back=new Map();
  for(const it of S.items.values()){ const o=outLinks(it); out.set(it.id,o); for(const t of o){ if(!back.has(t)) back.set(t,new Set()); back.get(t).add(it.id); } }
  S.edges={out,back};
}
const backlinks = id=>[...(S.edges?.back.get(id)||[])].filter(x=>S.items.has(x));

/* ---------- Markdown ---------- */
function inline(s){
  let h=esc(s);
  h=h.replace(/`([^`]+)`/g,"<code>$1</code>");
  h=h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  h=h.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  h=h.replace(/\[\[([^\]\n]{1,160})\]\]/g,(m,t)=>{const tt=t.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'"); const it=findByTitle(tt); return it?`<a class="wl" data-open="${esc(it.id)}">${t}</a>`:`<span class="wl miss" title="Záznam s týmto názvom neexistuje">${t}</span>`;});
  h=h.replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return h;
}
function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n"); let out="", list=null, para=[];
  const flushP=()=>{ if(para.length){ out+="<p>"+para.map(inline).join("<br>")+"</p>"; para=[]; } };
  const flushL=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  for(const raw of lines){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){ flushP(); flushL(); continue; }
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){ flushP(); flushL(); const n=m[1].length; out+=`<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if(/^(-{3,}|\*{3,})$/.test(l.trim())){ flushP(); flushL(); out+="<hr>"; continue; }
    if((m=l.match(/^>\s?(.*)$/))){ flushP(); flushL(); out+=`<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if((m=l.match(/^\s*[-*]\s+(\[( |x|X)\]\s+)?(.*)$/))){ flushP(); if(list!=="ul"){ flushL(); out+="<ul>"; list="ul"; } const box=m[1]?(m[2].trim()?"☑ ":"☐ "):""; out+=`<li>${box}${inline(m[3])}</li>`; continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if(list!=="ol"){ flushL(); out+="<ol>"; list="ol"; } out+=`<li>${inline(m[1])}</li>`; continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL(); return out;
}
function snippet(body,n=180){ return String(body||"").replace(/[#*`>\[\]]/g,"").replace(/\s+/g," ").trim().slice(0,n); }

/* ----- Prehľad ----- */
function dashData(){
  const all=items(), td=today();
  const tasks=all.filter(isOpenTask);
  const late=tasks.filter(t=>t.due && dayDiff(t.due)<0).sort((a,b)=>a.due.localeCompare(b.due));
  const week=tasks.filter(t=>t.due && dayDiff(t.due)>=0 && dayDiff(t.due)<=7).sort((a,b)=>a.due.localeCompare(b.due));
  const nodue=tasks.filter(t=>!t.due).sort((a,b)=>(b.updated||"").localeCompare(a.updated||""));
  const projects=all.filter(i=>i.type==="projekt" && (i.status||"aktivny")==="aktivny");
  const forgotten=all.filter(i=>(isOpenTask(i)||(i.type==="projekt"&&(i.status||"aktivny")==="aktivny")) && ageDays(i.updated)>=21).sort((a,b)=>(a.updated||"").localeCompare(b.updated||""));
  const unsorted=all.filter(i=>!(i.tags||[]).length && !degree(i.id) && i.type!=="uloha" && i.type!=="projekt").sort((a,b)=>(b.created||"").localeCompare(a.created||""));
  const recent=all.filter(i=>ageDays(i.created)<7).sort((a,b)=>(b.created||"").localeCompare(a.created||""));
  return {all,tasks,late,week,nodue,projects,forgotten,unsorted,recent,td};
}

function ccYearBars(M,curMk){

    lab+=`<text x="${cx}" y="${H-8}" class="cc-ax ${cur?"cc-ax-cur":""}" text-anchor="middle">${MONTHS_N[i].slice(0,3)}</text>`;
    if(cur){ const yy=Math.max(14,pt+ih-Math.max(hI,hE)-10); const t=`${MONTHS_N[i].slice(0,3)} · ${ccSign(r2(m.inc-m.exp))}`; const tw=t.length*6.6+16, tx=Math.min(W-pr-tw,Math.max(pl,cx-tw/2));
      hi=`<line x1="${cx}" x2="${cx}" y1="${yy+4}" y2="${pt+ih}" class="cc-hl"/><rect x="${tx}" y="${yy-16}" width="${tw}" height="20" rx="10" class="cc-tip"/><text x="${tx+tw/2}" y="${yy-2}" class="cc-tipt" text-anchor="middle">${esc(t)}</text>`; } });
  return `<svg class="cc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Príjmy a výdavky po mesiacoch"><defs><linearGradient id="ccgI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd4ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient><linearGradient id="ccgE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc977"/><stop offset="1" stop-color="#e0773c"/></linearGradient></defs>${grid}${hi}${bars}${lab}</svg>`;
}

const MAIL_ST={vybavene:"Vybavené",nepodstatne:"Nepodstatné",uloha:"Úloha vytvorená"};
const mailState=x=>x.status&&MAIL_ST[x.status]?x.status:(x.handled?"vybavene":"");
const mailDay=x=>{ const t=x.received?new Date(x.received):null; return t&&!isNaN(t)?isoD(t):""; };
const mailWhen=x=>{ const t=x.received?new Date(x.received):null; if(!t||isNaN(t)) return ""; return isoD(t)===today()?String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0"):`${t.getDate()}. ${t.getMonth()+1}.`; };
const mailWho=x=>String(x.from||x.fromEmail||"Neznámy odosielateľ").replace(/\s*<[^>]*>\s*$/,"").trim()||"Neznámy odosielateľ";
async function mailSet(x,patch){
  if(!S.db){ toast("Úložisko nie je dostupné."); return false; }
  const old={}; for(const k of Object.keys(patch)) old[k]=x[k];
  Object.assign(x,patch); renderView();
  try{ await S.db.doc("mail/"+x.id).update(patch); return true; }
  catch(e){ Object.assign(x,old); renderView(); toast("Zmena sa neuložila. Skús to znova."); return false; }
}
/* Stlmení odosielatelia: 2× „Nepodstatné“ → mailový agent ďalšie maily od nich zaradí medzi reklamy (settings/mailmute) */
const muteKey=e=>String(e||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").slice(0,80);
const muteCfg=()=>{ const s=setting("mailmute"); return s&&s.senders&&typeof s.senders==="object"?s.senders:{}; };
const muteOk=email=>/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)&&!/@(?:[a-z0-9-]+\.)*tatrabanka\.sk$/i.test(email);
const muteOwn=email=>/@(?:[a-z0-9-]+\.)*(?:efektra\.sk|safetyelectric\.sk)$/i.test(email)||/sromovsk/i.test(email);
async function muteSave(all){ return put("settings","mailmute",{senders:all,updated:nowIso()}); }
async function muteBump(x,mode){
  const email=String(x.fromEmail||"").toLowerCase().trim(); if(!muteOk(email)) return;
  const all=JSON.parse(JSON.stringify(muteCfg())), k=muteKey(email), was=!!all[k]?.muted;
  if(mode==="reset"){ if(!all[k]) return; all[k]={...all[k],n:0,muted:false,manual:false,at:nowIso()}; }
  else { const o={email,name:mailWho(x),n:0,muted:false,...(all[k]||{})}; o.n=Math.max(0,(+o.n||0)+(mode==="up"?1:-1)); if(!o.manual) o.muted=o.n>=2&&!muteOwn(email); o.name=mailWho(x); o.at=nowIso(); all[k]=o; }
  if(await muteSave(all)&&all[k].muted&&!was) toast(`Ďalšie maily od ${all[k].name} pôjdu rovno medzi reklamy`);
}
document.addEventListener("click",async e=>{
  const u=e.target.closest("[data-unmute]"); if(u){ const all=JSON.parse(JSON.stringify(muteCfg())), k=u.dataset.unmute; if(!all[k]) return; all[k]={...all[k],n:0,muted:false,manual:false,at:nowIso()}; if(await muteSave(all)) toast("Odosielateľ znova chodí do pošty"); return; }
  const m=e.target.closest("[data-mute]"); if(m){ const email=m.dataset.mute.toLowerCase(); if(!muteOk(email)) return; const all=JSON.parse(JSON.stringify(muteCfg())), k=muteKey(email); all[k]={email,n:0,...(all[k]||{}),name:m.dataset.name||email,muted:true,manual:true,at:nowIso()}; if(await muteSave(all)) toast(`Maily od ${all[k].name} pôjdu medzi reklamy`); }
});

/* Štatistika pošty za posledných N dní */
function mailStats(days){
  const td=today(), from=addDays(td,-(days-1)), L=S.mail.filter(x=>{ const d=mailDay(x); return d&&d>=from&&d<=td; });
  const cnt=f=>L.filter(f).length;
  const per=[]; for(let i=days-1;i>=0;i--){ const d=addDays(td,-i); const D=L.filter(x=>mailDay(x)===d); per.push({d,imp:D.filter(x=>x.cat==="dolezite").length,ved:D.filter(x=>x.cat!=="dolezite").length}); }
  const sm=new Map(); for(const x of L){ const k=(x.fromEmail||mailWho(x)).toLowerCase(); const o=sm.get(k)||{n:0,imp:0,nep:0,name:mailWho(x),email:String(x.fromEmail||"").toLowerCase().trim()}; o.n++; if(x.cat==="dolezite") o.imp++; if(mailState(x)==="nepodstatne") o.nep++; sm.set(k,o); }
  const am=new Map(); for(const x of L){ const a=x.account||"—"; am.set(a,(am.get(a)||0)+1); }
  const handled=L.filter(x=>mailState(x)), withT=handled.filter(x=>x.handledAt&&x.received).map(x=>(new Date(x.handledAt)-new Date(x.received))/36e5).filter(h=>h>=0&&h<24*60);
  return {L,days,n:L.length,imp:cnt(x=>x.cat==="dolezite"),ved:cnt(x=>x.cat!=="dolezite"),vyb:cnt(x=>mailState(x)==="vybavene"),nep:cnt(x=>mailState(x)==="nepodstatne"),ul:cnt(x=>mailState(x)==="uloha"),
    open:cnt(x=>x.cat==="dolezite"&&!mailState(x)),dl:cnt(x=>!mailState(x)&&ISO_RE.test(x.deadline||"")),per,
    senders:[...sm.values()].sort((a,b)=>b.n-a.n||b.imp-a.imp).slice(0,8),accounts:[...am.entries()].sort((a,b)=>b[1]-a[1]),
    react:withT.length?withT.sort((a,b)=>a-b)[Math.floor(withT.length/2)]:null};
}
function mailDayBars(per){

  const mx=Math.max(1,...per.map(p=>p.imp+p.ved)), td=today();
  const step=per.length>16?Math.ceil(per.length/10):1;
  return `<svg class="ds-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Počet mailov po dňoch">${[0,.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${pt+ih*f}" y2="${pt+ih*f}" class="cc-gl"/>`).join("")}
  ${per.map((p,i)=>{ const cx=pl+cw*i+cw/2, hI=p.imp/mx*ih, hV=p.ved/mx*ih, dt=pd(p.d), cur=p.d===td;
    return `<g><title>${dt.getDate()}. ${dt.getMonth()+1}.: dôležité ${p.imp}, na vedomie ${p.ved}</title><rect x="${cx-bw/2}" y="${(pt+ih-hV).toFixed(1)}" width="${bw}" height="${hV.toFixed(1)}" rx="3" fill="#4aa8ff" opacity=".55"/><rect x="${cx-bw/2}" y="${(pt+ih-hV-hI).toFixed(1)}" width="${bw}" height="${hI.toFixed(1)}" rx="3" fill="#ff8a6b"/>${p.imp+p.ved?`<text x="${cx}" y="${(pt+ih-hV-hI-3).toFixed(1)}" text-anchor="middle" class="ds-bv">${p.imp+p.ved}</text>`:""}${i%step===0||cur?`<text x="${cx}" y="${H-6}" text-anchor="middle" class="cc-ax ${cur?"cc-ax-cur":""}">${per.length<=7?DAYS[dt.getDay()].slice(0,2):dt.getDate()+"."}</text>`:""}</g>`; }).join("")}</svg>`;
}

function vbFiltered(){ const all=C.goals.filter(g=>S.goalShowDone?true:g.status!=="splneny"); return all.filter(g=>(!S.vbHz||hz(g)===S.vbHz)&&(!S.vbTag||gTags(g).includes(S.vbTag))); }
function vbCard(g,r){
  const rot=((r()*2-1)*4.2).toFixed(1), ar=["4/5","1/1","4/3","3/4","5/4"][Math.floor(r()*5)], pin=r()<.5, dy=Math.round(r()*14);
  const src=vbImg(g), p=Math.max(0,Math.min(100,num(g.progress)||0)), tg=gTags(g), done=g.status==="splneny";
  return `<div class="vb-card${done?" done":""}" style="--rot:${rot}deg;--dy:${dy}px" data-vbgoal="${esc(g.id)}" role="button" tabindex="0">
    ${pin?`<i class="vb-pin" style="--pc:${["#e63946","#3b6fd8","#f2c94c","#2c8f4e"][Math.floor(r()*4)]}"></i>`:`<i class="vb-tape" style="--tr:${((r()*2-1)*8).toFixed(0)}deg"></i>`}
    <div class="vb-ph" style="aspect-ratio:${ar}">${src?`<img src="${esc(src)}" alt="${esc(g.title)}" loading="lazy">`:vbScene(g)}${done?`<span class="vb-done">✓ Splnené</span>`:""}</div>
    <div class="vb-cap"><b>${esc(g.title)}</b><span class="vb-meta"><span class="vb-hz vb-hz-${hz(g)}">${esc(HORIZON[hz(g)])}</span>${tg.map(t=>`<span title="${esc(VB_TAGS[t].l)}">${VB_TAGS[t].e}</span>`).join("")}</span>${p>0&&!done?`<span class="vb-bar"><i style="width:${p}%"></i></span>`:""}</div></div>`;
}
function vbQuote(q,r){ const col=["#fff3a8","#ffd6e0","#d4f1ff","#d9f7c8","#ffe4c2"][Math.floor(r()*5)];
  return `<div class="vb-note" style="--rot:${((r()*2-1)*5).toFixed(1)}deg;--nc:${col}"><i class="vb-tape" style="--tr:${((r()*2-1)*10).toFixed(0)}deg"></i><q>${esc(q[0])}</q>${q[1]?`<cite>— ${esc(q[1])}</cite>`:""}</div>`; }
function vbBoard(L){
  const seed=(S.vbSeed!=null?S.vbSeed:Math.floor(Date.now()/864e5)), r=vbRnd(seed*7919+13);
  const order=L.map(g=>({g,k:vbRnd(vbHash(g.id)^seed)()})).sort((a,b)=>a.k-b.k).map(x=>x.g);
  const qs=[...VB_QUOTES].map(q=>({q,k:r()})).sort((a,b)=>a.k-b.k).map(x=>x.q);
  const out=[]; let qi=0; const every=4+Math.floor(r()*2);
  order.forEach((g,i)=>{ if(i===1||(i>1&&(i-1)%every===0)) out.push(vbQuote(qs[qi++%qs.length],r)); out.push(vbCard(g,vbRnd(vbHash(g.id)+seed))); });
  if(order.length<2) out.push(vbQuote(qs[qi++%qs.length],r));
  out.push(`<button type="button" class="vb-card vb-add" style="--rot:${((r()*2-1)*3).toFixed(1)}deg;--dy:0px" data-vbnew="1"><span>＋</span><b>Pridať sen</b><small>alebo nahraj fotku či sken diára</small></button>`);
  return `<div class="vb-board">${out.join("")}</div>`;
}

async function vbLoad(file){ const url=URL.createObjectURL(file); const img=new Image(); img.decoding="async"; img.src=url; try{ await img.decode(); }catch(e){ await new Promise((ok,ko)=>{ img.onload=ok; img.onerror=ko; }); } return img; }
function vbCrop(img,b,max,q){ const sw=b?b.w:img.naturalWidth, sh=b?b.h:img.naturalHeight, sc=Math.min(1,max/Math.max(sw,sh)); const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(sw*sc)); c.height=Math.max(1,Math.round(sh*sc)); const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,b?b.x:0,b?b.y:0,sw,sh,0,0,c.width,c.height); return c; }
const vbBlob=(c,q)=>new Promise(ok=>c.toBlob(b=>ok(b),"image/jpeg",q||.84));
async function vbStore(canvas){ /* vráti {image} (príloha) alebo {img} (vložený obrázok) */
  if(S.assets){ const b=await vbBlob(canvas,.84); if(b){ const up=await uploadFiles([new File([b],"ciel-"+Date.now()+".jpg",{type:"image/jpeg"})]); if(up[0]) return {image:up[0].id,img:""}; } return null; }
  const c2=canvas.width>640||canvas.height>640?(()=>{ const s=640/Math.max(canvas.width,canvas.height), d=document.createElement("canvas"); d.width=Math.round(canvas.width*s); d.height=Math.round(canvas.height*s); d.getContext("2d").drawImage(canvas,0,0,d.width,d.height); return d; })():canvas;
  return {image:"",img:c2.toDataURL("image/jpeg",.72)};
}

/* ---------- Rozdelenie skenu diára na jednotlivé fotky (bez AI, priamo v zariadení) ---------- */
function vbDetect(img){
  const W0=img.naturalWidth, H0=img.naturalHeight, sc=Math.min(1,640/Math.max(W0,H0)), w=Math.max(8,Math.round(W0*sc)), h=Math.max(8,Math.round(H0*sc));
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const cx=cv.getContext("2d",{willReadFrequently:true}); cx.drawImage(img,0,0,w,h); const D=cx.getImageData(0,0,w,h).data;
  /* farba papiera = medián okrajových pixelov */
  const R=[],G=[],B=[]; const push=(x,y)=>{ const i=(y*w+x)*4; R.push(D[i]); G.push(D[i+1]); B.push(D[i+2]); };
  const bw=Math.max(2,Math.round(Math.min(w,h)*.02)); for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2) if(x<bw||y<bw||x>=w-bw||y>=h-bw) push(x,y);
  const med=a=>{ a.sort((p,q)=>p-q); return a[a.length>>1]; }; const br=med(R),bg=med(G),bb=med(B);
  const N=w*h, M=new Uint8Array(N);
  for(let p=0,i=0;p<N;p++,i+=4){ const dr=D[i]-br, dg=D[i+1]-bg, db=D[i+2]-bb; const mx=Math.max(D[i],D[i+1],D[i+2]), mn=Math.min(D[i],D[i+1],D[i+2]); M[p]=(dr*dr+dg*dg+db*db>2300||(mx-mn>70&&Math.abs(mx-Math.max(br,bg,bb))>25))?1:0; }
  const box=(src,r,mode)=>{ /* mode 1 = dilatácia (aspoň 1), 0 = erózia (všetky) – cez integrálny obraz */
    const I=new Int32Array((w+1)*(h+1)); for(let y=0;y<h;y++){ let s=0; for(let x=0;x<w;x++){ s+=src[y*w+x]; I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+s; } }
    const o=new Uint8Array(N); for(let y=0;y<h;y++){ const y0=Math.max(0,y-r), y1=Math.min(h,y+r+1); for(let x=0;x<w;x++){ const x0=Math.max(0,x-r), x1=Math.min(w,x+r+1); const s=I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0]; o[y*w+x]=mode?(s>0?1:0):(s===(y1-y0)*(x1-x0)?1:0); } } return o; };
  let A=box(box(M,2,0),2,1); /* otvorenie: zmizne písmo a linajky */
  const rc=Math.max(3,Math.round(Math.max(w,h)*.012)); A=box(box(A,rc,1),rc,0); /* uzavretie: zaplnia sa svetlé miesta vo fotke */
  const lab=new Int32Array(N), st=new Int32Array(N), boxes=[]; let nl=0;
  for(let p=0;p<N;p++){ if(!A[p]||lab[p]) continue; nl++; let sp=0; st[sp++]=p; lab[p]=nl; let x0=w,y0=h,x1=0,y1=0,c=0;
    while(sp){ const q=st[--sp], x=q%w, y=(q/w)|0; c++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
      if(x>0&&A[q-1]&&!lab[q-1]){lab[q-1]=nl;st[sp++]=q-1;} if(x<w-1&&A[q+1]&&!lab[q+1]){lab[q+1]=nl;st[sp++]=q+1;} if(y>0&&A[q-w]&&!lab[q-w]){lab[q-w]=nl;st[sp++]=q-w;} if(y<h-1&&A[q+w]&&!lab[q+w]){lab[q+w]=nl;st[sp++]=q+w;} }
    const bwid=x1-x0+1, bhei=y1-y0+1, ba=bwid*bhei; if(ba<N*.012||bwid<Math.min(w,h)*.08||bhei<Math.min(w,h)*.08||ba>N*.92||c/ba<.5||bwid/bhei>5||bhei/bwid>5) continue;
    boxes.push({x:x0,y:y0,w:bwid,h:bhei}); }
  const inside=(a,b)=>a.x>=b.x-2&&a.y>=b.y-2&&a.x+a.w<=b.x+b.w+2&&a.y+a.h<=b.y+b.h+2;
  let K=boxes.filter((a,i)=>!boxes.some((b,j)=>j!==i&&inside(a,b)&&b.w*b.h>a.w*a.h));
  const mh=K.length?K.map(b=>b.h).sort((p,q)=>p-q)[K.length>>1]:1;
  K.sort((a,b)=>Math.abs((a.y+a.h/2)-(b.y+b.h/2))<mh*.5?a.x-b.x:a.y-b.y);
  return K.slice(0,24).map(b=>{ const ins=Math.round(Math.min(b.w,b.h)*.015); return {x:Math.round((b.x+ins)/sc),y:Math.round((b.y+ins)/sc),w:Math.round((b.w-2*ins)/sc),h:Math.round((b.h-2*ins)/sc)}; });

async function uploadFiles(files){
  const out=[];
  if(!files.length) return out;
  if(!S.assets){ toast("Prílohy sa nedajú uložiť – nie si prihlásený."); return out; }
  const extType={csv:"text/csv",md:"text/markdown",txt:"text/plain",json:"application/json",pdf:"application/pdf"};
  for(const f of files){
    try{
      const ext=(f.name.split(".").pop()||"").toLowerCase();
      const opts=(!f.type||!/^(image\/(png|jpeg|gif|webp|svg\+xml)|application\/pdf|text\/(csv|markdown|plain)|application\/json|video\/(mp4|webm))$/.test(f.type))&&extType[ext]?{type:extType[ext]}:undefined;
      const r=await S.assets.upload(f,opts);
      out.push({id:r.id,name:f.name,type:r.contentType,size:r.sizeBytes});
    }catch(e){ toast(`${f.name}: ${e?.code==="unsupported_type"?"nepodporovaný typ súboru":e?.code==="too_large"?"príliš veľký súbor":e?.code==="quota_or_state"?"úložisko príloh je plné":"nahratie zlyhalo"}.`); }
  }
  return out;
}

const monthKey=d=>String(d||"").slice(0,7);
const curMonth=()=>S.exp.month||today().slice(0,7);
function shiftMonth(m,n){ const [y,mm]=m.split("-").map(Number); const d=new Date(y,mm-1+n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
const monthName=m=>{ const [y,mm]=m.split("-").map(Number); return MONTHS_N[mm-1]+" "+y; };
const expensesReal=()=>items().filter(i=>i.type==="vydavok"&&i.amount!=null&&Number.isFinite(+i.amount)&&ISO_RE.test(i.date||""));
const expenses=()=>{ const r=expensesReal(); let o=C.subs.length?r.concat(subExpenses(r)):r; if(C.recur.length) o=o.concat(recurExpenses(r)); return o; };
const sumC=arr=>arr.reduce((s,i)=>s+Math.round(+i.amount*100),0)/100;
function expStats(m){
  const all=expenses();
  const list=all.filter(i=>monthKey(i.date)===m).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||"").localeCompare(a.created||""));
  const cats={}; for(const i of list){ const k=EXPCAT[i.expcat]?i.expcat:"ine"; cats[k]=(cats[k]||0)+Math.round(+i.amount*100); }
  const catArr=Object.entries(cats).map(([k,c])=>[k,c/100]).sort((a,b)=>b[1]-a[1]);
  const prevM=shiftMonth(m,-1);
  const months=[]; for(let k=5;k>=0;k--){ const mk=shiftMonth(m,-k); months.push([mk,sumC(all.filter(i=>monthKey(i.date)===mk))]); }
  return {list,total:sumC(list),catArr,prev:sumC(all.filter(i=>monthKey(i.date)===prevM)),prevM,months};
}
function expSummaryText(n=6){
  const m0=today().slice(0,7); const out=[];
  for(let k=0;k<n;k++){ const m=shiftMonth(m0,-k); const st=expStats(m); if(!st.list.length) continue;
    out.push(`- ${monthName(m)}: spolu ${eur(st.total)} (${st.list.length} dokladov); ${st.catArr.map(([c,v])=>(EXPCAT[c]||c)+" "+eur(v)).join(", ")}`); }
  return out.join("\n")||"- žiadne výdavky v evidencii";
}

function newExpForm(){ S.exp.form={merchant:"",amount:"",date:today(),expcat:"potraviny",pay:"karta",note:""}; }
function clearExp(){ if(S.exp.preview){ try{ URL.revokeObjectURL(S.exp.preview); }catch(e){} } expCtl?.abort(); S.exp.form=null; S.exp.file=null; S.exp.preview=""; S.exp.busy=false; }
let expCtl=null;
async function startReceipt(file){
  if(file.size>20*1024*1024){ toast("Súbor je väčší ako 20 MB."); return; }
  clearExp(); newExpForm(); S.exp.file=file;
  const readable=/^image\/(jpeg|png|webp|gif)$/.test(file.type);
  if(readable) S.exp.preview=URL.createObjectURL(file);
  go("vydavky");
  if(!readable){ toast(file.type==="application/pdf"?"PDF doklad sa priloží, údaje vyplň ručne.":"Tento formát Claude nevie prečítať. Vyplň údaje ručne."); return; }
  if(!S.sample){ toast("Čítanie bločkov cez AI je zatiaľ v Claude. Vyplň údaje ručne."); return; }
  const lim=await S.sample.limits().catch(()=>null);
  if(!lim?.images){ toast("Posielanie fotiek do Claude tu nie je dostupné. Vyplň údaje ručne."); return; }
  S.exp.busy=true; renderView();
  const prompt=`Na obrázku je pokladničný doklad (bloček, často slovenský eKasa doklad) alebo faktúra za súkromný nákup. Dnes je ${today()}.
Vyčítaj presne, nič nevymýšľaj:
- merchant: obchodné meno predajcu tak, ako ho ľudia poznajú (napr. "Lidl", "Tesco", "Shell", "dm drogerie markt"), prípadne s mestom; nie celú adresu
- date: dátum nákupu YYYY-MM-DD
- total: celková suma na úhradu v EUR ako číslo s bodkou (riadok SPOLU / NA ÚHRADU / CELKOM), nie medzisúčet ani DPH
- category: jedna z ${Object.keys(EXPCAT).join(", ")}
- payment: "karta", "hotovost", "prevod" alebo "" ak nie je jasné
- items: najviac 5 najdrahších položiek [{"name":"...","price":0.00}]
- note: krátky opis nákupu po slovensky, max 80 znakov
Ak údaj nevieš prečítať, daj null. Nikdy neuvádzaj číslo platobnej karty, účtu ani autorizačný kód.
Odpovedz IBA JSON: {"merchant":null,"date":null,"total":null,"category":"ine","payment":"","items":[],"note":null}`;
  expCtl=new AbortController(); const ctl=expCtl;
  try{
    const r=await S.sample.json(prompt,{images:[file],cache:false,signal:ctl.signal});
    const F=S.exp.form; if(!F||S.exp.file!==file) return;
    if(r?.merchant) F.merchant=String(r.merchant).slice(0,120);
    if(r?.total!=null&&Number.isFinite(+r.total)&&+r.total>0) F.amount=String(Math.round(+r.total*100)/100);
    if(ISO_RE.test(String(r?.date||""))) F.date=String(r.date);
    if(EXPCAT[r?.category]) F.expcat=r.category;
    F.pay=PAY[r?.payment]!==undefined?String(r.payment||""):"";
    const its=Array.isArray(r?.items)?r.items.slice(0,5).filter(x=>x&&x.name).map(x=>`- ${String(x.name).slice(0,60)}${x.price!=null&&Number.isFinite(+x.price)?" – "+eur(+x.price):""}`).join("\n"):"";
    F.note=[r?.note?String(r.note).slice(0,200):"",its].filter(Boolean).join("\n");
    toast("Bloček prečítaný. Skontroluj údaje a ulož.");
  }catch(e){ if(e?.code!=="cancelled"){ toast(sErr(e)+" Vyplň údaje ručne."); if(aiOff.includes(e?.code)) S.sample=null; } }
  if(S.exp.file===file){ S.exp.busy=false; if(S.view==="financie") renderView(); }
}
async function saveExpense(){
  const F=S.exp.form; if(!F) return;
  const amt=+String(F.amount).replace(",",".");
  if(!Number.isFinite(amt)||amt<=0){ toast("Zadaj sumu väčšiu ako 0 €."); return; }
  if(!ISO_RE.test(F.date)){ toast("Zadaj dátum nákupu."); return; }
  const btn=$("#exSave"); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Ukladám…'; }

function retrieve(q){
  const all=items(); const words=norm(q).split(/[^a-z0-9]+/).filter(w=>w.length>=3);
  const stem=w=>w.length>5?w.slice(0,w.length-2):w;
  const scored=all.map(i=>{
    const T=norm(i.title), B=norm(i.body), G=norm((i.tags||[]).join(" "));
    let s=0; for(const w of words){ const st=stem(w); if(T.includes(st)) s+=5; if(G.includes(st)) s+=3; const c=B.split(st).length-1; s+=Math.min(c,6); }
    return {i,s};
  });
  const totalLen=all.reduce((a,i)=>a+(i.title.length+i.body.length),0);
  let pick;
  if(totalLen<90000) pick=scored.sort((a,b)=>b.s-a.s||(b.i.updated||"").localeCompare(a.i.updated||"")).map(x=>x.i);
  else {
    const hits=scored.filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.i).slice(0,40);
    const ids=new Set(hits.map(i=>i.id)); for(const h of hits.slice(0,10)) for(const n of [...(S.edges.out.get(h.id)||[]),...backlinks(h.id)]) ids.add(n);
    const recent=all.sort((a,b)=>(b.updated||"").localeCompare(a.updated||"")).slice(0,15); recent.forEach(i=>ids.add(i.id));
    pick=[...ids].map(id=>S.items.get(id)).filter(Boolean);
  }
  let budget=110000; const out=[];
  for(const i of pick){
    const extra=[i.status&&"stav: "+i.status,i.due&&"termín: "+i.due,i.date&&"dátum: "+i.date+(i.time?" "+i.time:"")+(i.repeat?" ("+REPEAT[i.repeat]+")":""),CALS[i.cal]&&"kalendár: "+CALS[i.cal],i.type==="vydavok"&&i.amount!=null&&"suma: "+eur(i.amount)+", kategória: "+(EXPCAT[i.expcat]||"Iné"),AREAS[i.area]&&"oblasť: "+AREAS[i.area],i.url&&"odkaz: "+i.url,i.project&&S.items.get(i.project)&&"projekt: "+S.items.get(i.project).title,(i.tags||[]).length&&"štítky: "+i.tags.join(", "),(i.attachments||[]).length&&"prílohy: "+i.attachments.map(a=>a.name).join(", ")].filter(Boolean).join("; ");
    const block=`### [[${i.title}]]\n(typ: ${TYPES[i.type]?.label}; vytvorené ${(i.created||"").slice(0,10)}; upravené ${(i.updated||"").slice(0,10)}${extra?"; "+extra:""})\n${String(i.body).slice(0,6000)}`;
    if(budget-block.length<0) break; budget-=block.length; out.push({id:i.id,block});
  }
  return out;
}

Odpovedaj po slovensky, presne a stručne. Vychádzaj VÝHRADNE zo záznamov nižšie. Ak odpoveď v záznamoch nie je, povedz to priamo a nič nedopĺňaj z vlastných vedomostí (môžeš na konci jednou vetou ponúknuť všeobecnú informáciu, jasne označenú ako „mimo tvojich záznamov“).

ZÁZNAMY (${ctx.length} z ${S.items.size}):

OTÁZKA: ${q}`;

let G=null;
function viewMapa(){
  return `<div class="view"><div class="band" style="--b1:var(--wgr-1);--b2:var(--wgr-2)"><div><h1>Mapa súvislostí</h1><p class="lead">Uzly sú záznamy, čiary sú prepojenia: ručné väzby, odkazy [[Názov]] v texte a príslušnosť k projektu. Ťahaj uzly, koliesko alebo tlačidlá menia priblíženie, klik otvorí záznam.</p></div></div>${stateBanner()}
  <div class="legend" id="legend">${Object.entries(TYPES).map(([k,t])=>`<label><input type="checkbox" data-gt="${k}" ${S.graph.hidden.has(k)?"":"checked"}>${dot(k)}${t.plural}</label>`).join("")}<label><input type="checkbox" id="gTags" ${S.graph.tags?"checked":""}><span class="tag" style="cursor:inherit">#</span>Štítky ako uzly</label></div>
  <section class="panel graph-wrap"><canvas id="graph" aria-label="Graf prepojení záznamov"></canvas><div class="graph-ctl"><button class="btn sm" id="gIn" type="button" aria-label="Priblížiť">+</button><button class="btn sm" id="gOut" type="button" aria-label="Oddialiť">−</button><button class="btn sm" id="gFit" type="button">Vycentrovať</button></div></section>
  <div id="gInfo" style="font-size:13px;color:var(--muted)"></div></div>`;
}
function graphModel(){
  const nodes=[], idx=new Map(), links=[];
  const old=G?.idx;
  const add=(id,label,type,isTag)=>{ const p=old?.get(id); const n={id,label,type,isTag,x:p?p.x:(Math.random()-.5)*400,y:p?p.y:(Math.random()-.5)*400,vx:0,vy:0,deg:0}; idx.set(id,n); nodes.push(n); return n; };
  for(const it of S.items.values()) if(!S.graph.hidden.has(it.type)) add(it.id,it.title||"Bez názvu",it.type,false);
  const seen=new Set();
  for(const it of S.items.values()){ if(!idx.has(it.id)) continue; for(const t of (S.edges.out.get(it.id)||[])){ if(!idx.has(t)) continue; const k=[it.id,t].sort().join("|"); if(seen.has(k)) continue; seen.add(k); links.push([idx.get(it.id),idx.get(t)]); } }
  if(S.graph.tags){ for(const it of S.items.values()){ if(!idx.has(it.id)) continue; for(const tg of it.tags||[]){ const tid="#"+tg; const tn=idx.get(tid)||add(tid,"#"+tg,"tag",true); links.push([idx.get(it.id),tn]); } } }
  for(const [a,b] of links){ a.deg++; b.deg++; }
  return {nodes,idx,links};
}
function startGraph(){
  const cv=$("#graph"); if(!cv) return;
  G={...graphModel(),cv,ctx:cv.getContext("2d"),scale:1,ox:0,oy:0,alpha:1,raf:0,drag:null,hover:null};
  $("#legend").addEventListener("change",e=>{ if(e.target.id==="gTags") S.graph.tags=e.target.checked; else if(e.target.dataset.gt){ e.target.checked?S.graph.hidden.delete(e.target.dataset.gt):S.graph.hidden.add(e.target.dataset.gt);} rebuildGraph(); });
  $("#gIn").onclick=()=>zoom(1.25); $("#gOut").onclick=()=>zoom(.8); $("#gFit").onclick=fit;
  const ro=new ResizeObserver(()=>{sizeCanvas(); draw();}); ro.observe(cv); G.ro=ro;
  sizeCanvas(); bindGraphPointer(); G.alpha=1; tick(); setTimeout(fit,900);
  info();
}
function info(){ const el=$("#gInfo"); if(el&&G) el.textContent=`${G.nodes.length} uzlov · ${G.links.length} prepojení · ${G.nodes.filter(n=>!n.deg&&!n.isTag).length} samostatných záznamov`; }
function rebuildGraph(){ if(!G) return; Object.assign(G,graphModel()); G.alpha=Math.max(G.alpha,.6); info(); if(!G.raf) tick(); }
function stopGraph(){ if(G){ cancelAnimationFrame(G.raf); G.ro?.disconnect(); } G=null; }
function sizeCanvas(){ const cv=G.cv, r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=Math.max(1,r.width*d); cv.height=Math.max(1,r.height*d); G.w=r.width; G.h=r.height; G.dpr=d; }
function tick(){
  if(!G) return;
  const {nodes,links}=G; const a=G.alpha;
  if(a>0.02){
    for(let i=0;i<nodes.length;i++){ const n=nodes[i]; for(let j=i+1;j<nodes.length;j++){ const m=nodes[j]; let dx=n.x-m.x, dy=n.y-m.y, d2=dx*dx+dy*dy+0.01; if(d2>250000) continue; const f=1800/d2*a; const d=Math.sqrt(d2); dx/=d; dy/=d; n.vx+=dx*f; n.vy+=dy*f; m.vx-=dx*f; m.vy-=dy*f; } }
    for(const [s,t] of links){ let dx=t.x-s.x, dy=t.y-s.y; const d=Math.sqrt(dx*dx+dy*dy)||1; const L=t.isTag||s.isTag?70:90; const f=(d-L)*0.04*a; dx/=d; dy/=d; s.vx+=dx*f; s.vy+=dy*f; t.vx-=dx*f; t.vy-=dy*f; }
    for(const n of nodes){ n.vx-=n.x*0.004*a*(n.deg?1:2.2); n.vy-=n.y*0.004*a*(n.deg?1:2.2); if(G.drag?.node===n) { n.vx=n.vy=0; continue; } n.vx*=0.82; n.vy*=0.82; n.x+=Math.max(-30,Math.min(30,n.vx)); n.y+=Math.max(-30,Math.min(30,n.vy)); }

  }

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function draw(){

function toWorld(e){ const r=G.cv.getBoundingClientRect(); return {x:(e.clientX-r.left-G.w/2-G.ox)/G.scale,y:(e.clientY-r.top-G.h/2-G.oy)/G.scale}; }

/* Uložiť: prevezme aktuálne hodnoty z polí, uloží, zavrie okno; udalosť a úlohu s termínom ukáže v kalendári */
async function saveCloseDrawer(){
  if(!D||D.saving) return; const it=D.it; const v=id=>{ const el=document.getElementById(id); return el?el.value:null; };
  const sync=[["dTitle","title"],["dBody","body"],["dDate","date"],["dTime","time"],["dCal","cal"],["dRep","repeat"],["dDue","due"],["dArea","area"],["dStatusSel","status"],["dProj","project"],["dUrl","url"]];
  for(const [id,k] of sync){ const x=v(id); if(x!=null) it[k]=k==="url"?x.trim():x; }
  if(v("dAmt")!=null) it.amount=v("dAmt")===""?null:+v("dAmt");
  if(!String(it.title||"").trim()&&!String(it.body||"").trim()){ toast("Zadaj názov."); $("#dTitle")?.focus(); return; }
  if(it.type==="udalost"&&!ISO_RE.test(it.date||"")){ toast("Zadaj dátum udalosti."); $("#dDate")?.focus(); return; }
  if(!String(it.title||"").trim()) it.title=snippet(it.body,60)||"Bez názvu";
  clearTimeout(D.timer); D.saving=true; const b=$("#dSaveClose"); if(b){ b.disabled=true; b.innerHTML='<span class="spin"></span> Ukladám…'; }
  const id=D.id; const ok=await saveItem(id,it);
  if(!ok){ if(D&&D.id===id){ D.saving=false; if(b){ b.disabled=false; b.textContent=it.type==="udalost"?"Uložiť do kalendára":"Uložiť"; } } return; }
  D=null; $("#drawerRoot").innerHTML="";
  const day=it.type==="udalost"?it.date:(it.type==="uloha"&&ISO_RE.test(it.due||"")?it.due:"");
  if(day){ S.calDay=day===today()?"":day; go("kalendar"); toast(`Uložené: ${it.title} · ${fmtDate(day)}${it.type==="udalost"&&it.time?" "+it.time:""}`); }
  else toast("Uložené");
}

const wq2=new Map();
function put(col,id,data,merge){
  if(!S.db){ toast("Úložisko nie je dostupné."); return Promise.resolve(false); }
  const path=col+"/"+id;
  const p=(wq2.get(path)||Promise.resolve()).then(()=>merge?S.db.doc(path).update(data):S.db.doc(path).set(data)).then(()=>true)
    .catch(e=>{ toast(e?.code==="quota_exceeded"?"Úložisko je plné.":"Uloženie zlyhalo. Skús to znova."); return false; });

  for(const t of C.trips){ const cal=t.kind==="rodinny"?"rodina":"osobne";

  for(const s of C.subs){ if(subPayer(s)==="osobne") for(const d of subOcc(s,from,to)) out.push({d,it:{id:"sub-"+s.id+"-"+d,type:"udalost",title:"Predplatné: "+(s.name||"")+" · "+eur(s.amount),cal:"financie",area:"financie",time:"",_go:"financie/predplatne"}});
    if(subActive(s)&&ISO_RE.test(s.cancelBy||"")&&s.cancelBy>=from&&s.cancelBy<=to) out.push({d:s.cancelBy,it:{id:"subc-"+s.id,type:"udalost",title:"Zrušiť / rozhodnúť: "+(s.name||"predplatné"),cal:subPayer(s)==="osobne"?"financie":"biznis",time:"",_go:"financie/predplatne"}}); }

  out.push(...gcalEvents(from,to));

/* 7 džbánov – model z metodiky „Mysli, Konaj, Zbohatni Naživo“ (Andy Winson 2026, s. 49–50) */
const JAR_MODEL=[
  {id:"ufs",short:"ÚFS",name:"Účet finančnej slobody",pct:10,desc:"budovanie majetku"},
  {id:"du",short:"DÚ",name:"Dlhodobý účet",pct:10,desc:"úspory na budúce potreby – rezerva a plánované nákupy"},

  {id:"uz",short:"ÚZ",name:"Zábava a radosť",pct:10,desc:"čo si s radosťou doprajem"},
  {id:"ud",short:"ÚD",name:"Darovanie a pomoc",pct:5,desc:"darovanie a pomoc"},

/* Predvolené priradenie kategórie výdavku k džbánu (dá sa zmeniť v karte 7 džbánov) */
const JAR_CATS_DEF={potraviny:"unv",domacnost:"unv",byvanie:"unv",auto:"unv",deti:"unv",zdravie:"unv",oblecenie:"unv",sport:"uz",restauracie:"uz",vzdelavanie:"uv",darceky:"ud",predplatne:"uz",ine:""};
function jarsCfg(){ const s=setting("jars"); return (Array.isArray(s?.jars)?s.jars:[]).filter(j=>j&&j.id&&j.name); }
function jarsSet(){ const s=setting("jars")||{}; const d=num(s.duReservePct);
  return {cats:s.cats&&typeof s.cats==="object"?s.cats:JAR_CATS_DEF,loanJar:s.loanJar!=null?s.loanJar:"unv",round:s.round!==false,duRes:d!=null?Math.min(100,Math.max(0,d)):50}; }
const jarsSum=()=>jarsCfg().reduce((a,x)=>a+(+x.pct||0),0);
const jarsOk=()=>jarsCfg().length>0&&Math.abs(jarsSum()-100)<0.01;
/* Rozdelenie sumy: každý džbán svoje %; pri zaokrúhľovaní na celé eurá idú drobné do bonusového džbánu (bez neho do posledného džbánu s %). */
function allocSplit(amount,jars,round){
  const tot=Math.round((+amount||0)*100), o={}; if(!jars.length) return o;
  const rest=jars.find(x=>x.bonus)||jars.filter(x=>(+x.pct||0)>0).slice(-1)[0]||jars[jars.length-1]; let used=0;
  for(const x of jars){ if(x===rest) continue; const raw=tot*(+x.pct||0)/100, c=round?Math.floor(raw/100)*100:Math.floor(raw+1e-6); used+=c; o[x.id]=c/100; }
  o[rest.id]=(tot-used)/100; return o;
}
function allocOf(inc){
  if(inc.alloc&&Object.keys(inc.alloc).length) return inc.alloc;
  if(!jarsOk()) return {};
  return allocSplit(inc.amount,jarsCfg(),jarsSet().round);
}
/* Možnosti výberu džbánu pri výdavku; „du#rez“ = z dlhodobého účtu, časť rezerva */
function jarOpts(){ const o=[]; for(const j of jarsCfg()){ const nm=(j.short?j.short+" · ":"")+j.name; o.push([j.id,nm]); if(j.id==="du") o.push(["du#rez",nm+" – rezerva"]); } return o; }
function jarOfExp(e,cats){ const v=String(e.jar||""); if(v) return v; const c=cats||jarsSet().cats; return c[EXPCAT[e.expcat]?e.expcat:"ine"]||""; }
function jarBalances(){
  const b={}, cfg=jarsSet(); jarsCfg().forEach(x=>b[x.id]={alloc:0,spent:0,loans:0});
  let first=""; for(const inc of C.income){ const a=allocOf(inc); for(const k in a) if(b[k]) b[k].alloc+=Math.round(a[k]*100); if(ISO_RE.test(inc.date||"")&&(!first||inc.date<first)) first=inc.date; }
  const du=b.du; if(du){ du.rezAlloc=Math.round(du.alloc*cfg.duRes/100); du.rezSpent=0; }
  /* výdavky sa počítajú od prvého rozdeleného príjmu */
  if(first){ for(const e of expenses()){ if(String(e.date||"")<first) continue; const v=jarOfExp(e,cfg.cats); if(!v) continue; const [k,sub]=v.split("#"); if(!b[k]) continue; const c=Math.round(+e.amount*100); b[k].spent+=c; if(du&&k==="du"&&sub==="rez") du.rezSpent+=c; }
    if(cfg.loanJar&&b[cfg.loanJar]){ const m0=today().slice(0,7); for(let m=first.slice(0,7),i=0;m<=m0&&i<240;m=shiftMonth(m,1),i++){ const c=Math.round(loanPayMonth(m)*100); b[cfg.loanJar].spent+=c; b[cfg.loanJar].loans+=c; } } }
  for(const k in b) for(const f of ["alloc","spent","loans","rezAlloc","rezSpent"]) if(b[k][f]!=null) b[k][f]/=100;
  return b;
}
const sumAmt=arr=>arr.reduce((s,i)=>s+Math.round((+i.amount||0)*100),0)/100;
const incMonth=m=>C.income.filter(i=>monthKey(i.date)===m);
function nextPayDate(day,from){ day=Math.min(31,Math.max(1,Math.round(+day)||1)); const f=pd(from);
  for(let i=0;i<3;i++){ const y=f.getFullYear(), mo=f.getMonth()+i; const last=new Date(y,mo+1,0).getDate(); const c=isoD(new Date(y,mo,Math.min(day,last))); if(c>=from) return c; } return ""; }
function loanCalc(l){
  const P=num(l.payment)||0, B=num(l.balance)||0, r=(num(l.rate)||0)/1200; let n=null, note="";
  if(B<=0) return {n:0,paidPct:100,note:"Splatené"};
  if(P>0){ if(r>0){ if(r*B>=P) note="splátka nepokrýva úrok"; else n=Math.ceil(-Math.log(1-r*B/P)/Math.log(1+r)); } else { n=Math.ceil(B/P); note="bez zadaného úroku, orientačne"; } }
  const pr=num(l.principal); const paidPct=pr>0?Math.max(0,Math.min(100,(1-B/pr)*100)):null;
  const first=l.payDay?nextPayDate(l.payDay,today()):"";
  const payoff=n&&first?addMonths(first,n-1):"";
  const totalLeft=n!=null?Math.round(n*P*100)/100:null;
  return {n,note,paidPct,payoff,interestLeft:totalLeft!=null&&r>0?Math.max(0,Math.round((totalLeft-B)*100)/100):null};
}
const activeLoans=()=>C.loans.filter(l=>!(num(l.balance)!=null&&num(l.balance)<=0));
function monthNav(m,isCur){ return `<div class="toolbar"><div class="monthnav"><button class="btn sm" type="button" data-mnav="-1" aria-label="Predchádzajúci mesiac">‹</button><b>${monthName(m)}</b><button class="btn sm" type="button" data-mnav="1" ${isCur?"disabled":""} aria-label="Nasledujúci mesiac">›</button></div></div>`; }

function donut(arr,labels,{sub="",aria=""}={}){ const tot=arr.reduce((s,x)=>s+x[1],0);
  if(!(tot>0)) return `<div class="empty" style="padding:6px 0">Za toto obdobie zatiaľ bez údajov.</div>`;
  const top=arr.slice(0,7), rest=arr.slice(7).reduce((s,x)=>s+x[1],0);
  const segs=[...top.map(([k,v],i)=>({l:labels[k]||k,v,c:`var(--s${i+1})`})),...(rest>0?[{l:"Ostatné",v:rest,c:"var(--faint)"}]:[])];
  const r=62, C2=2*Math.PI*r, gap=segs.length>1?2:0; let off=0;
  const arcs=segs.map(s=>{ const len=s.v/tot*C2, d=Math.max(.5,len-gap); const a=`<circle class="dn-seg" r="${r}" cx="80" cy="80" fill="none" stroke="${s.c}" stroke-width="24" stroke-dasharray="${d.toFixed(2)} ${(C2-d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 80 80)"><title>${esc(s.l)}: ${eur(s.v)} (${Math.round(s.v/tot*100)} %)</title></circle>`; off+=len; return a; }).join("");
  return `<div class="donut"><svg viewBox="0 0 160 160" role="img" aria-label="${esc(aria||sub)}: spolu ${eur(tot)}">${arcs}<text x="80" y="78" text-anchor="middle" class="dn-v">${esc(eur0(tot))}</text><text x="80" y="96" text-anchor="middle" class="dn-l">${esc(sub)}</text></svg>
    <div class="slegend">${segs.map(s=>`<span><i class="sw" style="background:${s.c}"></i>${esc(s.l)}<em>${eur(s.v)} · ${Math.round(s.v/tot*100)} %</em></span>`).join("")}</div></div>`; }

  const outs=bzOut(co).sort((a,b)=>(num(b.amount)||0)-(num(a.amount)||0)), monthly=r2(outs.filter(o=>!o.end||o.end>=td).reduce((s,o)=>s+bzMonthly(o),0));

  </div>

  </div></section>
  <section class="panel"><div class="panel-h"><h2>Výdaje · ${esc(R.label)}</h2><span class="count">${eur(sumAmt(expL))}${EC.tot>sumAmt(expL)?` + pravidelné ${eur(r2(EC.tot-sumAmt(expL)))}`:""}</span></div>

function jarActual(W){ const m0=today().slice(0,7), ms=[]; for(let k=1;k<=6&&ms.length<3;k++){ const m=shiftMonth(m0,-k); if(incMonth(m).length||expStats(m).list.length) ms.push(m); }
  const by={}; let inc=0; const ids=new Set(W.jars.map(j=>j.id));
  for(const m of ms){ inc+=sumAmt(incMonth(m)); for(const e of expStats(m).list){ const k=jarOfExp(e,W.cats).split("#")[0]; if(k&&ids.has(k)) by[k]=(by[k]||0)+Math.round(+e.amount*100); else by._none=(by._none||0)+Math.round(+e.amount*100); }
    if(W.loanJar&&ids.has(W.loanJar)) by[W.loanJar]=(by[W.loanJar]||0)+Math.round(loanPayMonth(m)*100); }
  const n=ms.length||1; for(const k in by) by[k]=r2(by[k]/100/n); return {ms,inc:r2(inc/n),by}; }

/* Udalosti z Google Kalendára (kolekcia gcal – zapisuje ranný agent) */
const GCAL_CAL=c=>CALS[c]?c:"osobne";
function gcalEvents(from,to){ const out=[]; for(const g of C.gcal){ if(!ISO_RE.test(g.date||"")||g.status==="cancelled") continue; const end=ISO_RE.test(g.endDate||"")&&g.endDate>=g.date?g.endDate:g.date;
  if(end<from||g.date>to) continue; let d=g.date<from?from:g.date, k=0; while(d<=end&&d<=to&&k<62){ out.push({d,it:{id:"gc-"+g.id+"-"+d,type:"udalost",title:(g.title||"Udalosť")+(g.location?" · "+String(g.location).split(",")[0]:""),cal:GCAL_CAL(g.cal),area:g.cal==="rodina"?"rodina":"",time:d===g.date?(g.time||""):"",_end:d===g.date&&(!g.endDate||g.endDate===g.date)?(g.endTime||""):"",_go:"kalendar",_gcal:true}}); d=addDays(d,1); k++; } }
  return out; }

const CAR_COLOR = {biela:["Biela","#f6f7f9","#bfc6cf"],cierna:["Čierna","#3a3e46","#121418"],siva:["Sivá","#8d939c","#50565e"],strieborna:["Strieborná","#d3d7dd","#8b929b"],modra:["Modrá","#3a6cc4","#1a3570"],cervena:["Červená","#cf3530","#7a1714"],zelena:["Zelená","#33734f","#183b28"],bezova:["Béžová","#cdbd9f","#8c7b5e"]};
const isEV = c=>c?.fuel==="ev";
/* Riadky termínov. Intervaly pre elektromobil podľa Tesla Owner's Manual (Model 3 2017–2023, Maintenance Service Intervals). */
const CAR_ROWS = [
  {k:"stk",l:"STK",ic:"stk",t:"date",log:"stk",hint:"Prvá po 4 rokoch od 1. evidencie, potom každé 2 roky"},
  {k:"ek",l:"Emisná kontrola",ic:"ek",t:"date",log:"ek",noEV:true},
  {k:"pzp",l:"PZP poistka",ic:"pzp",t:"date",log:"pzp"},
  {k:"hav",l:"Havarijná poistka",ic:"hav",t:"date",log:"hav"},
  {k:"vignette",l:"Diaľničná známka",ic:"vignette",t:"date",log:"vignette"},
  {k:"lastOilKm",l:"Výmena oleja",ic:"olej",t:"iv",lk:"lastOilKm",ld:"lastOilDate",ik:"oilKm",im:"oilMonths",log:"olej",noEV:true},
  {k:"lastSvcKm",l:"Servis",ic:"servis",t:"iv",lk:"lastSvcKm",ld:"lastSvcDate",ik:"svcKm",im:"svcMonths",log:"servis"},
  {k:"brake",l:"Brzdová kvapalina – kontrola",ic:"brzdy",t:"iv",ld:"lastBrakeDate",fm:48,log:"brzdy",onlyEV:true,hint:"každé 4 roky"},
  {k:"cabin",l:"Kabínový filter",ic:"filter",t:"iv",ld:"lastCabinDate",fm:24,log:"filter",onlyEV:true,hint:"každé 2 roky"},
  {k:"rot",l:"Rotácia pneumatík",ic:"rotacia",t:"iv",lk:"lastRotKm",fk:10000,log:"rotacia",onlyEV:true,hint:"každých 10\u00a0000 km"},
  {k:"cal",l:"Čistenie a mazanie strmeňov",ic:"strmene",t:"iv",lk:"lastCalKm",ld:"lastCalDate",fk:20000,fm:12,log:"strmene",onlyEV:true,hint:"každý rok / 20\u00a0000 km pri solených cestách"}
];
const carRowsFor = c=>CAR_ROWS.filter(r=>!(r.noEV&&isEV(c))&&!(r.onlyEV&&!isEV(c)));
const carDateKeys = c=>CAR_DATES.filter(([k])=>!(k==="ek"&&isEV(c)));
function dueState(days,kmLeft){ if((days!=null&&days<0)||(kmLeft!=null&&kmLeft<0)) return "crit"; if((days!=null&&days<=30)||(kmLeft!=null&&kmLeft<=1000)) return "warn"; return "ok"; }
function carRowCalc(c,r){
  if(r.t==="date"){ if(!ISO_RE.test(c[r.k]||"")) return null; const n=dayDiff(c[r.k]); return {k:r.k,l:r.l,date:c[r.k],days:n,state:dueState(n,null)}; }
  const ivKm=r.fk||num(c[r.ik]), ivM=r.fm||num(c[r.im]);
  const lastKm=r.lk?num(c[r.lk]):null, lastD=r.ld&&ISO_RE.test(c[r.ld]||"")?c[r.ld]:"";
  const kmNext=lastKm!=null&&ivKm?lastKm+ivKm:null, dNext=lastD&&ivM?addMonths(lastD,ivM):"";
  if(kmNext==null&&!dNext) return null;
  const kmLeft=kmNext!=null&&num(c.km)!=null?kmNext-num(c.km):null, days=dNext?dayDiff(dNext):null;
  let pct=null; if(kmLeft!=null&&ivKm) pct=1-kmLeft/ivKm; if(days!=null&&ivM&&lastD){ const tot=dayDiff(dNext)-dayDiff(lastD); const p2=tot>0?1-days/tot:null; if(p2!=null) pct=pct==null?p2:Math.max(pct,p2); }
  return {k:r.k,l:r.l,date:dNext,km:kmNext,kmLeft,days,state:dueState(days,kmLeft),pct:pct==null?null:Math.max(0,Math.min(1,pct)),lastKm,lastD};
}
function carDeadlines(c){ return carRowsFor(c).map(r=>carRowCalc(c,r)).filter(Boolean); }
function carWorst(c){ const ord={crit:0,warn:1,ok:2}; return carDeadlines(c).sort((a,b)=>(ord[a.state]-ord[b.state])||((a.days??9999)-(b.days??9999)))[0]||null; }

/* Ilustrácia auta – všeobecný bočný profil (nie je to podoba konkrétnej značky) */

  const col=CAR_COLOR[c.color]||CAR_COLOR.strieborna, u="cv"+String(uid||c.id||"x").replace(/[^a-z0-9]/gi,"");
  const mpv=c.body==="mpv";
  const body=mpv
    ? "M30 118 L27 94 Q26 62 40 50 L60 37 Q68 32 88 32 L252 32 Q268 32 280 43 L318 74 L356 82 Q374 86 376 102 L374 118 L334 118 A29 29 0 0 0 276 118 L124 118 A29 29 0 0 0 66 118 Z"
    : "M30 118 L28 100 Q30 86 48 82 L112 74 C140 50 172 41 210 41 C246 41 272 52 300 72 L352 82 Q372 86 374 100 L372 118 L334 118 A29 29 0 0 0 276 118 L124 118 A29 29 0 0 0 66 118 Z";
  const glass=mpv
    ? "M46 74 L50 52 Q54 42 70 40 L250 40 Q263 40 272 49 L301 75 Z"
    : "M120 77 C146 56 174 48 208 48 C240 48 262 57 287 75 Z";
  const pillars=mpv?`<path d="M122 40 L120 75 M206 40 L206 75" stroke="url(#${u}b)" stroke-width="6"/>`:`<path d="M206 47 L206 76" stroke="url(#${u}b)" stroke-width="5"/>`;
  const wheel=x=>`<g transform="translate(${x} 122)"><circle r="26" fill="#17191d"/><circle r="24" fill="none" stroke="#2b2f36" stroke-width="2"/><circle r="17" fill="url(#${u}r)"/>${[0,72,144,216,288].map(a=>`<path d="M0 -4 L-3.2 -15.5 L3.2 -15.5 Z" fill="#5f666f" transform="rotate(${a})"/>`).join("")}<circle r="4.5" fill="#3a4048"/></g>`;
  return `<svg class="car-svg" viewBox="0 0 400 150" role="img" aria-label="${esc(c.name||"Auto")}"><defs>
  <linearGradient id="${u}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col[1]}"/><stop offset=".55" stop-color="${col[1]}"/><stop offset="1" stop-color="${col[2]}"/></linearGradient>
  <linearGradient id="${u}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4a5a"/><stop offset=".5" stop-color="#18212b"/><stop offset="1" stop-color="#0c1117"/></linearGradient>
  <radialGradient id="${u}r" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#e3e7ec"/><stop offset="1" stop-color="#7a828c"/></radialGradient>
  <radialGradient id="${u}s" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs>
  <ellipse cx="200" cy="140" rx="190" ry="11" fill="url(#${u}s)"/>
  <path d="${body}" fill="url(#${u}b)"/>
  <path d="${glass}" fill="url(#${u}g)"/>${pillars}
  <path d="M40 96 Q200 90 366 96" stroke="#fff" stroke-opacity=".28" stroke-width="1.5" fill="none"/>
  <path d="M206 80 L206 116 M${mpv?122:132} 80 L${mpv?122:130} 114" stroke="#000" stroke-opacity=".18" stroke-width="1.2"/>
  <rect x="${mpv?178:180}" y="86" width="16" height="3.5" rx="1.7" fill="#000" fill-opacity=".25"/><rect x="${mpv?256:250}" y="86" width="16" height="3.5" rx="1.7" fill="#000" fill-opacity=".25"/>
  <path d="M358 88 L372 92 L372 97 L356 94 Z" fill="#fdf6d8"/><path d="M29 90 L44 88 L44 94 L29 96 Z" fill="#c8241d"/>
  ${wheel(95)}${wheel(305)}</svg>`;
}
const carPic=(c,uid)=>/^[0-9a-f]{32}$/.test(c.photo||"")?`<img class="car-photo" src="_blob/${esc(c.photo)}" alt="${esc(c.name||"Auto")}">`:carSvg(c,uid);

const ci=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${CI[k]||CI.ine}</svg>`;
const LOG_IC = {olej:"olej",servis:"servis",pneu:"pneu",stk:"stk",ek:"ek",pzp:"pzp",hav:"hav",vignette:"vignette",oprava:"oprava",brzdy:"brzdy",filter:"filter",rotacia:"rotacia",strmene:"strmene",ine:"ine"};

function carStatus(c){ const w=carWorst(c);
  if(!w) return {cls:"none",t:"Doplň termíny"};
  if(w.state==="ok") return {cls:"ok",t:"Všetko v poriadku"};
  const r=[w.kmLeft!=null?(w.kmLeft<0?fmtKm(-w.kmLeft)+" prekročené":"o "+fmtKm(w.kmLeft)):"",w.days!=null?daysTxt(w.days):""].filter(Boolean)[0]||"";
  return {cls:w.state,t:w.l+" · "+r}; }
const leftTxt=d=>[d.kmLeft!=null?(d.kmLeft<0?fmtKm(-d.kmLeft)+" po":"o "+fmtKm(d.kmLeft)):"",d.days!=null?daysTxt(d.days):""].filter(Boolean)[0]||"";
const carSub=c=>[c.year,CAR_COLOR[c.color]?.[0]?.toLowerCase(),c.plate].filter(Boolean).map(x=>esc(String(x))).join(" · ");

function viewAuta(){
  const c0=S.carId&&byId("cars",S.carId); if(c0) return viewCar(c0);
  return `<div class="view"><div class="band" style="--b1:var(--ws-1);--b2:var(--ws-2)"><div><div class="eyebrow">STK, poistky, olej, servis, pneumatiky</div><h1>Autá</h1></div><div class="actions"><button class="btn primary" type="button" id="carAdd">+ Auto</button></div></div>${stateBanner()}${formPanel()}
  ${C.cars.length?`<div class="garage">${C.cars.slice().sort((a,b)=>(a.order??99)-(b.order??99)||String(a.name).localeCompare(String(b.name))).map(c=>{ const st=carStatus(c), km=num(c.km);
    return `<div class="gcar" data-car="${esc(c.id)}" role="button" tabindex="0"><div class="gstage">${carPic(c,"g"+c.id)}</div><div class="ginfo"><div style="min-width:0"><b>${esc(c.name||"Auto")}</b><span>${carSub(c)||"&nbsp;"}</span></div>${km!=null?`<span class="gkm">${fmtKm(km)}</span>`:""}</div><div class="gst ${st.cls}"><i></i>${esc(st.t)}</div></div>`; }).join("")}</div>`
  :`<section class="panel panel-b" style="color:var(--muted)">Zatiaľ žiadne auto. Pridaj ho tlačidlom + Auto.</section>`}</div>`; }

function viewCar(c){
  const st=carStatus(c), km=num(c.km), rows=carRowsFor(c), log=(c.log||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const row=r=>{ const d=carRowCalc(c,r);
    if(!d) return `<div class="crow none" data-crow="${r.k}" role="button" tabindex="0"><span class="cic">${ci(r.ic)}</span><div class="cmain"><b>${esc(r.l)}</b><span>Nezadané – ťukni a doplň${r.hint?` · ${esc(r.hint)}`:""}</span></div><span class="cchev">${ci("chev")}</span></div>`;
    const main=r.t==="date"?`${r.k==="pzp"||r.k==="hav"?"splatnosť":"platná do"} ${fmtDate(d.date)}`:[d.km!=null?"pri "+fmtKm(d.km):"",d.date?"do "+fmtDate(d.date):""].filter(Boolean).join(" · ");
    const last=r.t==="iv"&&(d.lastD||d.lastKm!=null)?`<span class="clast">naposledy ${[d.lastD?fmtDate(d.lastD):"",d.lastKm!=null?fmtKm(d.lastKm):""].filter(Boolean).join(" · ")}</span>`:"";
    const pill=leftTxt(d);
    let btn=""; if(r.t==="date"&&d.days!=null&&d.days<=7){ const key=`c-${c.id}-${r.k}-${d.date}`; btn=isDone(key)?'<span class="confirmed">✓ vybavené</span>':`<button class="btn sm" type="button" data-confirm="${esc(key)}" data-clabel="${esc(r.l+" – "+(c.name||"auto"))}" data-after="car:${esc(c.id)}:${esc(r.k)}">Hotovo</button>`; }
    return `<div class="crow ${d.state}" data-crow="${r.k}" role="button" tabindex="0"><span class="cic">${ci(r.ic)}</span><div class="cmain"><b>${esc(r.l)}</b><span>${main}</span>${last}${d.pct!=null?`<span class="cbar"><i style="width:${Math.round(d.pct*100)}%"></i></span>`:""}</div><div class="cside"><span class="cpill">${esc(pill)}</span>${btn}</div></div>`; };
  const tires=`<div class="crow ${c.tireSeason?"ok":"none"} info" data-crow="tires" role="button" tabindex="0"><span class="cic">${ci("pneu")}</span><div class="cmain"><b>Pneumatiky</b><span>${c.tireSeason?esc(TIRE[c.tireSeason]||"")+(num(c.tireMm)!=null?` · dezén ${String(c.tireMm).replace(".",",")} mm`:""):"Nezadané – ťukni a doplň"}</span>${c.tireDate?`<span class="clast">prezuté ${fmtDate(c.tireDate)}</span>`:""}</div>${num(c.tireMm)!=null&&num(c.tireMm)<4?`<div class="cside"><span class="cpill" style="color:var(--warn)">${num(c.tireMm)<1.6?"pod zákonným minimom":"zváž výmenu"}</span></div>`:`<span class="cchev">${ci("chev")}</span>`}</div>`;
  return `<div class="view car-view">
  <div class="cstage">
    <div class="ctop"><button class="cback" type="button" id="carBack" aria-label="Späť na autá">‹ Autá</button><span class="cst ${st.cls}"><i></i>${esc(st.t)}</span></div>
    <div class="chead"><h1>${esc(c.name||"Auto")}</h1><div class="csub">${carSub(c)}</div></div>
    <div class="cpic">${carPic(c,"d"+c.id)}</div>
    <div class="cstats">${km!=null?`<div><b>${fmtKm(km)}</b><span>${c.kmDate?"k "+fmtDate(c.kmDate):"stav"}</span></div>`:""}${c.fuel?`<div><b>${esc(FUEL[c.fuel]||"")}</b><span>pohon</span></div>`:""}${(()=>{ const w=carWorst(c); return w?`<div><b>${esc(leftTxt(w))}</b><span>${esc(w.l)}</span></div>`:""; })()}</div>
    <div class="cacts"><button type="button" data-carlog="${esc(c.id)}"><span>${ci("plus")}</span>Záznam</button><button type="button" data-carkm="${esc(c.id)}"><span>${ci("km")}</span>Stav km</button><label><span>${ci("foto")}</span>Fotka<input type="file" accept="image/*" id="carPhoto" hidden></label><button type="button" data-caredit="${esc(c.id)}"><span>${ci("edit")}</span>Upraviť</button></div>
  </div>
  ${stateBanner()}${formPanel()}
  <section class="clist"><div class="clh">Termíny a údržba</div>${rows.map(row).join("")}${tires}</section>
  <section class="clist"><div class="clh">Servisná knižka <span>${log.length}</span></div>
  ${log.length?log.slice(0,30).map(x=>`<div class="crow ok info logrow"><span class="cic">${ci(LOG_IC[x.kind]||"ine")}</span><div class="cmain"><b>${esc(LOG_KIND[x.kind]||x.kind)}</b><span>${fmtDate(x.date)}${num(x.km)!=null?" · "+fmtKm(x.km):""}${num(x.cost)?" · "+eur(x.cost):""}</span>${x.note?`<span class="clast">${esc(x.note)}</span>`:""}</div><button class="btn sm ghost" type="button" data-logdel="${esc(c.id)}|${esc(x.id)}" aria-label="Zmazať záznam">×</button></div>`).join(""):`<div class="crow none info"><span class="cic">${ci("servis")}</span><div class="cmain"><b>Zatiaľ bez záznamov</b><span>Každú STK, servis či prezutie zapíš cez „Záznam“ – termíny sa prepočítajú samy.</span></div></div>`}</section>
  ${c.note?`<section class="clist"><div class="clh">Poznámka</div><div class="cnote">${esc(c.note)}</div></section>`:""}
  </div>`; }

function carClean(d,c){ const rec={log:Array.isArray(c?.log)?c.log:[],created:c?.created||new Date().toISOString(),updated:new Date().toISOString()};
  for(const k of ["name","plate","note"]) rec[k]=String(d[k]||"").slice(0,300);
  rec.year=num(d.year); rec.color=CAR_COLOR[d.color]?d.color:""; rec.body=BODY[d.body]?d.body:"sedan"; rec.fuel=FUEL[d.fuel]!==undefined?(d.fuel||""):""; rec.photo=/^[0-9a-f]{32}$/.test(d.photo||"")?d.photo:""; rec.order=num(d.order);
  for(const k of ["kmDate","stk","ek","pzp","hav","vignette","lastOilDate","lastSvcDate","tireDate","lastBrakeDate","lastCabinDate","lastCalDate"]) rec[k]=ISO_RE.test(d[k]||"")?d[k]:"";
  for(const k of ["km","oilKm","oilMonths","lastOilKm","svcKm","svcMonths","lastSvcKm","tireMm","lastRotKm","lastCalKm"]) rec[k]=num(d[k]);
  rec.tireSeason=TIRE[d.tireSeason]!==undefined?(d.tireSeason||""):""; return rec; }

  const colors=Object.fromEntries([["","—"],...Object.entries(CAR_COLOR).map(([k,v])=>[k,v[0]])]);
  openForm({title:c?"Upraviť auto":"Nové auto",data:c?{...c}:{oilKm:"15000",oilMonths:"12",svcKm:"30000",svcMonths:"24",kmDate:today(),body:"sedan"},fields:[
  {k:"name",l:"Názov",ph:"napr. Škoda Octavia"},{k:"year",l:"Rok výroby",t:"number"},{k:"plate",l:"EČV"},{k:"color",l:"Farba",t:"select",o:colors},{k:"body",l:"Karoséria (obrázok)",t:"select",o:BODY},{k:"fuel",l:"Pohon",t:"select",o:FUEL},
  {k:"photo",l:"Vlastná fotka auta (inak ilustrácia)",t:"image"},
  {k:"km",l:"Stav tachometra (km)",t:"number"},{k:"kmDate",l:"Stav k dátumu",t:"date"},
  {k:"stk",l:"STK platná do",t:"date"},{k:"ek",l:"Emisná kontrola do (nie pre elektromobil)",t:"date"},{k:"pzp",l:"PZP poistka – splatnosť",t:"date"},{k:"hav",l:"Havarijná poistka – splatnosť",t:"date"},{k:"vignette",l:"Diaľničná známka do",t:"date"},
  {k:"oilKm",l:"Olej – interval (km)",t:"number"},{k:"oilMonths",l:"Olej – interval (mesiace)",t:"number"},{k:"lastOilKm",l:"Posledná výmena oleja (km)",t:"number"},{k:"lastOilDate",l:"Posledná výmena oleja (dátum)",t:"date"},
  {k:"svcKm",l:"Servis – interval (km)",t:"number"},{k:"svcMonths",l:"Servis – interval (mesiace)",t:"number"},{k:"lastSvcKm",l:"Posledný servis (km)",t:"number"},{k:"lastSvcDate",l:"Posledný servis (dátum)",t:"date"},
  {k:"lastBrakeDate",l:"EV: kontrola brzdovej kvapaliny (dátum)",t:"date"},{k:"lastCabinDate",l:"EV: výmena kabínového filtra (dátum)",t:"date"},{k:"lastRotKm",l:"EV: rotácia pneumatík (km)",t:"number"},{k:"lastCalDate",l:"EV: čistenie strmeňov (dátum)",t:"date"},{k:"lastCalKm",l:"EV: čistenie strmeňov (km)",t:"number"},
  {k:"tireSeason",l:"Pneumatiky na aute",t:"select",o:TIRE},{k:"tireMm",l:"Hĺbka dezénu (mm)",t:"number"},{k:"tireDate",l:"Posledné prezutie",t:"date"},{k:"note",l:"Poznámka",t:"textarea",wide:true}],
