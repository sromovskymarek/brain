html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{padding:20px 18px 16px;display:flex;gap:10px;align-items:center}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--fg);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;left:5px;right:5px;bottom:6px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--pe-g) 0 4px,var(--pe-y) 4px 8px)}
.brand-name{font-family:var(--f-display);font-weight:750;font-stretch:118%;font-size:17px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-sec{padding:16px 18px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.side-types{display:flex;flex-direction:column;padding:0 10px 10px}
.side-types button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--fg);font-size:14px}
.side-types button:hover{background:var(--surface-2)}
.side-foot{margin-top:auto;padding:12px 18px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.side-foot .row{display:flex;gap:6px;flex-wrap:wrap}

.main{min-width:0;min-height:0;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:1080px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.view-head h1{font-size:28px;font-weight:760}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{color:var(--muted);max-width:62ch;margin:4px 0 0}

.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;color:var(--fg)}
.tag{display:inline-flex;align-items:center;font-size:12px;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);font-family:var(--f-mono);white-space:nowrap;cursor:pointer}
.tag:hover{color:var(--fg);border-color:var(--line-2)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--faint)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15px;font-weight:700;font-stretch:108%}
.panel-b{padding:14px 16px}

input[type=text],input[type=search],input[type=date],input[type=time],input[type=url],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}

/* Prehľad */
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.summary b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li-main{min-width:0;flex:1}
.li-title{font-weight:500;overflow-wrap:anywhere}
.li-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.li .dot{margin-top:7px}
.due{font-family:var(--f-mono);font-size:12px}
.due.late{color:var(--crit);font-weight:500}
.due.soon{color:var(--warn)}
.chk{appearance:none;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:4px;flex:none;margin-top:2px;cursor:pointer;background:var(--surface)}
.chk:checked{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--surface)}
.empty{padding:18px 16px;color:var(--muted);font-size:14px}
.stripe-crit{box-shadow:inset 3px 0 0 var(--crit)}
.stripe-warn{box-shadow:inset 3px 0 0 var(--warn)}

/* Zápis */
.capture{display:flex;flex-direction:column;gap:12px}
.capture textarea{min-height:220px;font-size:15px;padding:14px}
.typepick{display:flex;flex-wrap:wrap;gap:6px}
.typepick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 9px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:500}
.typepick button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:14px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:flex;gap:8px;flex-wrap:wrap}
.fileb{display:inline-flex;gap:6px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 6px 4px 4px;background:var(--surface-2);max-width:100%}
.fileb img{width:28px;height:28px;object-fit:cover;border-radius:4px}
.fileb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.fileb button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.proposal{display:flex;flex-direction:column;gap:10px}
.prop{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.prop .pf{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}
.prop textarea{min-height:90px;font-size:14px}
.prop-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}

/* Knižnica */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 260px}
.toolbar select{width:auto}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 9px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:13px}
.filters button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.rows .li{padding:12px 16px}
.snip{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.activetag{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

/* Opýtaj sa */
.chat{display:flex;flex-direction:column;gap:16px}
.q{align-self:flex-end;max-width:80%;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px 12px 2px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.a{background:var(--surface);border:1px solid var(--line);border-radius:2px 12px 12px 12px;padding:14px 16px;max-width:100%;min-width:0}
.a.thinking{color:var(--muted)}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);align-items:center}
.askbar{position:sticky;bottom:0;padding-block:12px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px;align-items:flex-end}
.askbar textarea{min-height:48px;max-height:180px}
.suggest{display:flex;gap:8px;flex-wrap:wrap}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;text-align:left}
.suggest button:hover{border-color:var(--accent)}

/* Mapa */
.graph-wrap{position:relative;height:min(70vh,680px);min-height:380px;padding:0;overflow:hidden}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.graph-ctl{position:absolute;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* Markdown */
.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{font-size:16px;margin:16px 0 6px;font-stretch:108%}
.md h1{font-size:18px}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:2px 0}
.md code{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);padding:0 4px;border-radius:3px}
.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.md a{color:var(--accent)}
.md .wl{color:var(--accent);text-decoration:none;border-bottom:1px dashed currentColor;cursor:pointer}
.md .wl.miss{color:var(--faint)}
.md blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid var(--line-2);color:var(--muted)}

/* Detail */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:31;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.d-head .status{font-size:12px;color:var(--faint);margin-right:auto}
.d-body{overflow:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:16px;min-height:0;flex:1 1 auto}
.d-foot{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface)}
.d-foot .btn.primary{flex:1;max-width:320px;padding:11px 16px;font-size:15px}
.d-title{font-family:var(--f-display);font-stretch:112%;font-weight:720;font-size:22px;border:0;padding:4px 0;border-radius:0;border-bottom:1px solid transparent;background:none}
.d-title:focus{border-bottom-color:var(--line-2);outline:none}
.d-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.d-body textarea.body{min-height:260px;font-size:14.5px}
.mdview{min-height:120px;padding:4px 2px}
.sec-t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.linkrow:first-child{border-top:0}
.linkrow .t{flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere}
.linkrow .t:hover{color:var(--accent)}
.picker{position:relative}
.picker-res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;box-shadow:var(--shadow);z-index:5;max-height:240px;overflow:auto}
.picker-res button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer;font-size:14px}
.picker-res button:hover{background:var(--surface-2)}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.att-i{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.att-i a{display:block;aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-family:var(--f-mono);font-size:13px}
.att-i img{width:100%;height:100%;object-fit:cover}
.att-i .n{font-size:11px;padding:4px 6px;display:flex;gap:4px;align-items:center}
.att-i .n span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-i .n button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;background:var(--surface)}
.tagedit input{border:0;padding:2px;flex:1;min-width:120px;width:auto;background:none}
.tagedit input:focus{outline:none}
.tagedit .tag button{border:0;background:none;padding:0 0 0 4px;cursor:pointer;color:inherit}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--crit);border-radius:7px;font-size:14px}
.aisug{border:1px dashed var(--accent);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}

.banner{padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px}
.banner.err{border-color:var(--crit);color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

/* Dashboard – dlaždice v štýle widgetov */
.view-dash{max-width:1180px}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;grid-auto-flow:row dense}
.w{--ink:var(--w-ink);--ink-2:var(--w-ink-2);--glass:var(--w-glass);--glass-2:var(--w-glass-2);--g1:var(--surface);--g2:var(--surface);
  border-radius:22px;padding:16px 18px 18px;color:var(--ink);min-width:0;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;min-height:170px;
  background:linear-gradient(155deg,var(--g1),var(--g2));box-shadow:var(--w-shadow)}
.w-s{grid-column:span 1}.w-m{grid-column:span 2}.w-l{grid-column:span 2;grid-row:span 2}.w-w{grid-column:1/-1;min-height:0}
.w-plain{--ink:var(--fg);--ink-2:var(--muted);--glass:var(--surface-2);--glass-2:var(--line);border:1px solid var(--line)}
.w-today{--g1:var(--wb-1);--g2:var(--wb-2)}
.w-family{--g1:var(--wo-1);--g2:var(--wo-2)}
.w-tasks{--g1:var(--wg-1);--g2:var(--wg-2)}
.w-proj{--g1:var(--wv-1);--g2:var(--wv-2)}
.w-ideas{--g1:var(--wy-1);--g2:var(--wy-2);--ink:var(--w-ink-dk);--ink-2:var(--w-ink-dk-2);--glass:var(--w-glass-dk);--glass-2:var(--w-glass-dk-2)}
.w-int{--g1:var(--wp-1);--g2:var(--wp-2)}
.w-fin{--g1:var(--wt-1);--g2:var(--wt-2)}
.w-feast{--g1:var(--wf-1);--g2:var(--wf-2)}
.w-forgot{--g1:var(--ws-1);--g2:var(--ws-2)}
.w-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);min-height:30px}
.w-ic{width:18px;height:18px;display:inline-flex;flex:none}
.w-ic svg{width:18px;height:18px}
.w-h .sp{flex:1}
.w-add{width:30px;height:30px;border-radius:50%;border:0;background:var(--glass-2);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.w-add:hover{filter:brightness(1.12)}
.w-big{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.w-sub{font-size:13px;color:var(--ink-2);line-height:1.4}
.w-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.w-row{display:flex;gap:10px;align-items:center;background:var(--glass);border-radius:12px;padding:8px 10px;cursor:pointer;min-width:0;font-size:14px}
.w-row:hover{background:var(--glass-2)}
.w-row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-row .m{font-size:12px;color:var(--ink-2);font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.w-empty{font-size:14px;color:var(--ink-2);line-height:1.45}
.w-in{display:flex;gap:6px}
.w-in input{background:var(--glass);border:1px solid transparent;color:var(--ink);border-radius:12px;padding:9px 12px}
.w-in input::placeholder{color:var(--ink-2)}
.w-in input:focus{outline:none;border-color:var(--ink-2)}
.w .chk{border-color:var(--ink-2);background:transparent;margin-top:0}
.w .chk:checked{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--g2)}
.w-foot{margin-top:auto;font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.w-btn{border:0;background:var(--glass-2);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.w-btn:hover{filter:brightness(1.1)}
.pill{background:var(--glass-2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.alert{background:var(--w-alert);color:var(--w-ink)}
.today-top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.today-num{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:76px;line-height:.82;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.today-wd{font-family:var(--f-display);font-weight:720;font-stretch:112%;font-size:24px;line-height:1.1}
.today-pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.cal-scroll{display:flex;flex-direction:column;gap:12px;min-height:0}
.cal-g{display:flex;flex-direction:column;gap:2px}
.cal-d{font-size:12px;font-weight:700;display:flex;gap:6px;align-items:baseline;padding:0 8px;letter-spacing:.02em}
.cal-d.now{color:var(--t-udalost)}
.cal-d span{font-weight:500;color:var(--ink-2);font-family:var(--f-mono)}
.ev{display:grid;grid-template-columns:4px 66px minmax(0,1fr);gap:10px;align-items:center;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:14px}
.ev:hover{background:var(--glass)}
.ev-bar{width:4px;height:22px;border-radius:2px}
.ev-t{font-size:12px;color:var(--ink-2);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ev-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-n .rep{color:var(--ink-2);font-size:12px}
.cal-legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:auto;padding-top:4px}
.cal-legend span{display:inline-flex;gap:5px;align-items:center}
.prog{height:6px;border-radius:3px;background:var(--glass-2);overflow:hidden;flex:none;width:64px}
.prog i{display:block;height:100%;background:var(--ink);border-radius:3px}
.feast-name{font-family:var(--f-display);font-weight:800;font-stretch:118%;font-size:28px;line-height:1.02;color:var(--wf-gold)}
.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.area{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;min-width:0;font-size:14px;color:var(--fg)}
.area:hover{border-color:var(--line-2)}
.area .dot{width:12px;height:12px}
.area span.nm{min-width:0;line-height:1.3}
.w-s .w-row{flex-direction:column;align-items:flex-start;gap:1px}
.w-s .w-row .n{width:100%}
.area b{margin-left:auto;font-family:var(--f-mono);font-weight:500;color:var(--muted)}

/* Pošta */
.mtabs{display:flex;gap:6px;flex-wrap:wrap}
.mtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--fg);display:inline-flex;gap:6px;align-items:center}
.mtabs button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 10px;border-radius:12px;background:var(--surface-2);align-items:start}
.mrow.done{opacity:.55}
.mrow .mfrom{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.mrow .msub{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1/-1}
.mrow .msum{font-size:13px;color:var(--muted);grid-column:1/-1;line-height:1.4}
.mrow .mact{display:flex;gap:4px;align-items:center}
.mrow .mact a,.mrow .mact button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none;cursor:pointer;font-size:14px}
.mtime{font-family:var(--f-mono);font-size:11px;color:var(--faint);font-weight:400}
.dl{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--crit);border:1px solid var(--crit);border-radius:999px;padding:0 7px;margin-top:4px;justify-self:start;grid-column:1/-1}
.mlist{display:flex;flex-direction:column;gap:6px;min-width:0}

/* Výdavky */
.money{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.hbar .trk{height:10px}
.hbar .trk i{display:block;height:100%;background:var(--t-vydavok);border-radius:0 4px 4px 0;min-width:3px}
.hbar .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
.vbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:180px;padding-top:6px;border-bottom:1px solid var(--line-2)}
.vbar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.vbar i{width:min(48px,100%);background:var(--t-vydavok);opacity:.4;border-radius:4px 4px 0 0;min-height:2px}
.vbar.cur i{opacity:1}
.vbar .v{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.vbar.cur .v{color:var(--fg);font-weight:500}
.vlabels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.expform{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:16px}
.expform .prev{border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);aspect-ratio:3/4;max-width:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--f-mono);font-size:13px;text-align:center;padding:8px}
.expform .prev img{width:100%;height:100%;object-fit:cover}
.expform .prev:has(img){padding:0}
.expfields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.expday{font-size:12px;font-weight:700;color:var(--muted);padding:12px 16px 4px;letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.monthnav{display:inline-flex;align-items:center;gap:6px}
.monthnav b{font-family:var(--f-display);font-stretch:110%;font-weight:700;min-width:9.5em;text-align:center}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* Sekcie */
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.vtabs::-webkit-scrollbar{display:none}
.vtabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.vtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.kpi .v{font-family:var(--f-display);font-stretch:115%;font-weight:760;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--faint)}
.pos{color:var(--ok)}.neg{color:var(--crit)}

.big-cd{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}

.vtile.noimg .cap{background:none;color:var(--fg)}
.goalrow{display:grid;grid-template-columns:44px minmax(0,1fr) 110px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}

.jrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,190px);gap:8px;align-items:center}

.verse{font-family:var(--f-display);font-stretch:100%;font-size:19px;line-height:1.45;font-weight:500}

.w-habits{--g1:var(--wk-1);--g2:var(--wk-2)}
.w-trip{--g1:var(--wt-1);--g2:var(--wt-2)}
.w-car{--g1:var(--ws-1);--g2:var(--ws-2)}

.more-sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* Živšie pozadie */
.main{background:radial-gradient(1200px 500px at 10% -10%,var(--app-glow1),transparent 60%),radial-gradient(900px 500px at 100% 0%,var(--app-glow2),transparent 55%),radial-gradient(900px 600px at 50% 110%,var(--app-glow3),transparent 60%),var(--bg)}
/* Široký widget */
.hero{--g1:var(--h1);--g2:var(--h3);background:linear-gradient(125deg,var(--h1) 0%,var(--h2) 55%,var(--h3) 100%);min-height:0;gap:14px;padding:18px 20px 20px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.hero-time{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:56px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-date{font-size:16px;font-weight:600;margin-top:6px;color:var(--w-ink-2)}
.hero-side{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero-nd{background:var(--w-glass-2);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;line-height:1.2}
.hero-nd span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--w-ink-2)}
.hero-nd b{font-size:15px}
.hero-btn{border:0;background:var(--w-ink);color:var(--h2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.hchips{display:flex;gap:6px;flex-wrap:wrap}
.hchip{--cc:var(--w-glass-2);display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--w-glass);box-shadow:inset 3px 0 0 var(--cc);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hchip.red{background:var(--w-alert);box-shadow:none}
.hchip.gold{background:var(--wf-gold);color:#04142b;box-shadow:none}
.hchip button{border:0;background:#04142b;color:var(--wf-gold);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;cursor:pointer}
.hp{background:var(--w-glass);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hp-h{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--w-ink-2)}
.hp-row{display:flex;gap:10px;align-items:center;min-height:34px;font-size:15px;font-weight:500}
.hp-row .n{flex:1;min-width:0;overflow-wrap:anywhere}
.hp-row.done .n{text-decoration:line-through;opacity:.7}
.hp-row input[type=text]{flex:1;background:var(--w-glass);border:1px solid transparent;color:var(--w-ink);border-radius:10px;padding:7px 10px}
.hp-row input[type=text]::placeholder{color:var(--w-ink-2)}
.hp-row input[type=text]:focus{outline:none;border-color:var(--w-ink-2)}
.hp-num{width:22px;height:22px;border-radius:50%;background:var(--w-glass-2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.hp-x{border:0;background:none;color:var(--w-ink-2);cursor:pointer;font-size:15px;padding:2px 6px}
.hero .chk{border-color:var(--w-ink-2);background:transparent}
.hero .chk:checked{background:var(--w-ink);border-color:var(--w-ink);box-shadow:inset 0 0 0 3px var(--h2)}
/* Štvorcové widgety */
.sq-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.sq{aspect-ratio:1/1;max-width:100%;min-height:0;padding:14px 15px;gap:6px;cursor:pointer;transition:transform .15s ease}
.sq:hover{transform:translateY(-2px)}
.sq-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.sq-h svg{width:17px;height:17px;flex:none}
.sq .w-big{font-size:38px;margin-top:auto}
.sq .sq-sub{font-size:13px;color:var(--ink-2);line-height:1.3}
.sq .sq-line{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sq .sq-lines{display:flex;flex-direction:column;gap:4px;margin-top:auto;min-width:0}
.sq .sq-lines div{font-size:12.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--glass);border-radius:8px;padding:4px 7px}

.sq-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.sq > *:not(.sq-img){position:relative}
.sq-hidden{opacity:.4}
.sq-edit{position:absolute!important;left:8px;right:8px;bottom:8px;display:flex;gap:6px;justify-content:space-between}
.sq-edit button{border:0;border-radius:999px;background:var(--surface);color:var(--fg);font-weight:700;font-size:12px;padding:5px 10px;cursor:pointer;box-shadow:var(--shadow)}
.w-cal2{--g1:var(--wc-1);--g2:var(--wc-2)} .w-sky{--g1:var(--wsk-1);--g2:var(--wsk-2)} .w-navy{--g1:var(--wn-1);--g2:var(--wn-2)} .w-indigo{--g1:var(--wi-1);--g2:var(--wi-2)}
.w-graph{--g1:var(--wgr-1);--g2:var(--wgr-2)} .w-magenta{--g1:var(--wm-1);--g2:var(--wm-2)} .w-rose{--g1:var(--wro-1);--g2:var(--wro-2)}
.dash-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding-top:4px}
/* Farebné hlavičky sekcií */
.band{background:linear-gradient(135deg,var(--b1),var(--b2));color:var(--w-ink);border-radius:22px;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;box-shadow:var(--w-shadow)}
.band h1{color:inherit}
.band .eyebrow,.band .lead{color:var(--w-ink-2)}

.band .btn:hover{border-color:var(--w-ink-2)}
.band .btn.primary{background:var(--w-ink);color:var(--b2)}
.band .monthnav b{color:inherit}
/* Kalendár */
.wk{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));min-width:660px}
.wk-col{border-left:1px solid var(--line);padding:8px 6px;min-height:160px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0}
.wk-col:first-child{border-left:0}
.wk-col.today{background:var(--accent-soft)}
.wk-col.sel .wk-h b{background:var(--accent);color:var(--accent-fg)}
.wk-h{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding-bottom:4px}
.wk-h b{font-size:16px;color:var(--fg);width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.wk-ev{--cc:var(--accent);font-size:12px;line-height:1.25;padding:4px 6px;border-radius:6px;background:var(--surface-2);box-shadow:inset 3px 0 0 var(--cc);overflow-wrap:anywhere;cursor:pointer}
.wk-ev span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mo-h{font-size:11px;text-align:center;color:var(--muted);font-weight:600;text-transform:uppercase;padding:2px 0}
.mo-c{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:82px;padding:5px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;cursor:pointer;min-width:0;color:var(--fg)}
.mo-c.out{opacity:.45}
.mo-c.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mo-c.sel{background:var(--accent-soft)}
.mo-c .dn{font-size:13px;font-weight:700}
.mo-ev{--cc:var(--accent);font-size:11px;line-height:1.2;padding:2px 4px;border-radius:4px;background:var(--surface-2);box-shadow:inset 2px 0 0 var(--cc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mo-more{font-size:11px;color:var(--muted)}
/* Financie */
.fhero{background:linear-gradient(135deg,var(--wt-1),var(--wt-2));color:var(--w-ink);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--w-shadow)}
.fhero .lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--w-ink-2)}
.fhero .big{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.fhero .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fhero .box{background:var(--w-glass);border-radius:14px;padding:10px 12px}
.fhero .box b{display:block;font-family:var(--f-display);font-stretch:115%;font-size:22px;font-variant-numeric:tabular-nums}
.splitbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--w-glass);gap:2px}
.splitbar i{display:block;height:100%}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* ---------- Autá: garáž a detail auta ---------- */
:root{--stage-1:#123067;--stage-2:#03060c;--stage-ink:#f4f6f8;--stage-ink-2:rgba(244,246,248,.66);--stage-glass:rgba(255,255,255,.08);--stage-glass-2:rgba(255,255,255,.14);--stage-ok:#5fd38a;--stage-warn:#f3b544;--stage-crit:#ff7a6e}
.garage{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gcar{border-radius:20px;overflow:hidden;cursor:pointer;background:radial-gradient(120% 90% at 50% 30%,var(--stage-1),var(--stage-2));color:var(--stage-ink);box-shadow:var(--w-shadow);transition:transform .15s ease;display:flex;flex-direction:column}
.gcar:hover{transform:translateY(-2px)}.gcar:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gstage{aspect-ratio:16/8;display:flex;align-items:flex-end;justify-content:center;padding:18px 14px 4px;position:relative}
.gstage .car-svg{width:100%;max-width:360px;height:auto}
.gstage .car-photo,.cpic .car-photo{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block}
.gstage:has(.car-photo){padding:10px}
.ginfo{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:6px 16px 0}
.ginfo b{display:block;font-family:var(--f-display);font-size:20px;letter-spacing:-.01em}
.ginfo span{font-size:13px;color:var(--stage-ink-2)}
.gkm{font-variant-numeric:tabular-nums;font-weight:600;color:var(--stage-ink)!important;white-space:nowrap}
.gst,.cst{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.gst{margin:10px 16px 16px;padding:7px 12px;border-radius:999px;background:var(--stage-glass);align-self:flex-start}
.gst i,.cst i{width:8px;height:8px;border-radius:50%;background:var(--stage-ink-2);flex:none}
.gst.ok i,.cst.ok i{background:var(--stage-ok)}.gst.warn i,.cst.warn i{background:var(--stage-warn)}.gst.crit i,.cst.crit i{background:var(--stage-crit)}
.gst.crit,.cst.crit{color:var(--stage-crit)}.gst.warn,.cst.warn{color:var(--stage-warn)}
.cstage{border-radius:24px;background:radial-gradient(110% 80% at 50% 42%,var(--stage-1),var(--stage-2));color:var(--stage-ink);padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--w-shadow)}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cback{background:var(--stage-glass);color:var(--stage-ink);border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.cback:hover{background:var(--stage-glass-2)}
.cst{padding:6px 12px;border-radius:999px;background:var(--stage-glass)}
.chead{text-align:center;margin-top:6px}
.chead h1{font-family:var(--f-display);font-size:30px;line-height:1.1;margin:0;letter-spacing:-.015em;color:var(--stage-ink)}
.csub{font-size:14px;color:var(--stage-ink-2);margin-top:3px}
.cpic{display:flex;justify-content:center;align-items:flex-end;min-height:150px;padding:8px 0 2px}
.cpic .car-svg{width:100%;max-width:520px;height:auto}
.cpic:has(.car-photo){aspect-ratio:16/9;max-height:340px;width:100%;max-width:620px;margin:0 auto}
.cstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin:4px auto 0;width:100%;max-width:520px}
.cstats div{background:var(--stage-glass);border-radius:14px;padding:8px 6px;text-align:center;min-width:0}
.cstats b{display:block;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cstats span{font-size:12px;color:var(--stage-ink-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;max-width:520px;width:100%;align-self:center}
.cacts button,.cacts label{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--stage-ink);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:0}
.cacts span{width:52px;height:52px;border-radius:50%;background:var(--stage-glass);display:grid;place-items:center;transition:background .15s}
.cacts button:hover span,.cacts label:hover span{background:var(--stage-glass-2)}
.cacts svg{width:22px;height:22px}
.clist{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.clh{display:flex;justify-content:space-between;padding:14px 16px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.crow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;--rc:var(--ok)}
.crow.info{cursor:default}.crow[data-crow]{cursor:pointer}
.crow:hover[data-crow]{background:var(--surface-2)}
.crow.warn{--rc:var(--warn)}.crow.crit{--rc:var(--crit)}.crow.none{--rc:var(--faint)}
.cic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;color:var(--rc);background:color-mix(in srgb,var(--rc) 14%,transparent)}
.cic svg{width:22px;height:22px}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cmain b{font-size:15px;font-weight:600}
.cmain>span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.crow.none .cmain b{color:var(--muted)}
.clast{font-size:12px!important;color:var(--faint)!important}
.cbar{display:block;height:5px;border-radius:3px;background:var(--surface-2);margin-top:5px;max-width:260px;overflow:hidden;border:1px solid var(--line)}
.cbar i{display:block;height:100%;background:var(--rc);border-radius:3px}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;text-align:right}
.cpill{font-size:13px;font-weight:700;color:var(--rc);white-space:nowrap;font-variant-numeric:tabular-nums}
.crow.ok .cpill{color:var(--muted);font-weight:600}
.cchev{color:var(--faint);flex:none}.cchev svg{width:18px;height:18px;display:block}
.cnote{padding:4px 16px 16px;font-size:14px;white-space:pre-wrap}
@media (max-width:820px){.garage{grid-template-columns:1fr}.chead h1{font-size:26px}.cacts span{width:48px;height:48px}.crow{padding:12px 14px;gap:10px}.cic{width:36px;height:36px}}

.htable .up{color:var(--ok);font-weight:600}.htable .down{color:var(--crit);font-weight:600}
.plist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.plist li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:4px}
.plist li .mono{color:var(--muted);text-align:right}
.wkex{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.wkex-h{display:flex;gap:8px}
.wkexn{font-weight:600}
.wkprev{font-size:12px;color:var(--muted)}
.wksets{display:flex;flex-direction:column;gap:6px}
.wkset{display:grid;grid-template-columns:2em minmax(0,6em) auto minmax(0,6em) auto;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.wkset input{padding:7px 8px;font-variant-numeric:tabular-nums}
.wkx{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--muted)}
.kbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px}
.kb{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;cursor:pointer;min-width:0}
.kt{position:relative;flex:1;width:100%;max-width:34px;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:6px}
.kt i{display:block;width:100%;background:var(--wh-1);border-radius:6px;min-height:2px}
.kgoal{position:absolute;left:-3px;right:-3px;height:0;border-top:2px dashed var(--muted);z-index:1}
.kv{font-size:10px;color:var(--muted);white-space:nowrap}
.kd{font-size:12px;color:var(--muted)}
.fr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fr .chip{cursor:pointer}
.mthumb{width:40px;height:40px;object-fit:cover;border-radius:8px;flex:none}
.fprev{max-height:220px;width:auto;border-radius:12px;align-self:flex-start}
.carenext{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.carenext.late{color:var(--crit)}.carenext.soon{color:var(--warn)}.carenext.ok{color:var(--ok)}
.hq-prop{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:720px){ .nbar{grid-template-columns:6.5em minmax(0,1fr) auto} .wkset{grid-template-columns:1.6em minmax(0,1fr) auto minmax(0,1fr) auto} }

/* ================= VČELÍ PLÁST ================= */
.main{background:radial-gradient(1100px 520px at 12% -10%,var(--app-glow1),transparent 60%),radial-gradient(900px 520px at 100% 0%,var(--app-glow2),transparent 55%),radial-gradient(900px 600px at 50% 110%,var(--app-glow3),transparent 60%),var(--hexpat),var(--bg)}
.side{background:linear-gradient(180deg,#07101e,var(--surface) 40%)}
.brand-mark{width:26px;height:30px;border-radius:0;background:linear-gradient(160deg,#8fd0ff,#2f7bff 45%,#0b2c7a);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.brand-mark::after{left:7px;right:7px;top:8px;bottom:8px;height:auto;border-radius:0;background:var(--bg);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.nav button[aria-current="page"]{box-shadow:inset 3px 0 0 var(--accent)}
.view-dash{container-type:inline-size;container-name:dash}

/* Široká bunka – nástenka (spojené bunky) */
.hero{--c:56px;position:relative;isolation:isolate;color:var(--w-ink);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1.3fr);gap:0;padding:24px calc(var(--c) + 4px);min-height:230px;background:none;border-radius:0;box-shadow:none;filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))}
.hero::before,.hero::after{content:"";position:absolute;clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% 50%,calc(100% - var(--c)) 100%,var(--c) 100%,0 50%)}
.hero::before{inset:0;z-index:-2;background:var(--rim)}
.hero::after{inset:2px;z-index:-1;background:var(--hexpat-w),radial-gradient(60% 90% at 18% 10%,rgba(143,208,255,.22),transparent 60%),linear-gradient(125deg,var(--h1),var(--h2) 48%,var(--h3))}
.hz{padding:4px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;justify-content:center}
.hz+.hz{border-left:1px solid rgba(143,208,255,.22)}
.hz1 .hero-top{flex-direction:column;align-items:flex-start;gap:12px}
.hz2 .hchip{white-space:normal;border-radius:14px}
.hz-empty{font-size:14px;color:var(--w-ink-2);line-height:1.45}
.hero .hp{background:rgba(255,255,255,.07)}
@container dash (max-width:760px){
  .hero{--c:30px;grid-template-columns:minmax(0,1fr);padding:calc(var(--c) + 8px) 20px calc(var(--c) + 12px)}
  .hero::before,.hero::after{clip-path:polygon(50% 0,100% var(--c),100% calc(100% - var(--c)),50% 100%,0 calc(100% - var(--c)),0 var(--c))}
  .hz{padding:12px 0}
  .hz+.hz{border-left:0;border-top:1px solid rgba(143,208,255,.22)}
  .hz1{text-align:center}
  .hz1 .hero-top{align-items:center}
  .hz1 .hero-side{justify-content:center}
}

/* Plást – šesťuholníkové bunky */
.hive{--cols:2;--w:calc((100cqw - 2px) / (var(--cols) * .75 + .25));--h:calc(var(--w) * .8660254);display:grid;grid-template-columns:repeat(var(--cols),calc(var(--w) * .75));grid-auto-rows:var(--h);padding-bottom:calc(var(--h) / 2)}
@container dash (min-width:560px){.hive{--cols:4}}
@container dash (min-width:900px){.hive{--cols:6}}
.hx{--ink:var(--w-ink);--ink-2:var(--w-ink-2);--glass:var(--w-glass);--glass-2:var(--w-glass-2);
  width:var(--w);height:var(--h);position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;
  padding:calc(var(--h) * .12) calc(var(--w) * .19);color:var(--ink);cursor:pointer;min-width:0;transition:transform .18s ease,filter .18s ease}
.hx:nth-child(even){top:calc(var(--h) / 2)}
.hx::before,.hx::after{content:"";position:absolute;clip-path:var(--hexpoly)}
.hx::before{inset:3px;z-index:-2;background:var(--rim)}
.hx::after{inset:5px;z-index:-1;background:var(--hexpat-w),radial-gradient(75% 55% at 35% 18%,rgba(255,255,255,.16),transparent 62%),linear-gradient(160deg,var(--g1),var(--g2))}
.hx:hover{transform:translateY(-3px);filter:drop-shadow(0 0 14px rgba(61,139,255,.6))}
.hx:focus-visible{outline:none;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 12px rgba(143,208,255,.9))}
.hx>*{margin-top:0!important;max-width:100%}
.hx>*:not(.sq-img):not(.sq-edit){position:relative;z-index:1}
.hx .sq-h{justify-content:center;flex-wrap:wrap;row-gap:3px;gap:5px;font-size:clamp(9.5px,calc(var(--w) * .05),12px);letter-spacing:.07em;color:var(--ink-2)}
.hx .sq-h svg{width:clamp(14px,calc(var(--w) * .075),18px);height:clamp(14px,calc(var(--w) * .075),18px)}
.hx .sq-h .pill{margin-left:0!important;font-size:10px;padding:1px 7px;letter-spacing:0}
.hx .w-big{font-size:clamp(22px,calc(var(--w) * .15),38px);line-height:1}
.hx .sq-sub{font-size:clamp(10.5px,calc(var(--w) * .056),13px);line-height:1.25;color:var(--ink-2)}
.hx .sq-line{font-size:clamp(10.5px,calc(var(--w) * .056),13px);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hx .sq-lines{display:flex;flex-direction:column;gap:3px;width:100%}
.hx .sq-lines div{font-size:clamp(10px,calc(var(--w) * .05),12px);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--glass);border-radius:7px;padding:2px 6px}
.hx .sq-cal-d{display:flex;flex-direction:column;align-items:center;line-height:1}
.hx .sq-cal-d .wd{font-size:clamp(10.5px,calc(var(--w) * .056),13px);font-weight:700;text-transform:capitalize;color:var(--ink-2)}
.hx .sq-cal-d .dn{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(26px,calc(var(--w) * .17),44px)}
.hx .feast-name{font-size:clamp(15px,calc(var(--w) * .095),24px);line-height:1.05}
.hx .sq-img{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);object-fit:cover;opacity:.32;clip-path:var(--hexpoly);z-index:0}
.hx.sq-hidden{opacity:.4}
.hx .sq-edit{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--h) * .07);display:flex;gap:4px;z-index:2}
.hx .sq-edit button{border:0;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:700;font-size:11px;padding:4px 8px;cursor:pointer}

/* Hlavičky sekcií a hlavné panely ako predĺžené bunky */
.band,.fhero{--c:26px;position:relative;isolation:isolate;background:none;border-radius:0;box-shadow:none;padding-left:calc(var(--c) + 16px);padding-right:calc(var(--c) + 16px);filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.fhero{--c:34px;--b1:var(--wt-1);--b2:var(--wt-2)}
.band::before,.band::after,.fhero::before,.fhero::after{content:"";position:absolute;clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% 50%,calc(100% - var(--c)) 100%,var(--c) 100%,0 50%)}
.band::before,.fhero::before{inset:0;z-index:-2;background:var(--rim)}
.band::after,.fhero::after{inset:1.5px;z-index:-1;background:var(--hexpat-w),radial-gradient(60% 120% at 15% 0%,rgba(143,208,255,.18),transparent 60%),linear-gradient(125deg,var(--b1),var(--b2) 70%,#03060d)}
.fc{background:var(--hexpat-w),linear-gradient(150deg,var(--g1),var(--g2));border:1px solid rgba(143,208,255,.22)}
.card,.panel,.kpi,.jar,.clist{border-color:var(--line)}
.card,.kpi,.jar{background:linear-gradient(180deg,#0c1420,var(--surface))}
.btn.primary{font-weight:700}
.btn.primary:hover{filter:brightness(1.12)}
@media (max-width:820px){
  .band{--c:18px;padding-left:calc(var(--c) + 12px);padding-right:calc(var(--c) + 12px)}
  .fhero{--c:22px;padding-left:calc(var(--c) + 10px);padding-right:calc(var(--c) + 10px)}
  .bottomnav{background:linear-gradient(180deg,var(--surface),#05080e)}
  .bottomnav .fab-wrap{filter:drop-shadow(0 6px 14px rgba(47,123,255,.55))}
  .bottomnav .fab{width:60px;height:68px;margin-top:-36px;border-radius:0;box-shadow:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#8fd0ff,var(--h1) 35%,var(--h2) 75%,var(--h3))}
}

/* ===== Riadiace centrum – grafická nástenka (modré pozadie, sklenené karty) ===== */
.main.cc-bg{background:
  radial-gradient(900px 520px at 78% -8%,rgba(92,170,255,.32),transparent 60%),
  radial-gradient(700px 500px at 0% 30%,rgba(40,110,255,.22),transparent 65%),
  linear-gradient(165deg,#0d3283 0%,#0a2563 38%,#071a49 70%,#050f2e 100%);background-attachment:local}
.view-dash.cc{--cc-glass:linear-gradient(160deg,rgba(64,128,255,.20),rgba(18,48,120,.30));--cc-line:rgba(130,185,255,.24);--cc-ink:#eef5ff;--cc-mut:#a9c3ea;--cc-cy:#7fd4ff;
  max-width:1320px;gap:16px;color:var(--cc-ink)}
.cc .sp{flex:1}
.cc-card,.cc-kpi,.cc-head{background:var(--cc-glass);border:1px solid var(--cc-line);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 14px 34px rgba(2,10,40,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cc-card{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.cc-card[data-go]{cursor:pointer;transition:transform .16s ease,border-color .16s ease}
.cc-card[data-go]:hover,.cc-kpi:hover{transform:translateY(-2px);border-color:rgba(160,210,255,.5)}
.cc-h{display:flex;align-items:center;gap:8px;min-width:0}
.cc-h h2{font-size:15px;font-weight:720;display:flex;align-items:center;gap:8px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-h h2 svg{width:18px;height:18px;color:var(--cc-cy);flex:none}
.cc-pill{font-size:11.5px;font-weight:600;color:var(--cc-mut);background:rgba(255,255,255,.07);border:1px solid var(--cc-line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.cc-link{border:0;background:none;color:var(--cc-cy);font-weight:650;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:8px;white-space:nowrap}
.cc-link:hover{background:rgba(255,255,255,.08)}
.cc-empty,.cc-note{font-size:13.5px;color:var(--cc-mut);line-height:1.45}
.cc-sub{font-size:13px;color:var(--cc-mut)}
.cc .pos{color:#5fe3a8}.cc .neg{color:#ff8a80}
.cc .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.10);border:0;overflow:hidden}
.cc .bar i{background:linear-gradient(90deg,#2f7bff,#7fd4ff);border-radius:4px}

/* Hlavička */
.cc-head{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.8fr) minmax(0,1fr);gap:16px;align-items:center;padding:18px 22px;
  background:radial-gradient(70% 140% at 55% 50%,rgba(127,212,255,.20),transparent 60%),linear-gradient(120deg,rgba(47,123,255,.35),rgba(11,44,122,.45));overflow:hidden}
.cc-eyebrow{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--cc-mut)}
.cc-head h1{font-size:40px;font-weight:800;font-stretch:118%;line-height:1.05;margin-top:4px}
.cc-head-sub{font-size:14px;color:var(--cc-mut);margin-top:4px}
.cc-mini{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.cc-mini div{display:flex;flex-direction:column;gap:2px}
.cc-mini span{font-size:11.5px;color:var(--cc-mut);font-weight:600}
.cc-mini b{font-family:var(--f-display);font-stretch:112%;font-size:22px;font-weight:760;font-variant-numeric:tabular-nums}
.cc-head-m{display:flex;justify-content:center;min-width:0}
.cc-ill{width:100%;max-width:260px;height:auto;filter:drop-shadow(0 10px 24px rgba(47,123,255,.45))}
.cc-head-r{display:flex;flex-direction:column;align-items:flex-end;gap:12px;min-width:0}
.cc-clock{text-align:right}
.cc-clock .hero-time{font-size:54px;color:#fff}
.cc-nd{font-size:13px;color:var(--cc-mut);margin-top:6px}.cc-nd b{color:var(--cc-ink)}
.cc-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cc-btn{border:1px solid var(--cc-line);background:rgba(255,255,255,.10);color:#fff;border-radius:999px;padding:8px 14px;font-weight:650;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:38px;display:inline-flex;align-items:center}
.cc-btn:hover{background:rgba(255,255,255,.18)}
.cc-btn.pri{background:linear-gradient(160deg,#8fd0ff,#2f7bff);color:#041530;border-color:transparent}

/* KPI */
.cc-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.cc-kpi{position:relative;overflow:hidden;text-align:left;color:var(--cc-ink);padding:12px 14px 13px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;transition:transform .16s ease,border-color .16s ease;font:inherit}
.cc-kpi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--cc-cy)}
.cc-kpi.ok::before{background:#3ed6a0}.cc-kpi.warn::before{background:#ffc24a}.cc-kpi.crit::before{background:#ff6b5e}
.cc-kpi-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--cc-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-ic{width:26px;height:26px;border-radius:8px;background:rgba(127,212,255,.14);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--cc-cy)}
.cc-ic svg{width:16px;height:16px}
.cc-kpi-v{font-family:var(--f-display);font-stretch:115%;font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.cc-kpi.crit .cc-kpi-v{color:#ffb0a8}
.cc-kpi-s{font-size:12.5px;color:var(--cc-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-kpi-sp{position:absolute;right:8px;top:10px;color:var(--cc-cy);opacity:.9}
.cc-spark{width:76px;height:26px;display:block}

/* Mriežka */
.cc-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.cc-dnes{grid-column:span 8}.cc-pri{grid-column:span 4}
.cc-acc-c{grid-column:span 4}.cc-year{grid-column:span 8}
.cc-don{grid-column:span 4}.cc-cf{grid-column:span 4}.cc-wk{grid-column:span 4}
.cc-car,.cc-trip,.cc-goalc{grid-column:span 4}

/* Dnes – časová os */
.cc-tl{display:flex;flex-direction:column;gap:6px}
.cc-tl-ticks{position:relative;height:16px;margin:0 14px}
.cc-tl-ticks span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--cc-mut);font-family:var(--f-mono)}
.cc-tl-track{position:relative;margin:0 14px;background:rgba(3,12,40,.35);border:1px solid var(--cc-line);border-radius:12px;min-height:56px}
.cc-tl-track>i{position:absolute;top:0;bottom:0;width:1px;background:rgba(160,200,255,.10)}
.cc-tl-ev{position:absolute;height:34px;border:0;border-radius:9px;line-height:1.15;background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 75%,#0a2563),color-mix(in srgb,var(--cc) 35%,#0a2563));box-shadow:inset 3px 0 0 var(--cc),0 4px 12px rgba(0,0,0,.25);color:#fff;font-size:12.5px;font-weight:600;padding:0 9px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:36px}
.cc-tl-ev b{font-family:var(--f-mono);font-weight:500;opacity:.85}
.cc-tl-none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--cc-mut)}
.cc-tl-now{position:absolute;top:-6px;bottom:-6px;width:2px;background:#7fd4ff;box-shadow:0 0 10px #7fd4ff;transform:translateX(-1px);pointer-events:none}
.cc-tl-now span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:#7fd4ff;color:#041530;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;font-family:var(--f-mono)}
.cc-chips{margin-top:2px}
.cc .hchip{color:#fff}

/* Priority */
.cc-pri .hp{background:rgba(3,12,40,.30);border:1px solid var(--cc-line);color:#fff}
.cc-pri .chk{border-color:rgba(255,255,255,.6);background:transparent}

/* Účty – kartičky na sebe */
.cc-acc{display:flex;flex-direction:column}
.cc-acc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;margin-bottom:-6px;position:relative;cursor:pointer;border:1px solid rgba(255,255,255,.16);box-shadow:0 -4px 14px rgba(0,0,0,.18)}
.cc-acc-row span{font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
.cc-acc-row b{font-family:var(--f-mono);font-size:14.5px;font-weight:500}
.cc-acc-row.a1{background:linear-gradient(100deg,#ffb85c,#e0773c);z-index:1}.cc-acc-row.a1 span,.cc-acc-row.a1 b{color:#2a1300}
.cc-acc-row.a2{background:linear-gradient(100deg,#4aa8ff,#2f5fe0);z-index:2}
.cc-acc-row.a3{background:linear-gradient(100deg,#2fc3a0,#16807a);z-index:3}
.cc-acc-tot{position:relative;z-index:4;background:linear-gradient(170deg,#123a8c,#0a2160);border:1px solid rgba(160,210,255,.35);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.cc-acc-tot>span{font-size:12px;color:var(--cc-mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.cc-acc-tot>b{font-family:var(--f-display);font-stretch:112%;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.cc-acc-io{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cc-acc-io div{background:rgba(255,255,255,.07);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column}
.cc-acc-io span{font-size:11.5px;color:var(--cc-mut)}
.cc-acc-io b{font-family:var(--f-mono);font-weight:500;font-size:14px}
.cc-acc-debt{display:flex;align-items:baseline;gap:8px;margin-top:10px;padding:8px 12px;border-radius:12px;background:rgba(255,107,94,.10);border:1px solid rgba(255,107,94,.25);cursor:pointer;flex-wrap:wrap}
.cc-acc-debt span{font-size:13px;color:var(--cc-mut);flex:1}.cc-acc-debt b{font-family:var(--f-mono);font-weight:500;color:#ffb0a8}.cc-acc-debt small{font-size:12px;color:var(--cc-mut);width:100%}

/* Grafy */
.cc-svg{width:100%;height:auto;display:block;overflow:visible}
.cc-gl{stroke:rgba(160,200,255,.12);stroke-width:1}
.cc-zero{stroke:rgba(200,225,255,.35);stroke-width:1;stroke-dasharray:3 4}
.cc-ax{fill:#a9c3ea;font-size:11px;font-family:var(--f-mono)}
.cc-ax-cur{fill:#fff;font-weight:700}
.cc-fut{fill:rgba(255,255,255,.10)}
.cc-cur{filter:drop-shadow(0 0 6px rgba(127,212,255,.8))}
.cc-hl{stroke:#7fd4ff;stroke-width:1.2;stroke-dasharray:2 3}
.cc-tip{fill:#e9f6ff}.cc-tipt{fill:#05204f;font-size:11.5px;font-weight:700;font-family:var(--f-body)}
.cc-dot{fill:#0a2563;stroke:#7fd4ff;stroke-width:2}.cc-dot.neg{stroke:#ff8a80}
.cc-legrow{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--cc-mut);font-weight:600}
.cc-legrow span{display:inline-flex;align-items:center;gap:6px}.cc-legrow i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cc-donut{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr);gap:14px;align-items:center}
.cc-donut svg{width:100%;height:auto}
.cc-dn-v{fill:#fff;font-size:12px;font-weight:800;font-family:var(--f-display)}.cc-dn-s{fill:#a9c3ea;font-size:7px}
.cc-leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.cc-leg li{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.cc-leg i{width:10px;height:10px;border-radius:3px;flex:none}
.cc-leg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cc-mut)}
.cc-leg b{font-family:var(--f-mono);font-weight:500}
.cc-gauge{width:100%;max-width:230px;height:auto;display:block;margin:0 auto}
.cc-g-v{fill:#fff;font-size:30px;font-weight:800;font-family:var(--f-display)}.cc-g-s{fill:#a9c3ea;font-size:11px}
.cc-part{display:grid;grid-template-columns:5.2em minmax(0,1fr) 3.4em;gap:8px;align-items:center;font-size:12.5px;color:var(--cc-mut)}
.cc-part b{text-align:right;font-family:var(--f-mono);font-weight:500;color:var(--cc-ink)}

/* Auto, výlet, cieľ */
.cc-car-pic{display:flex;justify-content:center;align-items:center;min-height:110px;background:radial-gradient(60% 70% at 50% 70%,rgba(127,212,255,.22),transparent 70%);border-radius:14px}
.cc-car-pic svg,.cc-car-pic img{width:100%;max-width:280px;height:auto;max-height:130px;object-fit:contain;border-radius:12px}
.cc-car-n{font-weight:720;font-size:16px}.cc-car-n small{font-size:12px;color:var(--cc-mut);font-weight:500;margin-left:6px}
.cc-dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cc-dl li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.06);box-shadow:inset 3px 0 0 #3ed6a0}
.cc-dl li.warn{box-shadow:inset 3px 0 0 #ffc24a}.cc-dl li.crit{box-shadow:inset 3px 0 0 #ff6b5e;background:rgba(255,107,94,.12)}
.cc-dl b{font-family:var(--f-mono);font-weight:500}
.cc-trip-top{position:relative;border-radius:14px;overflow:hidden;height:118px}
.cc-trip-ill{width:100%;height:100%;display:block}
.cc-trip-cd{position:absolute;left:14px;bottom:10px;display:flex;align-items:baseline;gap:8px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.cc-trip-cd b{font-family:var(--f-display);font-stretch:118%;font-size:42px;font-weight:800;line-height:1}
.cc-trip-cd span{font-size:13px;font-weight:600}
.cc-trip-n{font-weight:720;font-size:16px}
.cc-prog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:12.5px;color:var(--cc-mut)}
.cc-goal{position:relative;border-radius:14px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;background:linear-gradient(160deg,#3557e8,#0d1a5a)}
.cc-goal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cc-goal-cap{position:relative;width:100%;padding:12px 14px;background:linear-gradient(180deg,transparent,rgba(3,12,40,.88) 40%);display:flex;flex-direction:column;gap:5px}
.cc-goal-cap b{font-size:17px;font-weight:720}.cc-goal-cap span,.cc-goal-cap small{font-size:12.5px;color:var(--cc-mut)}

/* Moduly – pôvodné widgety ako farebné dlaždice */
.cc-modh{display:flex;align-items:center;gap:8px;margin-top:4px}
.cc-modh h2{font-size:17px;font-weight:740}
.cc-mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.cc-mods .hx{width:auto;height:auto;min-height:150px;top:auto!important;align-items:flex-start;text-align:left;justify-content:flex-start;padding:14px 15px 15px;gap:4px;border-radius:18px;overflow:hidden}
.cc-mods .hx::before{inset:0;clip-path:inset(0 round 18px)}
.cc-mods .hx::after{inset:1px;clip-path:inset(0 round 17px)}
.cc-mods .hx .sq-h{justify-content:flex-start;flex-wrap:nowrap;font-size:12px;text-transform:uppercase;width:100%}
.cc-mods .hx .sq-h svg{width:17px;height:17px}
.cc-mods .hx .sq-h .pill{margin-left:auto!important}
.cc-mods .hx .w-big{font-size:32px;margin-top:6px!important}
.cc-mods .hx .sq-sub,.cc-mods .hx .sq-line{font-size:12.5px}
.cc-mods .hx .sq-line{margin-top:auto!important;padding-top:4px}
.cc-mods .hx .sq-cal-d{align-items:flex-start;flex-direction:row;gap:8px;align-items:baseline}
.cc-mods .hx .sq-cal-d .dn{font-size:34px}
.cc-mods .hx .sq-img{inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);clip-path:inset(0 round 17px)}
.cc-mods .hx .sq-edit{bottom:8px}
.cc-mods .hx:hover{transform:translateY(-2px)}

/* Tablet a menšie notebooky */
@container dash (max-width:1060px){
  .cc-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cc-head{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
  .cc-head-m{display:none}
}
@container dash (max-width:860px){
  .cc-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .cc-dnes,.cc-year{grid-column:span 6}
  .cc-pri,.cc-acc-c,.cc-don,.cc-cf,.cc-wk,.cc-car,.cc-trip,.cc-goalc{grid-column:span 3}
}
@container dash (max-width:600px){
  .cc-head{grid-template-columns:minmax(0,1fr);padding:16px}
  .cc-head-r{align-items:flex-start}.cc-clock{text-align:left}.cc-acts{justify-content:flex-start}
  .cc-head h1{font-size:30px}
  .cc-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cc-kpi-v{font-size:24px}.cc-kpi-sp{display:none}
  .cc-grid{grid-template-columns:minmax(0,1fr)}
  .cc-grid>*{grid-column:auto!important}
  .cc-mods{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){.cc-card,.cc-kpi{transition:none}}

/* ===== Navigácia dole na všetkých zariadeniach (od 13. 11. 2026) ===== */
.app{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr) auto}
.side{display:none!important}
.bottomnav button>span:not(.fab){white-space:nowrap}
@media (max-width:820px){ .bottomnav .nb-x{display:none} }
@media (min-width:821px){

    background:rgba(9,22,58,.74);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(130,185,255,.28);box-shadow:0 18px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);max-width:calc(100vw - 24px)}
  .bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:#a9c3ea;padding:7px 10px;border-radius:16px;cursor:pointer;min-width:62px;font-family:inherit}
  .bottomnav button svg{width:22px;height:22px}
  .bottomnav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .bottomnav button[aria-current="page"]{background:rgba(127,212,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(127,212,255,.35)}
  .bottomnav .fab-wrap{color:#fff;padding:0 6px}
  .bottomnav .fab-wrap:hover{background:none}
  .bottomnav .fab{width:50px;height:50px;border-radius:16px;margin-top:-22px;background:linear-gradient(160deg,#8fd0ff,#2f7bff 55%,#1a3fb0);color:#041530;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(47,123,255,.55)}
  .bottomnav .fab svg{width:26px;height:26px}
  .more-sheet{left:50%;right:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(700px,calc(100vw - 32px));border-radius:24px;border:1px solid var(--line);grid-template-columns:repeat(4,minmax(0,1fr));padding:16px}
  .more-sheet .in-dock{display:none}
  .toast{bottom:calc(108px + env(safe-area-inset-bottom,0px))}
}
.more-sheet button[aria-current="page"]{border-color:var(--accent);color:var(--accent)}
.ms-foot{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.ms-foot .sp{flex:1}

/* ===== Nástenka v2 – pásy na celú šírku ===== */
.view-dash.ds{--cc-line:rgba(130,185,255,.22);--cc-ink:#eef5ff;--cc-mut:#a9c3ea;--cc-cy:#7fd4ff;max-width:1240px;gap:18px;color:var(--cc-ink)}
.ds .sp{flex:1}
.ds .pos{color:#5fe3a8}.ds .neg{color:#ff8a80}
.ds .bar{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;border:0}
.ds .bar i{display:block;height:100%;background:linear-gradient(90deg,#2f7bff,#7fd4ff);border-radius:3px}
.ds-hero,.ds-sec{border-radius:26px;border:1px solid var(--cc-line);background:linear-gradient(160deg,rgba(64,128,255,.16),rgba(14,40,110,.30));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 40px rgba(2,10,40,.30);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ds-empty{font-size:14px;color:var(--cc-mut);padding:6px 2px;list-style:none}
.ds-empty.ok{color:#9be8c6}
.ds-link{border:0;background:none;color:var(--cc-cy);font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;padding:6px 0;text-align:left}
.ds-btn{border:1px solid var(--cc-line);background:rgba(255,255,255,.09);color:#fff;border-radius:12px;padding:8px 14px;font:inherit;font-weight:650;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ds-btn:hover{background:rgba(255,255,255,.16)}
.ds-btn.pri{background:linear-gradient(160deg,#8fd0ff,#2f7bff);color:#041530;border-color:transparent}
.ds-ct{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cc-mut);margin-bottom:8px}

/* Prehľad dňa */
.ds-hero{padding:22px 24px;display:flex;flex-direction:column;gap:18px;background:radial-gradient(60% 120% at 62% 0%,rgba(127,212,255,.22),transparent 60%),linear-gradient(125deg,rgba(47,123,255,.36),rgba(11,40,115,.42))}
.ds-hero-top{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:20px;align-items:center}
.ds-eyebrow{font-size:12.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--cc-mut)}
.ds-hero h1{font-size:38px;font-weight:800;font-stretch:115%;line-height:1.08;margin-top:6px}
.ds-lead{margin:6px 0 0;font-size:15px;color:#cfe0fb}
.ds-hero-ill .cc-ill{width:190px;max-width:none}
.ds-hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.ds-clock{font-size:56px!important;color:#fff;line-height:1}
.ds-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ds-stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-radius:18px;background:rgba(3,12,40,.32);border:1px solid var(--cc-line);overflow:hidden}
.ds-stat{border:0;border-left:1px solid var(--cc-line);background:none;color:var(--cc-ink);font:inherit;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;position:relative}
.ds-stat:first-child{border-left:0}
.ds-stat:hover{background:rgba(255,255,255,.06)}
.ds-stat::after{content:"";position:absolute;left:14px;right:14px;top:0;height:3px;border-radius:0 0 3px 3px;background:transparent}
.ds-stat.ok::after{background:#3ed6a0}.ds-stat.warn::after{background:#ffc24a}.ds-stat.crit::after{background:#ff6b5e}
.ds-stat .k{font-size:12px;font-weight:650;color:var(--cc-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-stat b{font-family:var(--f-display);font-stretch:112%;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.ds-stat.crit b{color:#ffb0a8}
.ds-stat .s{font-size:12.5px;color:var(--cc-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-day .cc-tl-track{background:rgba(3,12,40,.32)}
.ds-agenda{display:none;list-style:none;margin:0;padding:0;flex-direction:column;gap:6px}
.ds-agenda li{display:flex;gap:10px;align-items:baseline;padding:9px 12px;border-radius:12px;background:rgba(3,12,40,.30);box-shadow:inset 3px 0 0 var(--cc);cursor:pointer;font-size:14.5px}
.ds-agenda b{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--cc-mut);min-width:3.6em}
.ds-chips .hchip{color:#fff}

/* Sekcie */
.ds-sec{padding:16px 20px 18px;display:flex;flex-direction:column;gap:14px}
.ds-sh{display:flex;align-items:center;gap:12px;min-width:0}
.ds-ic{width:38px;height:38px;border-radius:12px;background:linear-gradient(160deg,rgba(127,212,255,.30),rgba(47,123,255,.20));display:inline-flex;align-items:center;justify-content:center;color:#cfeaff;flex:none}
.ds-ic svg{width:20px;height:20px}
.ds-ht{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.ds-sh h2{font-size:20px;font-weight:760;letter-spacing:0}
.ds-meta{font-size:13.5px;color:var(--cc-mut)}
.ds-more{border:1px solid var(--cc-line);background:rgba(255,255,255,.06);color:var(--cc-cy);font:inherit;font-weight:650;font-size:13px;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.ds-more:hover{background:rgba(255,255,255,.12)}
.ds-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
.ds-cols-mail{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.ds-fch{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.ds-col{min-width:0;display:flex;flex-direction:column}
.ds-cols>.ds-col+.ds-col{border-left:1px solid var(--cc-line);padding-left:22px}

/* Úlohy */
.ds-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ds-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(130,185,255,.12);cursor:pointer;min-width:0}
.ds-row:last-child{border-bottom:0}
.ds-row:hover{background:rgba(255,255,255,.04)}
.ds-row .chk{border-color:rgba(255,255,255,.55);background:transparent;flex:none}
.ds-row .t{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-row .p{font-size:12px;color:var(--cc-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30%}
.ds-row .d{font-size:12.5px;font-family:var(--f-mono);color:var(--cc-mut);white-space:nowrap}
.ds-row .d.late{color:#ff9a90}.ds-row .d.today{color:#ffd27a}
.ds-add{display:flex;gap:8px;margin-top:10px}
.ds-add input{flex:1;min-width:0;background:rgba(3,12,40,.35);border:1px solid var(--cc-line);color:#fff;border-radius:12px;padding:9px 12px;font:inherit;font-size:14.5px}
.ds-add input::placeholder{color:#8fa9d3}

/* Pošta */
.ds-mails{display:flex;flex-direction:column;gap:8px}
.ml{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-radius:16px;background:rgba(3,12,40,.32);border:1px solid rgba(130,185,255,.14);align-items:start}
.ml.imp{box-shadow:inset 3px 0 0 #ff8a6b}

.ml-time{font-size:12px;color:var(--cc-mut,var(--muted));white-space:nowrap;font-family:var(--f-mono)}
.ml-badge{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:rgba(255,255,255,.12);white-space:nowrap}
