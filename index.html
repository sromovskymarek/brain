async function pdfRead(blob,imgBudget,imgMax){ const L=await pdfjs();
  const doc=await L.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false}).promise;
  const n=doc.numPages, lim=Math.min(n,40), pages=[];
  for(let i=1;i<=lim;i++){ const p=await doc.getPage(i); const tc=await p.getTextContent(); let s=""; for(const it of tc.items){ if(typeof it.str!=="string") continue; s+=it.str+(it.hasEOL?"\n":" "); } pages.push(s.replace(/[ \t ]+/g," ").replace(/ *\n */g,"\n").replace(/\n{3,}/g,"\n\n").trim()); }
  const chars=pages.join("").length, imgs=[];
  if(chars<80*lim&&imgBudget>0){ for(let i=1;i<=Math.min(lim,imgBudget);i++){ const p=await doc.getPage(i), v0=p.getViewport({scale:1}), sc=Math.min(2.5,1600/Math.max(v0.width,v0.height)), vp=p.getViewport({scale:sc});
      const cv=document.createElement("canvas"); cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height); const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
      await p.render({canvasContext:ctx,viewport:vp}).promise; let b=await canvasBlob(cv,.82); if(b&&imgMax&&b.size>imgMax) b=await canvasBlob(cv,.6); if(b&&(!imgMax||b.size<=imgMax)) imgs.push({blob:b,page:i}); } }
  try{ doc.destroy(); }catch(e){}
  return {text:chars>=20?pages.map((s,i)=>`[strana ${i+1}]\n${s}`).join("\n\n"):"",pages:n,imgs}; }
async function imgFit(blob,il){ const okType=(il.mediaTypes||[]).includes(blob.type);
  if(okType&&blob.size<=il.maxInputBytes&&blob.size<=4.5*1024*1024) return blob;
  try{ const bm=await createImageBitmap(blob); const sc=Math.min(1,2000/Math.max(bm.width,bm.height)); const cv=document.createElement("canvas"); cv.width=Math.round(bm.width*sc); cv.height=Math.round(bm.height*sc); cv.getContext("2d").drawImage(bm,0,0,cv.width,cv.height); try{ bm.close(); }catch(e){}
    const b=await canvasBlob(cv,.85); return b&&b.size<=il.maxInputBytes?b:null; }catch(e){ return okType&&blob.size<=il.maxInputBytes?blob:null; } }

async function tripDocRead(tid,list){ const t=byId("trips",tid); if(!t) return;
  if(!S.sample){ S.tdoc=null; toast("Vyčítanie údajov funguje po otvorení Brain v Claude."); renderView(); return; }
  S.tdoc={trip:tid,busy:true,msg:"Pripravujem dokumenty…"}; if(S.view==="vylety") renderView();

  try{
    const lim=await S.sample.limits().catch(()=>null), il=lim?.images; let budget=il?Math.min(il.maxCount,8):0;
    const parts=[], images=[], inames=[];
    for(const [i,x] of list.entries()){ if(ctl.signal.aborted) throw {code:"cancelled"}; const d=x.doc, b=x.blob, type=b?.type||d.type||"";

          if(!r.text&&!r.imgs.length) parts.push(`=== DOKUMENT ${i} · ${d.name} === (PDF neobsahuje čitateľný text)`);
        }catch(e){ parts.push(`=== DOKUMENT ${i} · ${d.name} === (PDF sa nepodarilo otvoriť)`); }

        const im=il&&budget>0?await imgFit(b,il):null;
        if(im){ images.push(im); inames.push(`obrázok ${images.length} = dokument ${i} (${d.name}) – fotka`); budget--; } else parts.push(`=== DOKUMENT ${i} · ${d.name} === (fotku sa nepodarilo poslať)`);
      } else { let s=""; try{ s=await b.text(); }catch(e){} parts.push(`=== DOKUMENT ${i} · ${d.name} · text ===\n${s.slice(0,60000)}`); }
    }
    const docList=list.map((x,i)=>`${i}: ${x.doc.name}`).join("\n");
    const head=`Čítaš cestovné dokumenty k výletu v osobnej aplikácii Brain (Marek Šromovský, Slovensko). Dnes je ${today()}.

VÝLET TERAZ:
${tripDocCtx(t)}

DOKUMENTY (index: názov):
${docList}
${inames.length?"OBRÁZKY:\n"+inames.join("\n")+"\n":""}
PRAVIDLÁ:
- Píš po slovensky. Zapíš len to, čo je v dokumentoch. Nič nevymýšľaj ani neodhaduj. Dátumy, časy, čísla letov, kódy rezervácií, adresy, telefóny a mená prepíš presne.
- Dátumy YYYY-MM-DD, časy HH:MM v miestnom čase, ako ich uvádza dokument. Ak dátum nemá rok, použi rok termínu výletu, inak najbližší budúci.
- Neopakuj nič, čo je už zapísané vo VÝLET TERAZ (rovnaký let, rovnaký bod programu, rovnaká vec).
- trip: vyplň len hodnoty, ktoré jasne vyplývajú z dokumentov, inak null. start = deň prvého odchodu/odletu z domova, end = deň návratu domov. dest = cieľ alebo trasa (napr. "Lima – Cusco – Machu Picchu"). people = mená cestujúcich. kind len ak je zrejmý: ${Object.keys(TRIP_KIND).join(", ")}.
- bookings: každý let (segment) zvlášť: kind "let", title napr. "Let KSC → IST · TK 1048", date a time = odlet, endDate a endTime = prílet, place = letisko odletu (terminál), ref = kód rezervácie (PNR), note = batožina, sedadlá, cestujúci, online check-in. Ubytovanie: kind "ubytovanie", title = názov ubytovania, date = check-in, time = check-in od, endDate = check-out, endTime = check-out do, place = adresa, ref = číslo rezervácie, note = izba, strava, storno do, cena. Transfer, vlak, autobus, požičovňa auta = "doprava". Prehliadky, výlety, vstupenky = "vstupenka"; divadlo, koncert, kino = "kultura"; ostatné = "ine". booked = true, ak dokument potvrdzuje rezerváciu alebo zaplatenie; false, ak je to len ponuka alebo návrh.
- itinerary: program po dňoch (najmä z itinerára cestovky): [{"date","title","items":["09:00 …", …]}], najviac 12 stručných bodov na deň. Lety a ubytovanie sem nedávaj, tie patria do bookings.
- prep: čo treba vybaviť pred odchodom podľa dokumentov (online check-in, doplatok, víza, očkovanie, cestovné poistenie, platnosť pasu, formuláre, vstupné povolenia), due = termín, ak je uvedený alebo sa dá presne vypočítať (napr. online check-in otvára 24 h pred odletom = deň pred odletom), inak null.
- packing: veci, ktoré dokumenty výslovne odporúčajú alebo vyžadujú zobrať; cat jedna z: Doklady, Oblečenie, Zdravie, Elektronika, Ostatné.

- tips: Markdown, max 15 riadkov – dôležité informácie, ktoré sa nehodia inam: kontakt na cestovku / delegáta, núdzové čísla, miesto a čas stretnutia, čo je a nie je v cene, pravidlá batožiny, storno podmienky. "" ak nič.
- docs: pre každý dokument {"i": index, "kind": jedno z ${Object.keys(TRIP_DOC_KIND).join(", ")}, "title": krátky názov (napr. "Letenka Turkish Airlines KSC – LIM"), "summary": 1 veta}.
- Nikdy neuvádzaj čísla platobných kariet, čísla pasov a občianskych preukazov, rodné čísla ani heslá.

function shopSave(l,items){ return put("shop",l.id,{items:items.slice(0,300),updated:nowIso()},true); }
async function shopAddItems(txt,qty){ const parts=String(txt).split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).slice(0,50); if(!parts.length) return;
  const now=nowIso(), q=parts.length===1?String(qty||"").trim().slice(0,30):"";
  const add=parts.map(t=>({id:rid(),t:t.slice(0,120),q,done:false,created:now}));
  const l=shopCur();
  if(!l){ const id=rid(); const ok=await put("shop",id,{name:"Nákup",note:"",items:add,created:now,updated:now}); if(ok){ S.shopId=id; toast("Zoznam „Nákup“ vytvorený"); } return; }
  const cur=shopItems(l).map(x=>({...x})), seen=new Map(cur.map(x=>[shopKey(x.t),x])); let n=0, back=0;
  for(const a of add){ const ex=seen.get(shopKey(a.t)); if(ex){ if(ex.done){ ex.done=false; ex.doneAt=""; if(a.q) ex.q=a.q; back++; } continue; } cur.push(a); seen.set(shopKey(a.t),a); n++; }
  if(!n&&!back){ toast("Už je v zozname."); return; }
  await shopSave(l,cur); }
function shopListForm(l){ openForm({title:l?"Upraviť zoznam":"Nový nákupný zoznam",data:{name:l?.name||"",note:l?.note||""},fields:[{k:"name",l:"Názov",ph:"napr. Týždenný nákup, Drogéria, Grilovačka"},{k:"note",l:"Poznámka",ph:"napr. na sobotu, pre 8 ľudí",wide:true}],

    const ok=await put("shop",id,l?{name,note,updated:now}:{name,note,items:[],created:now,updated:now},!!l); if(ok) S.shopId=id; return ok; },
  onDelete:l?()=>{ S.shopId=""; return delDoc("shop",l.id); }:null}); }
function bindNakupy(){

let jTimer=0;
function jSave(now){ S.jdDirty=true; clearTimeout(jTimer); const run=async()=>{ const j=S.jd; if(!j) return; const ok=await put("journal",j.date,{...j,updated:new Date().toISOString()}); if(ok&&S.jd===j) S.jdDirty=false; }; if(now) run(); else jTimer=setTimeout(run,700); }

async function readDiary(file){
  if(!S.sample){ toast("Čítanie diára cez AI je zatiaľ v Claude."); return; }
  if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){ toast("Tento formát fotky Claude nevie prečítať."); return; }
  const lim=await S.sample.limits().catch(()=>null); if(!lim?.images){ toast("Posielanie fotiek do Claude tu nie je dostupné."); return; }
  const d=jDate(); toast("Claude číta stranu diára…");
  const [up]=await uploadFiles([file]);
  try{
    const r=await S.sample.json(`Na fotke je strana osobného diára (slovenčina, rukopis). Prepíš presne, čo je napísané, nič nevymýšľaj ani nedopĺňaj. Vráť IBA JSON:
{"targets":["najviac 3 targety alebo ciele dňa"],"awards":["najviac 3 veci, za ktoré sa autor oceňuje"],"good":"čo urobil dobre alebo null","better":"čo by urobil inak alebo null","notes":"ostatný čitateľný text strany alebo null"}
Ak niektorá časť na strane nie je, daj prázdne pole alebo null.`,{images:[file],cache:false});
    jPatch(d,j=>{ (Array.isArray(r?.targets)?r.targets:[]).slice(0,3).forEach((t,i)=>{ if(t&&!j.targets[i].t) j.targets[i].t=String(t).slice(0,200); });
      (Array.isArray(r?.awards)?r.awards:[]).slice(0,3).forEach((a,i)=>{ if(a&&!j.awards[i]) j.awards[i]=String(a).slice(0,200); });
      if(r?.good&&!j.good) j.good=String(r.good).slice(0,3000); if(r?.better&&!j.better) j.better=String(r.better).slice(0,3000);
      if(r?.notes) j.notes=String(r.notes).slice(0,5000); if(up) j.photo=up.id; });
    toast("Diár prepísaný. Skontroluj a doplň.");
  }catch(e){ if(up) jPatch(d,j=>{ j.photo=up.id; }); toast(sErr(e)); if(aiOff.includes(e?.code)) S.sample=null; }
  if(S.view==="dennik") renderView();
}

function priorities(){ const td=today(), P=[];
  for(const u of units()) for(const x of bzOpen(u.id)) if(x.due&&x.due<td) P.push({sev:2,t:`${uShort(u)}: neuhradená ${x.inv?"FA "+x.inv:"platba"} – ${x.title||"klient"} · ${eur(x.amount)}`,m:daysTxt(dayDiff(x.due)),go:"financie/"+u.id});
  for(const t of items().filter(isOpenTask)) if(t.due){ const n=dayDiff(t.due); if(n<=2) P.push({sev:n<0?3:2,t:t.title||"Úloha",m:n<0?`${-n} d po termíne`:n===0?"dnes":n===1?"zajtra":"pozajtra",open:t.id}); }
  for(const x of S.mail) if(x.cat==="dolezite"&&!x.handled) P.push({sev:/phishing/i.test(x.summary||"")?3:2,t:(x.from?x.from+": ":"")+(x.subject||""),m:x.deadline?"termín "+fmtDate(x.deadline):"mail"});
  for(const c of C.cars) for(const d of carDeadlines(c)) if(d.state!=="ok") P.push({sev:d.state==="crit"?3:1,t:d.l+" – "+(c.name||"auto"),m:d.days!=null?daysTxt(d.days):d.kmLeft!=null?(d.kmLeft<0?"prekročené":"o "+fmtKm(d.kmLeft)):"",go:"auta"});
  for(const e of virtualEvents(td,addDays(td,3))) if(e.it.cal==="financie") P.push({sev:1,t:e.it.title,m:shortWhen(e),go:"financie/uvery"});
  for(const t of C.trips){ const n=t.start?dayDiff(t.start):null; if(n!=null&&n>=0&&n<=45){ const open=(t.prep||[]).filter(x=>!x.done).length; const late=(t.prep||[]).filter(x=>!x.done&&x.due&&dayDiff(x.due)<=3).length; if(open) P.push({sev:late?2:1,t:`${t.name}: ${open} ${plural(open,"vec","veci","vecí")} na vybavenie`,m:"odchod o "+n+" d",go:"vylety/"+t.id}); } }
  return P.sort((a,b)=>b.sev-a.sev).slice(0,7); }

function lifeContext(){ const L=[], m0=today().slice(0,7);
  for(let k=0;k<3;k++){ const m=shiftMonth(m0,-k), inc=incMonth(m); if(inc.length) L.push(`- Príjmy ${monthName(m)}: ${eur(sumAmt(inc))} (${Object.entries(inc.reduce((o,i)=>{ const s=INC_SRC[i.src]||"Iné"; o[s]=(o[s]||0)+(+i.amount||0); return o; },{})).map(([s,v])=>s+" "+eur(v)).join(", ")})`); }

  { const A=C.recur.filter(subActive); if(A.length) L.push("- Pravidelné výdaje (aktívne): "+A.map(r=>`${r.name} ${eur(r.amount)} ${(SUB_FREQ[r.freq]||"mesačne").toLowerCase()}${subNext(r)?", ďalšia platba "+subNext(r):""}`).join("; ")+`; spolu ${eur(recurMonthly())} mesačne`); }

function measSeries(k){ return measSorted().filter(m=>num(m[k])!=null).map(m=>({d:mDate(m),v:num(m[k])})); }
function measStat(k){ const s=measSeries(k); if(!s.length) return null; const last=s[s.length-1], first=s[0];
  const lim=addDays(last.d,-30); const ref=[...s].reverse().find(x=>x.d<=lim)||null;

const e1rm=(kg,reps)=>{ kg=+kg; reps=+reps; if(!(kg>0)||!(reps>0)) return 0; return reps===1?kg:kg*(1+reps/30); };  /* Epleyho odhad 1RM */
const exKey=n=>norm(n).replace(/\s+/g," ").trim();
const fmtKg=v=>String(r1(+v)).replace(".",",");
const fmtSet=s=>s?`${num(s.kg)>0?fmtKg(num(s.kg))+" kg × ":""}${num(s.reps)||0}`:"";
function exHistory(name){ const k=exKey(name), out=[];
  for(const w of [...C.workouts].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.created||"").localeCompare(b.created||"")))
    for(const e of (w.exercises||[])) if(exKey(e.name)===k){ const sets=(e.sets||[]).filter(s=>num(s.reps)>0); if(!sets.length) continue;
      let best=0,top=sets[0],vol=0,reps=0; for(const s of sets){ const kg=num(s.kg)||0, r=num(s.reps)||0, x=e1rm(kg,r); vol+=kg*r; reps+=r; if(x>best){ best=x; top=s; } }
      out.push({date:w.date,wid:w.id,best,vol,reps,sets:sets.length,top}); }
  return out; }
/* Zlepšenie: s váhou = odhad 1RM (Epley), bez váhy = súčet opakovaní */
function exProgress(h){ if(!h.length) return null; const withKg=h.every(x=>x.best>0); const m=x=>withKg?x.best:x.reps;
  const f=h[0], l=h[h.length-1], p=h.length>1?h[h.length-2]:null;
  return {first:f,last:l,prev:p,n:h.length,withKg,m0:m(f),m1:m(l),pct:h.length>1&&m(f)>0?(m(l)-m(f))/m(f)*100:null,pctPrev:p&&m(p)>0?(m(l)-m(p))/m(p)*100:null,series:h.map(m)}; }

  return [...mp.values()].sort((a,b)=>a.localeCompare(b,"sk")); }

function parsePlanText(t){ return String(t||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const p=l.split(/[;|]/).map(x=>x.trim()); const name=p[0].replace(/^[-*•]\s*|^\d+[.)]\s*/,"").trim(); let sets=null,reps="",kg=null;
    for(const x of p.slice(1)){ const m=x.match(/^(\d+)\s*[x×*]\s*(\d+(?:\s*[-–]\s*\d+)?)/i); if(m){ sets=+m[1]; reps=m[2].replace(/\s/g,""); continue; } const k=x.match(/^(\d+(?:[.,]\d+)?)\s*(kg)?$/i); if(k) kg=num(k[1]); }

let hqCtl=null;
async function hQuick(){ const Q=S.hl.quick; if(Q.busy) return; const text=($("#hqText")?.value||Q.text||"").trim(); Q.text=text;
  if(!text&&!Q.file){ toast("Napíš alebo nadiktuj, čo chceš zapísať."); return; }
  if(!S.sample){ toast("Rýchly zápis cez Claude funguje zatiaľ len v Claude verzii."); return; }
  let images; if(Q.file&&/^image\/(jpeg|png|webp|gif)$/.test(Q.file.type)){ const lim=await S.sample.limits().catch(()=>null); if(lim?.images) images=[Q.file]; }
  const td=today(), dn=DAYS[new Date().getDay()];
  const prompt=`Spracuješ zápis do sekcie Zdravie osobnej aplikácie Mareka. Dnes je ${td} (${dn}), čas ${clockTxt()}, časová zóna Európa/Bratislava.
Vstup môže obsahovať: telesné miery, tréning vo fitku (cviky, série, kg, opakovania), jedlo a pitie, aktivity pre pohodu (prechádzka, príroda, šport, wellness, masáž, čas pre seba), spánok, kroky a dohodnuté termíny (strihanie, masáž, lekár…).
PRAVIDLÁ:
- Nič nevymýšľaj, zapíš len to, čo je vo vstupe (alebo na fotke). Relatívne dátumy ("včera", "v utorok", "zajtra o 10:30") prepočítaj podľa dnešného dátumu. Bez dátumu = dnes.
- "3x8 80 kg" = 3 série po 8 opakovaní s 80 kg; "80 kg 10, 85 kg 8, 90 kg 6" = 3 série s rôznou váhou. Cvik bez váhy (zhyby, kliky) = kg 0.
- Cvik pomenuj presne ako v zozname existujúcich cvikov, ak ide o ten istý cvik; inak krátkym slovenským názvom.
- Jedlo: ak nie sú hodnoty dané, odhadni nutričné hodnoty CELEJ porcie podľa bežných tabuliek (estimated true). Ak je na fotke jedlo, odhadni ho.
- Termíny: ak sa týkajú položky zo zoznamu starostlivosti (napr. strihanie), daj do "care" jej presný názov.
- Polia, ktoré vo vstupe nie sú, nechaj null alebo prázdne pole.
EXISTUJÚCE CVIKY: ${allExercises().join(", ")||"(žiadne)"}
STAROSTLIVOSŤ: ${C.care.map(c=>c.name).join(", ")||"(žiadna)"}
VSTUP:
"""
${text.slice(0,8000)||"(len fotka)"}
"""
Odpovedz IBA JSON:
{"measures":{"date":"YYYY-MM-DD","weight":null,"waist":null,"chest":null,"hips":null,"arm":null,"thigh":null,"neck":null,"fat":null},
"workouts":[{"date":"YYYY-MM-DD","name":"napr. Tréning A – hrudník","minutes":null,"exercises":[{"name":"...","sets":[{"kg":0,"reps":0}]}]}],
"meals":[{"date":"YYYY-MM-DD","time":null,"slot":"ranajky|desiata|obed|olovrant|vecera|snack","name":"...","grams":null,"kcal":null,"protein":null,"carbs":null,"sugar":null,"fat":null,"fiber":null,"salt":null,"estimated":true}],
"selfcare":[{"date":"YYYY-MM-DD","kind":"prechadzka|priroda|sport|wellness|masaz|relax|ine","minutes":null,"note":""}],
"appointments":[{"title":"...","date":"YYYY-MM-DD","time":null,"care":null}],
"day":{"date":"YYYY-MM-DD","water_ml":null,"sleep_h":null,"steps":null}}
measures daj null, ak vo vstupe nie sú žiadne miery; day daj null, ak nie je voda, spánok ani kroky.`;
  Q.busy=true; renderView(); hqCtl=new AbortController();
  try{ const r=await S.sample.json(prompt,{images,cache:false,signal:hqCtl.signal}); Q.prop=hqProposal(r||{}); if(!Q.prop.length) toast("Vo vstupe som nenašiel nič na zápis.");
  }catch(e){ if(e?.code!=="cancelled") toast(sErr(e)); if(aiOff.includes(e?.code)) S.sample=null; }
  Q.busy=false; hqCtl=null; if(S.view==="zdravie") renderView(); }
function hqProposal(r){ const P=[], dOk=d=>ISO_RE.test(String(d||""))?String(d):today();
  const m=r.measures; if(m&&typeof m==="object"){ const o={}; for(const [k] of MEAS){ const v=num(m[k]); if(v!=null&&v>0) o[k]=v; } if(Object.keys(o).length) P.push({kind:"meas",inc:true,d:dOk(m.date),data:o,label:"Miery: "+MEAS.filter(([k])=>o[k]!=null).map(([k,l,u])=>`${l} ${fmtN(o[k])} ${u}`).join(", ")}); }
  for(const w of (Array.isArray(r.workouts)?r.workouts:[]).slice(0,5)){ const ex=(Array.isArray(w?.exercises)?w.exercises:[]).map(e=>({name:String(e?.name||"").trim().slice(0,80),sets:(Array.isArray(e?.sets)?e.sets:[]).map(s=>({kg:num(s?.kg)??0,reps:Math.round(num(s?.reps)||0)})).filter(s=>s.reps>0).slice(0,15)})).filter(e=>e.name&&e.sets.length);
    if(ex.length) P.push({kind:"work",inc:true,d:dOk(w.date),data:{name:String(w.name||"Tréning").slice(0,80),minutes:num(w.minutes),exercises:ex},label:`Tréning: ${ex.map(e=>`${e.name} ${e.sets.length}× (${e.sets.map(fmtSet).join(", ")})`).join("; ")}`}); }
  for(const x of (Array.isArray(r.meals)?r.meals:[]).slice(0,12)){ if(!x?.name) continue; const o={name:String(x.name).slice(0,120),time:/^\d{2}:\d{2}$/.test(String(x.time||""))?x.time:"",grams:num(x.grams),estimated:x.estimated!==false}; o.slot=MEAL_SLOT[x.slot]?x.slot:slotByTime(o.time); for(const [k] of NUTR) o[k]=num(x[k]);
    P.push({kind:"meal",inc:true,d:dOk(x.date),data:o,label:`${MEAL_SLOT[o.slot]}: ${o.name}${o.grams?" "+fmtN(o.grams,0)+" g":""} · ${o.kcal!=null?fmtN(o.kcal,0)+" kcal":"bez kcal"}${o.protein!=null?", B "+fmtN(o.protein,0)+" g":""}${o.estimated?" (odhad)":""}`}); }
  for(const x of (Array.isArray(r.selfcare)?r.selfcare:[]).slice(0,10)){ const k=SELF_KIND[x?.kind]?x.kind:"ine"; P.push({kind:"self",inc:true,d:dOk(x?.date),data:{kind:k,minutes:num(x?.minutes),note:String(x?.note||"").slice(0,300)},label:`${SELF_KIND[k]}${num(x?.minutes)?" "+fmtN(num(x.minutes),0)+" min":""}${x?.note?" – "+String(x.note).slice(0,60):""}`}); }
  for(const x of (Array.isArray(r.appointments)?r.appointments:[]).slice(0,5)){ if(!x?.title||!ISO_RE.test(String(x.date||""))) continue; const t=/^\d{2}:\d{2}$/.test(String(x.time||""))?x.time:""; const c=C.care.find(c=>exKey(c.name)===exKey(x.care||""));
    P.push({kind:"appt",inc:true,d:x.date,data:{title:String(x.title).slice(0,120),time:t,care:c?.id||""},label:`Termín: ${x.title} · ${fmtDate(x.date)}${t?" o "+t:""}${c?" (prepojené so Starostlivosťou)":""}`}); }
  const dy=r.day; if(dy&&typeof dy==="object"){ const o={water:num(dy.water_ml),sleep:num(dy.sleep_h),steps:num(dy.steps)}; if(o.water||o.sleep||o.steps) P.push({kind:"day",inc:true,d:dOk(dy.date),data:o,label:[o.water?`Voda +${fmtN(o.water,0)} ml`:"",o.sleep?`Spánok ${fmtN(o.sleep)} h`:"",o.steps?`Kroky ${fmtN(o.steps,0)}`:""].filter(Boolean).join(" · ")}); }
  return P; }
async function hqSave(){ const Q=S.hl.quick; const L=(Q.prop||[]).filter(x=>x.inc); if(!L.length){ toast("Nič nie je vybrané."); return; } let n=0;
  for(const x of L){ let ok=false;
    if(x.kind==="meas"){ const old=C.measures.find(m=>mDate(m)===x.d); ok=await put("measures",x.d,{...(old?noId(old):{}),...x.data,date:x.d,created:old?.created||nowIso(),updated:nowIso()}); }
    else if(x.kind==="work") ok=await put("workouts",rid(),{date:x.d,planId:"",note:"",...x.data,created:nowIso(),updated:nowIso()});
    else if(x.kind==="meal") ok=await put("meals",rid(),{date:x.d,per100:null,note:"",photo:"",src:"rychly",...x.data,created:nowIso(),updated:nowIso()});
    else if(x.kind==="self") ok=await put("selfcare",rid(),{date:x.d,...x.data,created:nowIso(),updated:nowIso()});
    else if(x.kind==="appt"){ const c=x.data.care?byId("care",x.data.care):null;
      if(c){ const eid=c.eventId&&S.items.has(c.eventId)?c.eventId:newId(); const prev=S.items.get(eid)||{};
        ok=await saveItem(eid,{...prev,type:"udalost",title:`${c.name}${c.contact?" – "+c.contact:""}`,body:`Starostlivosť o seba · Brain → Zdravie${c.phone?"\nKontakt: "+c.phone:""}`,tags:["zdravie","starostlivost"],links:prev.links||[],date:x.d,time:x.data.time,cal:"osobne",area:"sukromie",repeat:"",source:"zdravie",created:prev.created});
        if(ok) ok=await put("care",c.id,{...noId(c),nextDate:x.d,nextTime:x.data.time,eventId:eid,updated:nowIso()}); }
      else ok=!!(await addHealthEvent(x.data.title,x.d,x.data.time)); }
    else if(x.kind==="day"){ const h=hdayDoc(x.d)||{}; const o={...noId(h),date:x.d,updated:nowIso()}; if(x.data.water) o.water=(num(h.water)||0)+x.data.water; if(x.data.sleep) o.sleep=x.data.sleep; if(x.data.steps) o.steps=x.data.steps; ok=await put("hday",x.d,o); }
    if(ok) n++; }
  toast(`Zapísané: ${n} z ${L.length}`); if(n===L.length){ Q.text=""; Q.file=null; Q.prop=null; lsSet("hq",""); } renderView(); }

const pctLess=(d,u)=>(d>0?"+":"")+fmtN(d)+" "+u;
function nutrBars(t,H,short){ const rows=[["kcal","Energia","kcal",H.kcal],["protein","Bielkoviny","g",H.protein],["carbs","Sacharidy","g",H.carbs],["fat","Tuky","g",H.fat],["fiber","Vláknina","g",H.fiber]];
  return `<div class="nbars">${rows.map(([k,l,u,g])=>{ const v=t[k]||0, p=g?Math.min(100,v/g*100):0, over=g&&v>g*1.1;
    return `<div class="nbar"><span class="lbl">${l}</span><div class="bar"><i style="width:${g?p:0}%;background:${over?"var(--warn)":"var(--wh-1)"}"></i></div><span class="val mono">${fmtN(v,0)}${g?" / "+fmtN(g,0):""} ${u}</span></div>`; }).join("")}
    ${!H.kcal&&short?`<div style="font-size:12px;color:var(--muted)">Nastav si denné ciele (kcal, bielkoviny…) v Ciele a nastavenia.</div>`:""}</div>`; }
function hMiery(){ const H=hset(), rows=[...measSorted()].reverse();

  <div class="cards">${MEAS.map(([k,l,u])=>{ const s=measStat(k); return `<div class="card mcard"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div class="eyebrow">${l}</div><div class="mv">${s?fmtN(s.last.v)+" "+u:"–"}</div></div><span class="sp-c">${s?spark(s.series.slice(-20).map(x=>x.v)):""}</span></div>
    <div class="mm">${s?`<span>${fmtDate(s.last.d)}</span>${s.d30!=null?`<span>30 dní: <b>${pctLess(r1(s.d30),u)}</b></span>`:""}${s.dFirst!=null?`<span>od začiatku: <b>${pctLess(r1(s.dFirst),u)}</b> (${pctTxt(s.dFirst/s.first.v*100)})</span>`:""}`:"<span>Zatiaľ bez záznamu</span>"}</div></div>`; }).join("")}</div>
  <section class="panel"><div class="panel-h"><h2>História meraní</h2><span class="count">${rows.length}</span></div><div class="tscroll"><table class="htable"><thead><tr><th>Dátum</th>${MEAS.map(([,l,u])=>`<th>${l} (${u})</th>`).join("")}</tr></thead><tbody>
    ${rows.map(m=>`<tr data-meas="${esc(m.id)}" tabindex="0"><td>${fmtDate(mDate(m))}</td>${MEAS.map(([k])=>`<td class="mono">${num(m[k])!=null?fmtN(num(m[k])):""}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${MEAS.length+1}" class="empty">Zatiaľ žiadne merania. Odporúčanie: merať ráno nalačno, raz týždenne v rovnaký deň.</td></tr>`}
  </tbody></table></div></section>`; }
function measForm(m){ const d=m?{...m,date:mDate(m)}:{date:today()}; openForm({title:m?"Upraviť merania":"Zapísať miery",data:d,fields:[{k:"date",l:"Dátum",t:"date"},...MEAS.map(([k,l,u])=>({k,l:`${l} (${u})`,t:"number"})),{k:"note",l:"Poznámka",wide:true}],
  onSave:async x=>{ if(!ISO_RE.test(x.date||"")){ toast("Zadaj dátum."); return false; } const o={date:x.date,note:String(x.note||"").slice(0,300),created:m?.created||nowIso(),updated:nowIso()}; let any=false; for(const [k] of MEAS){ o[k]=num(x[k]); if(o[k]!=null) any=true; } if(!any){ toast("Zadaj aspoň jednu hodnotu."); return false; }
    if(m&&m.id!==x.date) await delDoc("measures",m.id); const old=C.measures.find(q=>q.id===x.date&&q.id!==m?.id); const ok=await put("measures",x.date,{...(old?noId(old):{}),...o}); if(ok) toast("Miery uložené"); return ok; },
  onDelete:m?()=>delDoc("measures",m.id):null}); }
function hFitko(){ const ex=allExercises(), W=[...C.workouts].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created||"").localeCompare(a.created||"")), mw=moveWeek();

      <button class="btn primary" type="button" data-wkplan="${esc(p.id)}">Začať tréning</button></div>`).join("")||`<div class="empty">Vytvor si plán, napr. „Tréning A – hrudník, triceps“. Pri tréningu sa ti predvyplnia série a váhy z minula.</div>`}</div></div></section>
  <div class="kpis"><div class="kpi"><span class="k">Tréningy tento týždeň</span><span class="v">${mw.trainings}</span><span class="s">${fmtN(mw.workout,0)} min</span></div>
    <div class="kpi"><span class="k">Tréningy za 30 dní</span><span class="v">${C.workouts.filter(w=>(w.date||"")>=addDays(today(),-29)).length}</span><span class="s">spolu ${C.workouts.length}</span></div>
    <div class="kpi"><span class="k">Index sily</span><span class="v">${fitIndex()?pctTxt(fitIndex().avg):"–"}</span><span class="s">priemerné zlepšenie cvikov</span></div></div>
  <section class="panel"><div class="panel-h"><h2>Progres po cvikoch</h2><span class="count">odhad 1RM (Epley) alebo opakovania</span></div><div class="tscroll"><table class="htable"><thead><tr><th>Cvik</th><th>Tréningov</th><th>Prvý</th><th>Posledný</th><th>Od minula</th><th>Od začiatku</th><th></th></tr></thead><tbody>
    ${ex.map(n=>{ const p=exProgress(exHistory(n)); if(!p) return ""; const f=v=>p.withKg?fmtKg(v)+" kg":fmtN(v,0)+" opak.";
      return `<tr data-exsel="${esc(n)}" tabindex="0" ${exKey(n)===exKey(sel)?'class="sel"':""}><td>${esc(n)}</td><td class="mono">${p.n}</td><td class="mono">${f(p.m0)}</td><td class="mono">${f(p.m1)}</td><td class="mono ${p.pctPrev>0?"up":p.pctPrev<0?"down":""}">${pctTxt(p.pctPrev)}</td><td class="mono ${p.pct>0?"up":p.pct<0?"down":""}">${pctTxt(p.pct)}</td><td class="sp-c">${spark(p.series.slice(-20),90,24)}</td></tr>`; }).join("")||`<tr><td colspan="7" class="empty">Po prvom tréningu tu uvidíš progres každého cviku.</td></tr>`}
  </tbody></table></div>${sel?exDetail(sel):""}</section>
  <section class="panel"><div class="panel-h"><h2>Odcvičené tréningy</h2><span class="count">${W.length}</span></div><ul class="list">${W.slice(0,30).map(w=>`<li class="li" data-wk="${esc(w.id)}"><span class="dot" style="background:var(--wh-1)"></span><div class="li-main"><div class="li-title">${esc(w.name||"Tréning")}</div><div class="li-meta"><span>${fmtDate(w.date)}</span>${num(w.minutes)?`<span>${fmtN(num(w.minutes),0)} min</span>`:""}<span>${(w.exercises||[]).map(e=>esc(e.name)).join(", ")}</span></div></div></li>`).join("")||`<li class="empty">Zatiaľ žiadny tréning.</li>`}</ul></section>`; }
function exDetail(n){ const h=exHistory(n).slice().reverse().slice(0,12);

function planForm(p){ openForm({title:p?"Upraviť plán":"Nový tréningový plán",data:p?{name:p.name,note:p.note||"",txt:planText(p)}:{name:"",note:"",txt:""},fields:[{k:"name",l:"Názov",ph:"napr. Tréning A – hrudník, triceps"},{k:"note",l:"Poznámka",ph:"napr. pondelok a štvrtok"},{k:"txt",l:"Cviky – každý na nový riadok: názov; série x opakovania; kg",t:"textarea",rows:8,wide:true,ph:"Bench press; 4x8; 80\nTlaky s jednoručkami na šikmej; 3x10; 26\nKliky na bradlách; 3x10\nFrancúzsky tlak; 3x12; 30"}],
  onSave:async d=>{ const ex=parsePlanText(d.txt); if(!String(d.name||"").trim()||!ex.length){ toast("Zadaj názov a aspoň jeden cvik."); return false; } const ok=await put("wplans",p?.id||rid(),{name:String(d.name).trim().slice(0,80),note:String(d.note||"").slice(0,200),exercises:ex,created:p?.created||nowIso(),updated:nowIso()}); if(ok) toast("Plán uložený"); return ok; },
  onDelete:p?()=>delDoc("wplans",p.id):null}); }
function wkPanel(){ const W=S.hl.wk; if(!W) return "";

function hStrava(){ const d=S.hl.day||today(), H=hset(), t=dayTot(d), M=dayMeals(d), fr=frequentMeals();

    ||`<section class="panel"><div class="empty">Žiadne jedlo. Odfoť tanier alebo štítok, alebo napíš do Rýchleho zápisu napr. „obed: segedín s knedľou“.</div></section>`}

function hPohoda(){ const H=hset(), mw=moveWeek(), mc=monthCounts(), [a,b]=weekRange(); const L=[...C.selfcare].sort((x,y)=>(y.date||"").localeCompare(x.date||"")).slice(0,40);

const WHEEL=[["rodina","Rodina a manželstvo"],["zdravie","Zdravie a kondícia"],["viera","Viera"],["firma","Firma a práca"],["financie","Financie"],["vztahy","Vzťahy a priatelia"],["rast","Rast a vzdelávanie"],["oddych","Oddych a radosť"]];

function moveRange(a,b){ let m=0; for(const s of C.selfcare) if(s.date>=a&&s.date<=b&&SELF_MOVE.has(s.kind)) m+=num(s.minutes)||0; for(const w of C.workouts) if(w.date>=a&&w.date<=b) m+=num(w.minutes)||0; return m; }
/* Skóre týždňa: priemer dostupných zložiek – priority dňa (splnené/nastavené), návyky (odškrtnuté/možné), pohyb (min/cieľ, max 100 %) */
function weekScore(ws){ const we=addDays(ws,6), td=today(), last=we<td?we:td; const days=[]; for(let d=ws; d<=last&&days.length<7; d=addDays(d,1)) days.push(d);
  let tSet=0,tDone=0,pDays=0; for(const d of days){ const j=jDoc(d); const T=(j?.targets||[]).filter(x=>x&&x.t); if(T.length) pDays++; tSet+=T.length; tDone+=T.filter(x=>x.done).length; }
  const H=activeHabits(); let hPos=0,hDone=0; for(const d of days) for(const h of H){ if(String(h.created||"").slice(0,10)>d) continue; hPos++; if(habitDone(h.id,d)) hDone++; }
  const tgt=hset().moveWeek||150, mv=moveRange(ws,we);
  const pri=tSet?tDone/tSet*100:null, hab=hPos?hDone/hPos*100:null, mov=days.length?Math.min(100,mv/tgt*100):null;
  const parts=[pri,hab,mov].filter(v=>v!=null); const score=parts.length?parts.reduce((a,b)=>a+b,0)/parts.length:null;
  const tasksDone=items().filter(i=>i.type==="uloha"&&i.status==="hotova"&&String(i.updated||"").slice(0,10)>=ws&&String(i.updated||"").slice(0,10)<=we).length;
  const tasksNew=items().filter(i=>i.type==="uloha"&&String(i.created||"").slice(0,10)>=ws&&String(i.created||"").slice(0,10)<=we).length;
  const inc=sumAmt(C.income.filter(i=>i.date>=ws&&i.date<=we)), exp=sumAmt(expenses().filter(i=>i.date>=ws&&i.date<=we));
  return {ws,we,days:days.length,pDays,tSet,tDone,hPos,hDone,mv,tgt,pri,hab,mov,score,tasksDone,tasksNew,inc,exp,bal:Math.round((inc-exp)*100)/100}; }

  catch(e){ toast(sErr(e)); if(aiOff.includes(e?.code)) S.sample=null; return; }

    <div class="kfilt">${fl.map(([k,l])=>`<button type="button" data-krel="${k}" aria-pressed="${rel===k}">${l}</button>`).join("")}<span class="count" style="margin-left:auto">${L.length} / ${C.people.length}</span></div>
    <div class="cards">${L.map(contactCard).join("")||`<div class="card" style="color:var(--muted)">${C.people.length?"Nič sa nenašlo.":"Zatiaľ žiadne kontakty. Odfoť prvú vizitku – Claude prečíta údaje a ty nadiktuješ, čo s ňou."}</div>`}</div>
    <div class="dash"><section class="panel"><div class="panel-h"><h2>Narodeniny a meniny · 30 dní</h2><span class="count">${up.length}</span></div><ul class="list">${up.slice(0,10).map(e=>`<li class="li"><span class="dot" style="background:var(--c-${e.it.cal})"></span><div class="li-main"><div class="li-title">${esc(e.it.title)}</div><div class="li-meta"><span class="due ${dayDiff(e.d)<=1?"soon":""}">${esc(shortWhen(e))}</span></div></div></li>`).join("")||`<li class="empty">Doplň narodeniny pri kontaktoch. Meniny dopĺňam podľa krstného mena.</li>`}</ul></section>
    <section class="panel"><div class="panel-h"><h2>Ozvať sa</h2><span class="count">${due.length}</span></div><ul class="list">${due.map(({p,c})=>`<li class="li"><span class="dot" style="background:${c.days<0?"var(--crit)":"var(--warn)"}"></span><div class="li-main"><div class="li-title">${esc(personLabel(p))}</div><div class="li-meta"><span>${esc(REL[p.relation]||"")}</span><span>${c.days<0?(-c.days)+" d po intervale":c.days===0?"dnes":"o "+c.days+" d"}</span><button class="btn sm ghost" type="button" data-ptouch="${esc(p.id)}">Hovoril som dnes</button></div></div></li>`).join("")||`<li class="empty">Pri dôležitých ľuďoch nadiktuj „ozvať sa raz za mesiac“.</li>`}</ul></section></div></div>`; }
function bindKontakty(){
  bindCd();
  const pick=e=>{ const f=e.target.files[0]; e.target.value=""; if(f) startCard(f); };
  $("#kCam").onchange=pick; $("#kGal").onchange=pick;
  $("#kAdd").onclick=()=>{ S.cd=null; personForm(null); };
  const q=$("#kQ"); if(q){ let t; q.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{ S.kq=q.value; renderView(); },200); }; }
  document.querySelectorAll("[data-krel]").forEach(b=>b.onclick=()=>{ S.kRel=b.dataset.krel; renderView(); });
  document.querySelectorAll("[data-kdo]").forEach(b=>b.onclick=()=>cardForPerson(byId("people",b.dataset.kdo)));
  document.querySelectorAll("[data-kmore]").forEach(b=>b.onclick=()=>{ S.kOpen=b.dataset.kmore; renderView(); });
  document.querySelectorAll("[data-pedit]").forEach(b=>b.onclick=()=>{ S.cd=null; personForm(byId("people",b.dataset.pedit)); });
  document.querySelectorAll("[data-ptouch]").forEach(b=>b.onclick=async()=>{ const p=byId("people",b.dataset.ptouch); if(p&&await put("people",p.id,{...noId(p),lastContact:today(),updated:nowIso()})) toast("Zapísané: "+personLabel(p)); });
  if(S.kOpen&&!S.cd){ const el=document.getElementById("pc_"+S.kOpen); if(el&&!S.kScrolled){ S.kScrolled=true; setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),60); } }
}
function kontaktyTile(){ const n=C.people.length, ev=peopleEvents(today(),addDays(today(),14)).sort((a,b)=>a.d.localeCompare(b.d))[0], due=C.people.filter(p=>{ const c=contactDue(p); return c&&c.days<=0; }).length;
  return {big:String(n),sub:plural(n,"kontakt","kontakty","kontaktov"),line:due?`Ozvať sa: ${due}`:ev?`${shortWhen(ev)}: ${ev.it.title}`:"Odfoť vizitku a nadiktuj, čo s ňou"}; }

/* ----- Nástenka a kontext ----- */
function ludiaTile(){ const n=inboxNew().length, w=waitLate().length, o=waitOpen().length; const ev=peopleEvents(today(),addDays(today(),7)).sort((a,b)=>a.d.localeCompare(b.d))[0];
  return {big:String(n||w||o),sub:n?plural(n,"nový odkaz","nové odkazy","nových odkazov"):w?"urgovať":"čakám na",line:ev?`${shortWhen(ev)}: ${ev.it.title}`:o?`Čakám na: ${o}`:"Odkazy, čakám na, kontakty"}; }
function peopleContext(){ const L=[];
  for(const x of inboxNew().slice(0,10)) L.push(`- Nepotvrdený odkaz od ${x.from}: ${String(x.text||"").slice(0,200)}${x.due?" (termín "+x.due+")":""}`);
  for(const w of waitOpen().slice(0,20)) L.push(`- Čakám na: ${w.what} od ${w.who||"?"} (od ${w.since}${w.follow?", urgovať "+w.follow:""})`);
  for(const p of C.people.slice(0,80)) L.push(`- Kontakt ${p.name} (${REL[p.relation]||""}${p.company?", "+p.company:""})${pBirth(p)?", narodeniny "+pBirth(p).slice(5):""}${p.lastContact?", naposledy "+p.lastContact:""}${p.notes?": "+String(p.notes).slice(0,160):""}`);
  const sc=weekScore(weekStart(today())); L.push(`- Skóre tohto týždňa ${pctR(sc.score)} (priority ${pctR(sc.pri)}, návyky ${pctR(sc.hab)}, pohyb ${fmtN(sc.mv,0)} min)`);
  const wp=weekPriorities(); if(wp.length) L.push(`- Priority týždňa: ${wp.join("; ")}`);
  return L.join("\n"); }

document.addEventListener("change",e=>{ const t=e.target; if(t&&(t.id==="photoAny"||t.id==="photoAnyH")){ const f=t.files&&t.files[0]; t.value=""; if(f) photoAny(f); } });
/* ---------- Záloha / import ---------- */
$("#btnExport").addEventListener("click",async()=>{
  const data=JSON.stringify({app:"brain",exported:new Date().toISOString(),count:S.items.size,items:items()},null,2);
  if(!S.downloads){ toast("Sťahovanie nie je v tomto zobrazení dostupné."); return; }
  try{ await S.downloads.save({filename:`brain-zaznamy-${today()}.json`,data}); toast("Záloha uložená"); }
  catch(e){ if(e?.code!=="declined") toast("Zálohu sa nepodarilo uložiť."); }
});
$("#importFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const arr=Array.isArray(j)?j:j.items; if(!Array.isArray(arr)) throw 0;
    let n=0; toast(`Importujem ${arr.length} záznamov…`);
    for(const x of arr){ if(!x||typeof x!=="object") continue; const id=/^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(String(x.id||""))?String(x.id):newId(); const ok=await saveItem(id,{...x,type:TYPES[x.type]?x.type:"poznamka"}); if(ok) n++; }
    toast(`Importované: ${n} záznamov`);
  }catch(err){ toast("Súbor nie je platná záloha Brain (JSON)."); }
});

/* ---------- Štart ---------- */
async function init(){
  const h=(location.hash||"").slice(1); if(VIEWS.some(v=>v[0]===h)) S.view=h;
  S.capture.text=lsGet("draft","")||"";
  renderNav(); renderView();
  if(!window.claude||typeof claude.use!=="function"){ S.dbState="none"; renderNav(); renderView(); return; }
  const use=n=>claude.use(n).catch(()=>null);
  const [db,assets,sample,downloads]=await Promise.all([use("db"),use("assets"),use("sample"),use("downloads")]);
  S.assets=assets; S.sample=sample; S.downloads=downloads;
  if(!db){ S.dbState="none"; renderNav(); renderView(); return; }
  try{ S.col=db.collection("items"); }catch(e){ S.dbState="error"; S.dbErr="cesta"; renderView(); return; }
  S.col.orderBy("updated","desc").limit(1000).onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs){ const x=d.data(); if(x) m.set(d.id,{id:d.id,type:"poznamka",title:"",body:"",tags:[],links:[],...x}); }
    const first=S.dbState!=="ready"; S.items=m; S.dbState="ready";
    if(first){ buildEdges(); renderNav(); renderView(); refreshDrawerSide(); } else refreshData();
  },err=>{ S.dbState="error"; S.dbErr=err?.code||"chyba"; renderNav(); if(S.view!=="otazka") renderView(); });
  S.db=db;
  try{ db.collection("mail").orderBy("received","desc").limit(300).onSnapshot(s=>{ S.mail=s.docs.map(d=>({...d.data(),id:d.id})); onData(); },()=>{}); }catch(e){}
  try{ db.doc("meta/mail").onSnapshot(s=>{ S.mailMeta=s.exists?s.data():null; onData(); },()=>{}); }catch(e){}
  watch("reminders",c=>c.limit(500));
  watch("assets",c=>c.limit(200));
  watch("income",c=>c.orderBy("date","desc").limit(1000));
  watch("bizcf",c=>c.limit(3000));
  watch("budget",c=>c.limit(240));
  watch("subs",c=>c.limit(300));
  watch("recur",c=>c.limit(500));
  watch("advice",c=>c.orderBy("date","desc").limit(40));
  watch("bank",c=>c.orderBy("date","desc").limit(1500));
  watch("gcal",c=>c.limit(1500));
  watch("loans",c=>c.limit(100));
  watch("cars",c=>c.limit(20));
  watch("trips",c=>c.limit(100));
  watch("shop",c=>c.limit(50));
  watch("goals",c=>c.limit(200));
  watch("journal",c=>c.orderBy("date","desc").limit(120));
  watch("habits",c=>c.limit(50));
  watch("settings",c=>c.limit(50));
  watch("verse",c=>c.orderBy("date","desc").limit(3));
  watch("measures",c=>c.limit(500));
  watch("workouts",c=>c.orderBy("date","desc").limit(400));
  watch("wplans",c=>c.limit(50));
  watch("meals",c=>c.orderBy("date","desc").limit(800));
  watch("selfcare",c=>c.orderBy("date","desc").limit(400));
  watch("care",c=>c.limit(30));
  watch("hday",c=>c.limit(120));
  watch("people",c=>c.limit(500));
  watch("waiting",c=>c.limit(300));
  watch("inbox",c=>c.orderBy("received","desc").limit(200));
  watch("reviews",c=>c.limit(120));
  watch("wheel",c=>c.limit(60));
  if(S.view==="zapis"||S.view==="otazka"||S.view==="prehlad") renderView();
}
init();
</script>
