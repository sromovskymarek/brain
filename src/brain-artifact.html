  const kmLeft=kmNext!=null&&num(c.km)!=null?kmNext-num(c.km):null, days=dNext?dayDiff(dNext):null;
  let pct=null; if(kmLeft!=null&&ivKm) pct=1-kmLeft/ivKm; if(days!=null&&ivM&&lastD){ const tot=dayDiff(dNext)-dayDiff(lastD); const p2=tot>0?1-days/tot:null; if(p2!=null) pct=pct==null?p2:Math.max(pct,p2); }
  return {k:r.k,l:r.l,date:dNext,km:kmNext,kmLeft,days,state:dueState(days,kmLeft),pct:pct==null?null:Math.max(0,Math.min(1,pct)),lastKm,lastD};
}

function carStatus(c){ const w=carWorst(c);

  const r=[w.kmLeft!=null?(w.kmLeft<0?fmtKm(-w.kmLeft)+" prekročené":"o "+fmtKm(w.kmLeft)):"",w.days!=null?daysTxt(w.days):""].filter(Boolean)[0]||"";
  return {cls:w.state,t:w.l+" · "+r}; }
const leftTxt=d=>[d.kmLeft!=null?(d.kmLeft<0?fmtKm(-d.kmLeft)+" po":"o "+fmtKm(d.kmLeft)):"",d.days!=null?daysTxt(d.days):""].filter(Boolean)[0]||"";
const carSub=c=>[c.year,CAR_COLOR[c.color]?.[0]?.toLowerCase(),c.plate].filter(Boolean).map(x=>esc(String(x))).join(" · ");

  :`<section class="panel panel-b" style="color:var(--muted)">Zatiaľ žiadne auto. Pridaj ho tlačidlom + Auto.</section>`}</div>`; }

function viewCar(c){

  const row=r=>{ const d=carRowCalc(c,r);
    if(!d) return `<div class="crow none" data-crow="${r.k}" role="button" tabindex="0"><span class="cic">${ci(r.ic)}</span><div class="cmain"><b>${esc(r.l)}</b><span>Nezadané – ťukni a doplň${r.hint?` · ${esc(r.hint)}`:""}</span></div><span class="cchev">${ci("chev")}</span></div>`;

  const tires=`<div class="crow ${c.tireSeason?"ok":"none"} info" data-crow="tires" role="button" tabindex="0"><span class="cic">${ci("pneu")}</span><div class="cmain"><b>Pneumatiky</b><span>${c.tireSeason?esc(TIRE[c.tireSeason]||"")+(num(c.tireMm)!=null?` · dezén ${String(c.tireMm).replace(".",",")} mm`:""):"Nezadané – ťukni a doplň"}</span>${c.tireDate?`<span class="clast">prezuté ${fmtDate(c.tireDate)}</span>`:""}</div>${num(c.tireMm)!=null&&num(c.tireMm)<4?`<div class="cside"><span class="cpill" style="color:var(--warn)">${num(c.tireMm)<1.6?"pod zákonným minimom":"zváž výmenu"}</span></div>`:`<span class="cchev">${ci("chev")}</span>`}</div>`;
  return `<div class="view car-view">
  <div class="cstage">
    <div class="ctop"><button class="cback" type="button" id="carBack" aria-label="Späť na autá">‹ Autá</button><span class="cst ${st.cls}"><i></i>${esc(st.t)}</span></div>
    <div class="chead"><h1>${esc(c.name||"Auto")}</h1><div class="csub">${carSub(c)}</div></div>
    <div class="cpic">${carPic(c,"d"+c.id)}</div>
    <div class="cstats">${km!=null?`<div><b>${fmtKm(km)}</b><span>${c.kmDate?"k "+fmtDate(c.kmDate):"stav"}</span></div>`:""}${c.fuel?`<div><b>${esc(FUEL[c.fuel]||"")}</b><span>pohon</span></div>`:""}${(()=>{ const w=carWorst(c); return w?`<div><b>${esc(leftTxt(w))}</b><span>${esc(w.l)}</span></div>`:""; })()}</div>
    <div class="cacts"><button type="button" data-carlog="${esc(c.id)}"><span>${ci("plus")}</span>Záznam</button><button type="button" data-carkm="${esc(c.id)}"><span>${ci("km")}</span>Stav km</button><label><span>${ci("foto")}</span>Fotka<input type="file" accept="image/*" id="carPhoto" hidden></label><button type="button" data-caredit="${esc(c.id)}"><span>${ci("edit")}</span>Upraviť</button></div>
  </div>
  ${stateBanner()}${formPanel()}
  <section class="clist"><div class="clh">Termíny a údržba</div>${rows.map(row).join("")}${tires}</section>
  <section class="clist"><div class="clh">Servisná knižka <span>${log.length}</span></div>
  ${log.length?log.slice(0,30).map(x=>`<div class="crow ok info logrow"><span class="cic">${ci(LOG_IC[x.kind]||"ine")}</span><div class="cmain"><b>${esc(LOG_KIND[x.kind]||x.kind)}</b><span>${fmtDate(x.date)}${num(x.km)!=null?" · "+fmtKm(x.km):""}${num(x.cost)?" · "+eur(x.cost):""}</span>${x.note?`<span class="clast">${esc(x.note)}</span>`:""}</div><button class="btn sm ghost" type="button" data-logdel="${esc(c.id)}|${esc(x.id)}" aria-label="Zmazať záznam">×</button></div>`).join(""):`<div class="crow none info"><span class="cic">${ci("servis")}</span><div class="cmain"><b>Zatiaľ bez záznamov</b><span>Každú STK, servis či prezutie zapíš cez „Záznam“ – termíny sa prepočítajú samy.</span></div></div>`}</section>
  ${c.note?`<section class="clist"><div class="clh">Poznámka</div><div class="cnote">${esc(c.note)}</div></section>`:""}
  </div>`; }

function carClean(d,c){ const rec={log:Array.isArray(c?.log)?c.log:[],created:c?.created||new Date().toISOString(),updated:new Date().toISOString()};
  for(const k of ["name","plate","note"]) rec[k]=String(d[k]||"").slice(0,300);
  rec.year=num(d.year); rec.color=CAR_COLOR[d.color]?d.color:""; rec.body=BODY[d.body]?d.body:"sedan"; rec.fuel=FUEL[d.fuel]!==undefined?(d.fuel||""):""; rec.photo=/^[0-9a-f]{32}$/.test(d.photo||"")?d.photo:""; rec.order=num(d.order);
  for(const k of ["kmDate","stk","ek","pzp","hav","vignette","lastOilDate","lastSvcDate","tireDate","lastBrakeDate","lastCabinDate","lastCalDate"]) rec[k]=ISO_RE.test(d[k]||"")?d[k]:"";
  for(const k of ["km","oilKm","oilMonths","lastOilKm","svcKm","svcMonths","lastSvcKm","tireMm","lastRotKm","lastCalKm"]) rec[k]=num(d[k]);
  rec.tireSeason=TIRE[d.tireSeason]!==undefined?(d.tireSeason||""):""; return rec; }

  {k:"name",l:"Názov",ph:"napr. Škoda Octavia"},{k:"year",l:"Rok výroby",t:"number"},{k:"plate",l:"EČV"},{k:"color",l:"Farba",t:"select",o:colors},{k:"body",l:"Karoséria (obrázok)",t:"select",o:BODY},{k:"fuel",l:"Pohon",t:"select",o:FUEL},
  {k:"photo",l:"Vlastná fotka auta (inak ilustrácia)",t:"image"},

  {k:"lastBrakeDate",l:"EV: kontrola brzdovej kvapaliny (dátum)",t:"date"},{k:"lastCabinDate",l:"EV: výmena kabínového filtra (dátum)",t:"date"},{k:"lastRotKm",l:"EV: rotácia pneumatík (km)",t:"number"},{k:"lastCalDate",l:"EV: čistenie strmeňov (dátum)",t:"date"},{k:"lastCalKm",l:"EV: čistenie strmeňov (km)",t:"number"},
  {k:"tireSeason",l:"Pneumatiky na aute",t:"select",o:TIRE},{k:"tireMm",l:"Hĺbka dezénu (mm)",t:"number"},{k:"tireDate",l:"Posledné prezutie",t:"date"},{k:"note",l:"Poznámka",t:"textarea",wide:true}],
  onSave:async d=>{ if(!String(d.name||"").trim()){ toast("Zadaj názov auta."); return false; } const id=c?.id||rid(); const ok=await put("cars",id,carClean(d,c)); if(ok){ toast("Auto uložené"); S.carId=id; } return ok; },

const LOG_MAP={stk:"stk",ek:"ek",pzp:"pzp",hav:"hav",vignette:"vignette",lastOilKm:"olej",lastSvcKm:"servis",brake:"brzdy",cabin:"filter",rot:"rotacia",cal:"strmene",tires:"pneu"};
const RENEW_M={stk:24,ek:24,pzp:12,hav:12};
function carLogForm(c,kind){ kind=LOG_MAP[kind]||kind; const k0=LOG_KIND[kind]?kind:(isEV(c)?"servis":"olej");
  openForm({title:"Záznam – "+(c.name||"auto"),saveLabel:"Uložiť záznam",data:{date:today(),km:c.km??"",kind:k0,withOil:"nie",asExpense:"nie"},fields:[
  {k:"kind",l:"Čo sa robilo",t:"select",o:LOG_KIND},{k:"date",l:"Dátum",t:"date"},{k:"km",l:"Stav km",t:"number"},{k:"cost",l:"Cena (€)",t:"number"},
  {k:"newDate",l:"Nová platnosť do (prázdne = STK/EK +2 roky, poistka +1 rok)",t:"date"},{k:"withOil",l:"Servis vrátane výmeny oleja",t:"select",o:ANO},
  {k:"asExpense",l:"Zapísať aj medzi výdavky",t:"select",o:ANO},{k:"note",l:"Poznámka",t:"textarea",wide:true,ph:"napr. olej 5W-30, filtre, zimné pneu"}],
  onSave:async d=>{ if(!ISO_RE.test(d.date||"")){ toast("Zadaj dátum."); return false; }
    const km=num(d.km), cost=num(d.cost), kind=LOG_KIND[d.kind]?d.kind:"ine";
    const entry={id:rid(),date:d.date,kind,km,cost,note:String(d.note||"").slice(0,300)};
    const rec=carClean(c,c); rec.log=[...(c.log||[]),entry].slice(-200);
    if(km!=null&&(rec.km==null||km>=rec.km)){ rec.km=km; rec.kmDate=d.date; }
    if(kind==="olej"||(kind==="servis"&&d.withOil==="ano")){ if(km!=null) rec.lastOilKm=km; rec.lastOilDate=d.date; }
    if(kind==="servis"){ if(km!=null) rec.lastSvcKm=km; rec.lastSvcDate=d.date; }
    if(kind==="pneu") rec.tireDate=d.date;
    if(kind==="brzdy") rec.lastBrakeDate=d.date;
    if(kind==="filter") rec.lastCabinDate=d.date;
    if(kind==="rotacia"&&km!=null) rec.lastRotKm=km;
    if(kind==="strmene"){ rec.lastCalDate=d.date; if(km!=null) rec.lastCalKm=km; }
    if(["stk","ek","pzp","hav","vignette"].includes(kind)){ if(ISO_RE.test(d.newDate||"")) rec[kind]=d.newDate; else if(RENEW_M[kind]) rec[kind]=addMonths(d.date,RENEW_M[kind]); }
    const ok=await put("cars",c.id,rec);
    if(ok&&d.asExpense==="ano"&&cost>0) await saveItem(newId(),{type:"vydavok",title:(c.name||"Auto")+" – "+LOG_KIND[kind],body:entry.note,tags:[],links:[],area:"financie",date:d.date,amount:cost,expcat:"auto",pay:"",attachments:[],source:"auto"});
    if(ok) toast("Záznam uložený"); return ok; }}); }
function carKmForm(c){ openForm({title:"Stav km – "+(c.name||"auto"),data:{km:c.km??"",kmDate:today()},fields:[{k:"km",l:"Stav tachometra (km)",t:"number"},{k:"kmDate",l:"Dátum",t:"date"}],
  onSave:async d=>{ const km=num(d.km); if(km==null){ toast("Zadaj stav km."); return false; } return put("cars",c.id,{km,kmDate:ISO_RE.test(d.kmDate||"")?d.kmDate:today(),updated:new Date().toISOString()},true); }}); }
function bindAuta(){
  const open=id=>{ S.carId=id; S.form=null; renderView(); $("#main").scrollTop=0; };
  $("#carAdd")&&($("#carAdd").onclick=()=>carForm(null));
  document.querySelectorAll("[data-car]").forEach(el=>{ el.onclick=()=>open(el.dataset.car); el.onkeydown=e=>{ if(e.key==="Enter") open(el.dataset.car); }; });
  $("#carBack")&&($("#carBack").onclick=()=>{ S.carId=""; S.form=null; renderView(); $("#main").scrollTop=0; });
  document.querySelectorAll("[data-caredit]").forEach(b=>b.onclick=()=>carForm(byId("cars",b.dataset.caredit)));
  document.querySelectorAll("[data-carlog]").forEach(b=>b.onclick=()=>carLogForm(byId("cars",b.dataset.carlog)));
  document.querySelectorAll("[data-carkm]").forEach(b=>b.onclick=()=>carKmForm(byId("cars",b.dataset.carkm)));
  const c=S.carId&&byId("cars",S.carId);
  if(c){
    document.querySelectorAll("[data-crow]").forEach(el=>{ const k=el.dataset.crow; const fn=()=>{ const has=k==="tires"?!!c.tireSeason:!!carRowCalc(c,CAR_ROWS.find(r=>r.k===k)||{}); if(has) carLogForm(c,k); else carForm(c); $("#main").scrollTo({top:0,behavior:"smooth"}); }; el.onclick=e=>{ if(e.target.closest("button,a,label,input")) return; fn(); }; el.onkeydown=e=>{ if(e.key==="Enter") fn(); }; });

const tripSort=(a,b)=>(a.start||"9999").localeCompare(b.start||"9999");
function tripProg(arr){ const a=arr||[]; const d=a.filter(x=>x.done).length; return {d,n:a.length,p:a.length?Math.round(d/a.length*100):0}; }
const tripNights=t=>ISO_RE.test(t.start||"")&&ISO_RE.test(t.end||"")?Math.round((pd(t.end)-pd(t.start))/864e5):null;

const TRIP_TXT=[["weather","Počasie a podmienky"],["tips","Dôležité informácie a tipy"],["accom","Ubytovanie – moje kritériá"],["notes","Poznámky"]];
function viewTrip(t){

function tripOverview(t){ return TRIP_TXT.map(([k,l])=>`<section class="panel"><div class="panel-h"><h2>${l}</h2>${S.tripEdit===k?"":`<button class="btn sm ghost" type="button" data-tedit="${k}">Upraviť</button>`}</div><div class="panel-b">${S.tripEdit===k

function tripItin(t){ const days=(t.itinerary||[]).slice().sort((a,b)=>(a.date||"9").localeCompare(b.date||"9"));

  <section class="panel"><div class="panel-b addrow" style="margin:0;flex-wrap:wrap"><input type="date" id="dayDate" data-keep style="flex:0 0 170px" aria-label="Dátum dňa"><input type="text" id="dayTitle" data-keep placeholder="Názov dňa, napr. Cusco – aklimatizácia" aria-label="Názov dňa"><button class="btn" type="button" id="dayAdd">+ Pridať deň</button></div></section>`; }
function tripPacking(t){ const L=t.packing||[], cats=[...new Set(L.map(x=>x.cat||"Ostatné"))], p=tripProg(L);
  return `<section class="panel"><div class="panel-h"><h2>Čo si zbaliť</h2><span class="count">${p.d}/${p.n} zbalené</span></div><div class="panel-b">
  ${cats.map(c=>{ const it=L.filter(x=>(x.cat||"Ostatné")===c), q=tripProg(it); return `<div class="cat-h"><span>${esc(c)}</span><span>${q.d}/${q.n}</span></div>${checkList(it,"packing")}`; }).join("")||'<span style="color:var(--muted)">Zoznam je prázdny.</span>'}

function bookingForm(t){ openForm({title:"Nový bod programu alebo rezervácia",data:{kind:"vstupenka",date:t.start||""},fields:[{k:"kind",l:"Typ",t:"select",o:BOOK_KIND},{k:"title",l:"Názov",ph:"napr. Machu Picchu – okruh 2"},{k:"date",l:"Dátum",t:"date"},{k:"time",l:"Čas",t:"time"},{k:"place",l:"Miesto"},{k:"note",l:"Poznámka",ph:"napr. číslo rezervácie, čo so sebou",wide:true}],

function tripForm(t){ openForm({title:t?"Upraviť výlet":"Nový výlet",data:t?{...t}:{kind:"rodinny"},fields:[{k:"name",l:"Názov",ph:"napr. Budapešť – veľtrh"},{k:"dest",l:"Cieľ / trasa"},{k:"start",l:"Odchod",t:"date"},{k:"end",l:"Návrat",t:"date"},{k:"kind",l:"Typ",t:"select",o:TRIP_KIND},{k:"people",l:"Kto ide"}],

function tripArr(t,path){ if(path.startsWith("it:")){ const d=(t.itinerary||[]).find(x=>x.id===path.slice(3)); return d?(d.items||[]):[]; } return t[path]||[]; }

function viewCiele(){
  const active=C.goals.filter(g=>g.status!=="splneny"), done=C.goals.filter(g=>g.status==="splneny");
  const vis=active.filter(g=>g.image||g.horizon==="sen").sort((a,b)=>(a.horizon==="sen"?0:1)-(b.horizon==="sen"?0:1));
  return `<div class="view"><div class="band" style="--b1:var(--wm-1);--b2:var(--wm-2)"><div><div class="eyebrow">Nástenka cieľov</div><h1>Ciele a sny</h1></div><div class="actions"><button class="btn primary" type="button" id="goalAdd">+ Sen alebo cieľ</button></div></div>${stateBanner()}${formPanel()}
  ${(()=>{ const F=C.goals.filter(g=>g.status!=="splneny"&&goalFin(g)); if(!C.goals.some(g=>g.status!=="splneny")) return ""; const need=r2(F.reduce((s,g)=>s+(goalFin(g).need||0),0)); return `<section class="panel"><div class="panel-b" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div style="min-width:0"><b>Financovanie cieľov</b><div style="font-size:13px;color:var(--muted)">${F.length?`${F.length} ${plural(F.length,"cieľ","ciele","cieľov")} so sumou · treba ${eur(need)} mesačne`:"Doplň k cieľom cieľovú sumu – poradca k nim pripojí stratégiu."}</div></div><button class="btn sm" type="button" data-go="financie/poradca">Finančný poradca →</button></div></section>`; })()}
  <section><div class="vision">${vis.map(g=>`<div class="vtile ${g.image?"":"noimg"}" data-goal="${esc(g.id)}" role="button" tabindex="0">${g.image?`<img src="/_blob/${esc(g.image)}" alt="${esc(g.title)}" loading="lazy">`:""}<div class="cap">${esc(g.title)}<span>${esc(HORIZON[g.horizon]||"")}${g.due?" · do "+fmtDate(g.due):""}</span></div></div>`).join("")
    ||`<div class="vtile noimg" id="goalAdd2" role="button" tabindex="0"><div class="cap">+ Pridaj prvý sen s fotkou<span>Dom, cesta, rodina, auto… čokoľvek, čo chceš vidieť každý deň.</span></div></div>`}</div></section>
  ${Object.entries(HORIZON).map(([h,l])=>{ const L=active.filter(g=>(g.horizon||"rok")===h); return `<section class="panel"><div class="panel-h"><h2>${l}</h2><span class="count">${L.length}</span></div><div>${L.map(goalRow).join("")||`<div class="empty">${h==="mesiac"?"Mesačné targety, ktoré ťa posunú k ročným cieľom.":h==="rok"?"Čo chceš dosiahnuť tento rok.":"Veľké sny bez termínu."}</div>`}</div></section>`; }).join("")}
  ${done.length?`<section class="panel"><div class="panel-h"><h2>Splnené</h2><button class="btn sm ghost" type="button" id="goalDoneT">${S.goalShowDone?"Skryť":"Zobraziť"} (${done.length})</button></div>${S.goalShowDone?`<div>${done.map(goalRow).join("")}</div>`:""}</section>`:""}</div>`; }

function jNorm(j){ if(!Array.isArray(j.targets)) j.targets=[]; while(j.targets.length<3) j.targets.push({t:"",done:false,goal:""}); if(!Array.isArray(j.awards)) j.awards=[]; while(j.awards.length<3) j.awards.push(""); if(!j.habits||typeof j.habits!=="object") j.habits={}; return j; }
function jDraft(){ const d=jDate(); if(!S.jd||S.jd.date!==d||!S.jdDirty){ const src=jDoc(d); S.jd=src?JSON.parse(JSON.stringify(src)):{}; delete S.jd.id; S.jd.date=d; } return jNorm(S.jd); }
let jTimer=0;
function jSave(now){ S.jdDirty=true; clearTimeout(jTimer); const run=async()=>{ const j=S.jd; if(!j) return; const ok=await put("journal",j.date,{...j,updated:new Date().toISOString()}); if(ok&&S.jd===j) S.jdDirty=false; }; if(now) run(); else jTimer=setTimeout(run,700); }
function jPatch(date,fn){ if(S.jd&&S.jd.date===date){ fn(jNorm(S.jd)); jSave(true); return; } const src=jDoc(date); const j=jNorm(src?JSON.parse(JSON.stringify(src)):{}); delete j.id; j.date=date; fn(j); put("journal",date,{...j,updated:new Date().toISOString()}); }
function habitDone(hid,date){ const j=(S.jd&&S.jd.date===date)?S.jd:jDoc(date); return !!(j&&j.habits&&j.habits[hid]); }
function streak(hid){ let n=0, d=today(); if(!habitDone(hid,d)) d=addDays(d,-1); while(habitDone(hid,d)&&n<999){ n++; d=addDays(d,-1); } return n; }

async function readDiary(file){
  if(!S.sample){ toast("Čítanie diára cez AI funguje po otvorení stránky v Claude."); return; }
  if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){ toast("Tento formát fotky Claude nevie prečítať."); return; }
  const lim=await S.sample.limits().catch(()=>null); if(!lim?.images){ toast("Posielanie fotiek do Claude tu nie je dostupné."); return; }
  const d=jDate(); toast("Claude číta stranu diára…");
  const [up]=await uploadFiles([file]);
  try{
    const r=await S.sample.json(`Na fotke je strana osobného diára (slovenčina, rukopis). Prepíš presne, čo je napísané, nič nevymýšľaj ani nedopĺňaj. Vráť IBA JSON:
{"targets":["najviac 3 targety alebo ciele dňa"],"awards":["najviac 3 veci, za ktoré sa autor oceňuje"],"good":"čo urobil dobre alebo null","better":"čo by urobil inak alebo null","notes":"ostatný čitateľný text strany alebo null"}
Ak niektorá časť na strane nie je, daj prázdne pole alebo null.`,{images:[file],cache:false});
    jPatch(d,j=>{ (Array.isArray(r?.targets)?r.targets:[]).slice(0,3).forEach((t,i)=>{ if(t&&!j.targets[i].t) j.targets[i].t=String(t).slice(0,200); });
      (Array.isArray(r?.awards)?r.awards:[]).slice(0,3).forEach((a,i)=>{ if(a&&!j.awards[i]) j.awards[i]=String(a).slice(0,200); });
      if(r?.good&&!j.good) j.good=String(r.good).slice(0,3000); if(r?.better&&!j.better) j.better=String(r.better).slice(0,3000);
      if(r?.notes) j.notes=String(r.notes).slice(0,5000); if(up) j.photo=up.id; });
    toast("Diár prepísaný. Skontroluj a doplň.");
  }catch(e){ if(up) jPatch(d,j=>{ j.photo=up.id; }); toast(sErr(e)); if(aiOff.includes(e?.code)) S.sample=null; }
  if(S.view==="dennik") renderView();
}

function priorities(){ const td=today(), P=[];
  for(const u of units()) for(const x of bzOpen(u.id)) if(x.due&&x.due<td) P.push({sev:2,t:`${uShort(u)}: neuhradená ${x.inv?"FA "+x.inv:"platba"} – ${x.title||"klient"} · ${eur(x.amount)}`,m:daysTxt(dayDiff(x.due)),go:"financie/"+u.id});
  for(const t of items().filter(isOpenTask)) if(t.due){ const n=dayDiff(t.due); if(n<=2) P.push({sev:n<0?3:2,t:t.title||"Úloha",m:n<0?`${-n} d po termíne`:n===0?"dnes":n===1?"zajtra":"pozajtra",open:t.id}); }
  for(const x of S.mail) if(x.cat==="dolezite"&&!x.handled) P.push({sev:/phishing/i.test(x.summary||"")?3:2,t:(x.from?x.from+": ":"")+(x.subject||""),m:x.deadline?"termín "+fmtDate(x.deadline):"mail"});
  for(const c of C.cars) for(const d of carDeadlines(c)) if(d.state!=="ok") P.push({sev:d.state==="crit"?3:1,t:d.l+" – "+(c.name||"auto"),m:d.days!=null?daysTxt(d.days):d.kmLeft!=null?(d.kmLeft<0?"prekročené":"o "+fmtKm(d.kmLeft)):"",go:"auta"});
  for(const e of virtualEvents(td,addDays(td,3))) if(e.it.cal==="financie") P.push({sev:1,t:e.it.title,m:shortWhen(e),go:"financie/uvery"});
  for(const t of C.trips){ const n=t.start?dayDiff(t.start):null; if(n!=null&&n>=0&&n<=45){ const open=(t.prep||[]).filter(x=>!x.done).length; const late=(t.prep||[]).filter(x=>!x.done&&x.due&&dayDiff(x.due)<=3).length; if(open) P.push({sev:late?2:1,t:`${t.name}: ${open} ${plural(open,"vec","veci","vecí")} na vybavenie`,m:"odchod o "+n+" d",go:"vylety/"+t.id}); } }
  return P.sort((a,b)=>b.sev-a.sev).slice(0,7); }

  for(const t of C.trips.filter(t=>!t.end||t.end>=today())) L.push(`- Výlet ${t.name} (${t.dest||""}) ${tripDates(t)}; príprava ${tripProg(t.prep).d}/${tripProg(t.prep).n}, balenie ${tripProg(t.packing).d}/${tripProg(t.packing).n}; nevybavené: ${(t.prep||[]).filter(x=>!x.done).map(x=>x.t).slice(0,8).join("; ")}`);

  { const hc=healthContext(); if(hc) L.push(hc); }

  const j=jDoc(today()); if(j) L.push(`- Dnešné targety: ${(j.targets||[]).filter(x=>x.t).map(x=>x.t+(x.done?" (splnené)":"")).join("; ")||"-"}`);
  return L.join("\n").slice(0,12000)||"- zatiaľ bez údajov"; }

const NUTR=[["kcal","Energia","kcal"],["protein","Bielkoviny","g"],["carbs","Sacharidy","g"],["sugar","z toho cukry","g"],["fat","Tuky","g"],["fiber","Vláknina","g"],["salt","Soľ","g"]];

function slotByTime(t){ const m=/^(\d{2}):(\d{2})$/.exec(t||""); const h=m?+m[1]+(+m[2])/60:new Date().getHours()+new Date().getMinutes()/60; return h<10?"ranajky":h<11.5?"desiata":h<14?"obed":h<16.5?"olovrant":h<21?"vecera":"snack"; }

function spark(vals,w=120,h=32){ const v=vals.filter(x=>Number.isFinite(x)); if(v.length<2) return ""; const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const pts=v.map((x,i)=>`${(i/(v.length-1)*(w-4)+2).toFixed(1)},${(h-3-(x-mn)/r*(h-6)).toFixed(1)}`).join(" ");

/* ----- Miery ----- */
const mDate=m=>m.date||m.id||"";
const measSorted=()=>C.measures.filter(m=>ISO_RE.test(mDate(m))).sort((a,b)=>mDate(a).localeCompare(mDate(b)));
function measSeries(k){ return measSorted().filter(m=>num(m[k])!=null).map(m=>({d:mDate(m),v:num(m[k])})); }
function measStat(k){ const s=measSeries(k); if(!s.length) return null; const last=s[s.length-1], first=s[0];
  const lim=addDays(last.d,-30); const ref=[...s].reverse().find(x=>x.d<=lim)||null;
  return {last,first,n:s.length,dFirst:s.length>1?last.v-first.v:null,d30:ref?last.v-ref.v:null,series:s}; }
function bmi(){ const H=hset().height, w=measStat("weight")?.last.v; return H>0&&w>0?r1(w/((H/100)**2)):null; }
function whtr(){ const H=hset().height, p=measStat("waist")?.last.v; return H>0&&p>0?Math.round(p/H*100)/100:null; }

/* ----- Fitko ----- */
const e1rm=(kg,reps)=>{ kg=+kg; reps=+reps; if(!(kg>0)||!(reps>0)) return 0; return reps===1?kg:kg*(1+reps/30); };  /* Epleyho odhad 1RM */
const exKey=n=>norm(n).replace(/\s+/g," ").trim();
const fmtKg=v=>String(r1(+v)).replace(".",",");
const fmtSet=s=>s?`${num(s.kg)>0?fmtKg(num(s.kg))+" kg × ":""}${num(s.reps)||0}`:"";
function exHistory(name){ const k=exKey(name), out=[];
  for(const w of [...C.workouts].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.created||"").localeCompare(b.created||"")))
    for(const e of (w.exercises||[])) if(exKey(e.name)===k){ const sets=(e.sets||[]).filter(s=>num(s.reps)>0); if(!sets.length) continue;
      let best=0,top=sets[0],vol=0,reps=0; for(const s of sets){ const kg=num(s.kg)||0, r=num(s.reps)||0, x=e1rm(kg,r); vol+=kg*r; reps+=r; if(x>best){ best=x; top=s; } }
      out.push({date:w.date,wid:w.id,best,vol,reps,sets:sets.length,top}); }
  return out; }
/* Zlepšenie: s váhou = odhad 1RM (Epley), bez váhy = súčet opakovaní */
function exProgress(h){ if(!h.length) return null; const withKg=h.every(x=>x.best>0); const m=x=>withKg?x.best:x.reps;
  const f=h[0], l=h[h.length-1], p=h.length>1?h[h.length-2]:null;
  return {first:f,last:l,prev:p,n:h.length,withKg,m0:m(f),m1:m(l),pct:h.length>1&&m(f)>0?(m(l)-m(f))/m(f)*100:null,pctPrev:p&&m(p)>0?(m(l)-m(p))/m(p)*100:null,series:h.map(m)}; }
function allExercises(){ const mp=new Map();
  for(const p of C.wplans) for(const e of (p.exercises||[])) if(e.name) mp.set(exKey(e.name),e.name);
  for(const w of [...C.workouts].sort((a,b)=>(a.date||"").localeCompare(b.date||""))) for(const e of (w.exercises||[])) if(e.name) mp.set(exKey(e.name),e.name);
  return [...mp.values()].sort((a,b)=>a.localeCompare(b,"sk")); }
function fitIndex(){ const L=allExercises().map(n=>exProgress(exHistory(n))).filter(p=>p&&p.pct!=null); return L.length?{avg:L.reduce((s,p)=>s+p.pct,0)/L.length,n:L.length}:null; }
function parsePlanText(t){ return String(t||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const p=l.split(/[;|]/).map(x=>x.trim()); const name=p[0].replace(/^[-*•]\s*|^\d+[.)]\s*/,"").trim(); let sets=null,reps="",kg=null;
    for(const x of p.slice(1)){ const m=x.match(/^(\d+)\s*[x×*]\s*(\d+(?:\s*[-–]\s*\d+)?)/i); if(m){ sets=+m[1]; reps=m[2].replace(/\s/g,""); continue; } const k=x.match(/^(\d+(?:[.,]\d+)?)\s*(kg)?$/i); if(k) kg=num(k[1]); }
    return name?{name:name.slice(0,80),sets:Math.min(sets||3,12),reps:reps||"10",kg}:null; }).filter(Boolean).slice(0,30); }
const planText=p=>(p?.exercises||[]).map(e=>`${e.name}; ${e.sets}x${e.reps}${e.kg!=null&&e.kg!==""?"; "+fmtKg(e.kg)+" kg":""}`).join("\n");

const MENINY_BY_NAME=(()=>{ const m={}; for(const [k,v] of Object.entries(MENINY)) for(const n of String(v).split(/,\s*/)) if(n) m[norm(n)]=k; return m; })();

function nextAnnual(mmdd,from){ if(!/^\d{2}-\d{2}$/.test(mmdd||"")) return ""; const y=+from.slice(0,4); for(const yy of [y,y+1,y+2]){ const [m,d]=mmdd.split("-").map(Number); const dt=new Date(yy,m-1,d); if(dt.getMonth()!==m-1) continue; const iso=isoD(dt); if(iso>=from) return iso; } return ""; }
function contactDue(p){ const ev=num(p.every); if(!(ev>0)) return null; const base=ISO_RE.test(p.lastContact||"")?p.lastContact:String(p.created||today()).slice(0,10); const d=addDays(base,ev); return {d,days:dayDiff(d)}; }
/* Narodeniny a meniny ako udalosti v kalendári */
function peopleEvents(from,to){ const out=[];
  for(const p of C.people){ const cal=p.relation==="rodina"?"rodina":"osobne", nm=p.name||"Kontakt";
    const b=pBirth(p); if(b){ let d=nextAnnual(b.slice(5),from); let g=0; while(d&&d<=to&&g<3){ const age=+d.slice(0,4)-(+b.slice(0,4)); out.push({d,it:{id:"pb-"+p.id+d,type:"udalost",title:`Narodeniny: ${nm}${b.slice(0,4)>"1900"&&age>0&&age<120?` (${age})`:""}`,cal,area:p.relation==="rodina"?"rodina":"",time:"",_go:"ludia/kontakty"}}); d=nextAnnual(b.slice(5),addDays(d,1)); g++; } }
    if(p.nameday!==false){ const md=pNameday(p); let d=nextAnnual(md,from), g=0; while(d&&d<=to&&g<3){ out.push({d,it:{id:"pn-"+p.id+d,type:"udalost",title:`Meniny: ${nm}`,cal,area:p.relation==="rodina"?"rodina":"",time:"",_go:"ludia/kontakty"}}); d=nextAnnual(md,addDays(d,1)); g++; } } }
  return out; }

function weekScore(ws){ const we=addDays(ws,6), td=today(), last=we<td?we:td; const days=[]; for(let d=ws; d<=last&&days.length<7; d=addDays(d,1)) days.push(d);
  let tSet=0,tDone=0,pDays=0; for(const d of days){ const j=jDoc(d); const T=(j?.targets||[]).filter(x=>x&&x.t); if(T.length) pDays++; tSet+=T.length; tDone+=T.filter(x=>x.done).length; }
  const H=activeHabits(); let hPos=0,hDone=0; for(const d of days) for(const h of H){ if(String(h.created||"").slice(0,10)>d) continue; hPos++; if(habitDone(h.id,d)) hDone++; }
  const tgt=hset().moveWeek||150, mv=moveRange(ws,we);
  const pri=tSet?tDone/tSet*100:null, hab=hPos?hDone/hPos*100:null, mov=days.length?Math.min(100,mv/tgt*100):null;
  const parts=[pri,hab,mov].filter(v=>v!=null); const score=parts.length?parts.reduce((a,b)=>a+b,0)/parts.length:null;
  const tasksDone=items().filter(i=>i.type==="uloha"&&i.status==="hotova"&&String(i.updated||"").slice(0,10)>=ws&&String(i.updated||"").slice(0,10)<=we).length;

const INV_CO={sukromne:"Súkromné",efektra:"EFEKTRA",safety:"Safety Electric Slovakia"};
async function photoAny(file){
  if(file.size>20*1024*1024){ toast("Súbor je väčší ako 20 MB."); return; }
  if(file.type==="application/pdf"){ S.capture.files.push(file); go("zapis"); toast("PDF som pridal do Zápisu. Napíš, čo s ním."); return; }
  if(!S.sample){ toast("Rozpoznanie fotky funguje po otvorení stránky v Claude."); return; }
  if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){ toast("Tento formát Claude nevie prečítať."); return; }
  const lim=await S.sample.limits().catch(()=>null); if(!lim?.images){ toast("Posielanie fotiek do Claude tu nie je dostupné."); return; }
  toast("Claude rozpoznáva fotku…");
  let k="ine", r=null;
  try{ r=await S.sample.json(`Urč, čo je na fotke. Odpovedz IBA JSON {"kind":"..."} kde kind je jedno z:
"blocek" (pokladničný doklad, bloček z obchodu),
"faktura" (faktúra, výzva na platbu, zálohová faktúra so splatnosťou),
"vizitka" (vizitka alebo iné kontaktné údaje osoby či firmy: leták, polep auta, podpis, tabuľa s telefónom),
"jedlo" (jedlo na tanieri alebo v miske),
"stitok" (obal potraviny s tabuľkou výživových údajov),
"diar" (rukou písaná strana diára alebo denníka),
"ine" (čokoľvek iné: dokument, tabuľa, štítok zariadenia, schéma, poškodenie…).`,{images:[file],cache:false,modelTier:"quick"}); k=String(r?.kind||"ine"); }
  catch(e){ toast(sErr(e)); if(aiOff.includes(e?.code)) S.sample=null; return; }
  if(k==="blocek") startReceipt(file);
  else if(k==="faktura") readInvoice(file);
  else if(k==="vizitka") startCard(file);
  else if(k==="jedlo"||k==="stitok"){ S.hl.tab="strava"; foodNew(k==="stitok"?"label":"meal",file); go("zdravie"); foodAI(); }
  else if(k==="diar"){ S.jDate=""; go("dennik"); readDiary(file); }
  else { S.capture.files.push(file); go("zapis"); renderCapFiles(); toast("Fotka je v Zápise. Spracujem ju s AI."); runCapture(); }
}

function bindCd(){ const c=S.cd; if(!c||!$("#cdPanel")) return;

  const ta=$("#cdInstr"); if(ta){ ta.oninput=()=>{ c.instr=ta.value; if(c.plan){ c.plan=null; renderView(); } }; }
  document.querySelectorAll("#cdPanel input,#cdPanel textarea").forEach(el=>el.addEventListener("blur",()=>setTimeout(()=>{ if(S.cdStale&&!cdHold()){ S.cdStale=false; renderView(); } },250)));
  $("#cdMic")&&($("#cdMic").onclick=cdMic);
  document.querySelectorAll("[data-cdchip]").forEach(b=>b.onclick=()=>{ c.instr=(c.instr.trim()?c.instr.trim().replace(/[.,;]?$/,". "):"")+b.dataset.cdchip; c.plan=null; renderView(); });
  $("#cdRun")&&($("#cdRun").onclick=cdRun);
  $("#cdSave")&&($("#cdSave").onclick=cdSaveOnly);
  document.querySelectorAll("#cdCancel,#cdClose").forEach(b=>b.onclick=()=>{ try{ cdRec?.stop(); }catch(e){} if(c.url){ try{ URL.revokeObjectURL(c.url); }catch(e){} } S.cd=null; renderView(); });
  $("#cdBack")&&($("#cdBack").onclick=()=>{ c.plan=null; renderView(); $("#cdInstr")?.focus(); });
  $("#cdConfirm")&&($("#cdConfirm").onclick=cdConfirm);
  document.querySelectorAll("[data-cdon]").forEach(cb=>cb.onchange=()=>{ const P=c.plan; if(!P) return; if(cb.dataset.cdon==="c") P.contactOn=cb.checked; else P.actions[+cb.dataset.cdon].on=cb.checked; });
}

function contactCard(p){ const c=contactDue(p), b=pBirth(p), md=pNameday(p), H=personHistory(p), W=C.waiting.filter(w=>w.personId===p.id&&w.status!=="done"), open=S.kOpen===p.id;
  const mailMsg=`Dobrý deň${p.name?" "+(p.titul?p.titul+" ":"")+p.name.split(/\s+/).slice(-1)[0]:""},\n\n\n\nS pozdravom\nMarek Šromovský`;
  return `<div class="card pcard ${open?"kopen":""}" id="pc_${esc(p.id)}"><div style="display:flex;gap:12px;align-items:flex-start">${p.photo?`<a href="/_blob/${esc(p.photo)}" target="_blank" rel="noopener"><img class="pthumb" src="/_blob/${esc(p.photo)}" alt="Vizitka"></a>`:`<span class="pav">${esc((firstName(p.name)[0]||"?").toUpperCase())}</span>`}<div style="min-width:0;flex:1"><b>${esc(personLabel(p))}</b><div style="font-size:12px;color:var(--muted)">${[p.role,p.company].filter(Boolean).map(esc).join(" · ")}</div><div class="li-meta"><span class="chip">${esc(REL[p.relation]||"Iné")}</span>${p.co&&CO_TAG[p.co]&&p.co!=="sukromne"?`<span class="chip">${esc(CO_TAG[p.co])}</span>`:""}</div></div><button class="btn sm ghost" type="button" data-pedit="${esc(p.id)}">Upraviť</button></div>
    <div class="li-meta">${p.phone?`<a href="${esc(telHref(p.phone))}">${esc(p.phone)}</a>`:""}${p.email?`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:""}${p.web?`<a href="${esc(/^https?:/i.test(p.web)?p.web:"https://"+p.web)}" target="_blank" rel="noopener">${esc(String(p.web).replace(/^https?:\/\//i,""))}</a>`:""}${b?`<span>🎂 ${+b.slice(8)}. ${+b.slice(5,7)}.</span>`:""}${md&&p.nameday!==false?`<span>meniny ${+md.slice(3)}. ${+md.slice(0,2)}.</span>`:""}</div>
    ${p.address||p.met?`<div class="li-meta">${p.address?`<span>📍 ${esc(p.address)}</span>`:""}${p.met?`<span>stretli sme sa: ${esc(p.met)}</span>`:""}</div>`:""}
    <div class="li-meta"><span>naposledy v kontakte: ${p.lastContact?fmtDate(p.lastContact):"—"}</span>${c?`<span class="due ${c.days<0?"late":c.days<=3?"soon":""}">${c.days<0?"ozvi sa – "+(-c.days)+" d po intervale":c.days===0?"ozvi sa dnes":"ozvať sa o "+c.days+" d"}</span>`:""}</div>
    ${p.notes?`<div class="pnotes">${esc(String(p.notes).slice(0,open?3000:220))}${!open&&String(p.notes).length>220?"…":""}</div>`:""}
    ${H.length||W.length?`<ul class="phist">${W.map(w=>`<li data-go="ludia/cakam"><span class="dot" style="background:var(--warn)"></span>Čakám: ${esc(w.what)}${w.follow?` · urgovať ${fmtDate(w.follow)}`:""}</li>`).join("")}${H.slice(0,open?20:3).map(i=>`<li data-open="${esc(i.id)}">${dot(i.type)}${esc(i.title)}<span class="count">${i.type==="udalost"&&i.date?fmtDate(i.date)+(i.time?" "+i.time:""):i.due?"do "+fmtDate(i.due):fmtRel(i.created)}${i.type==="uloha"&&i.status==="hotova"?" · hotové":""}</span></li>`).join("")}${!open&&H.length>3?`<li data-kmore="${esc(p.id)}" style="color:var(--accent)">+ ďalšie (${H.length-3})</li>`:""}</ul>`:""}
    <div class="actions"><button class="btn sm primary" type="button" data-kdo="${esc(p.id)}">🎤 Čo s ním?</button>${p.phone?`<a class="btn sm" href="${esc(telHref(p.phone))}">Volať</a><a class="btn sm ghost" href="${esc(smsHref(p.phone,""))}">SMS</a>`:""}${p.email?`<a class="btn sm ghost" href="mailto:${esc(p.email)}?body=${encodeURIComponent(mailMsg)}">E-mail</a>`:""}<button class="btn sm ghost" type="button" data-ptouch="${esc(p.id)}">Hovoril som dnes</button></div></div>`; }
function viewKontakty(){ const td=today(), q=norm(S.kq||"").trim(), rel=S.kRel||"";
  const L=C.people.filter(p=>(!rel||p.relation===rel||(rel==="efektra"||rel==="safety")&&p.co===rel)&&(!q||norm([p.titul,p.name,p.company,p.role,p.phone,p.email,p.address,p.met,p.notes,REL[p.relation]].join(" ")).includes(q))).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"sk"));
  const up=peopleEvents(td,addDays(td,30)).sort((a,b)=>a.d.localeCompare(b.d));
  const due=C.people.map(p=>({p,c:contactDue(p)})).filter(x=>x.c&&x.c.days<=3).sort((a,b)=>a.c.days-b.c.days);
  const fl=[["","Všetci"],["zakaznik","Zákazníci"],["dodavatel","Dodávatelia"],["partner","Partneri"],["kolega","Tím"],["efektra","EFEKTRA"],["safety","Safety"],["rodina","Rodina"],["priatelia","Priatelia"]];
  return `<div class="view"><div class="band" style="--b1:var(--wi-1);--b2:var(--wi-2)"><div><div class="eyebrow">Vizitky · zákazníci · dodávatelia · vzťahy</div><h1>Kontakty</h1><p class="lead">Odfoť vizitku, nadiktuj čo s ňou a Claude uloží kontakt, úlohy aj termíny do kalendára.</p></div>
    <div class="actions"><label class="btn primary" for="kCam">📷 Odfotiť vizitku</label><input type="file" id="kCam" accept="image/*" capture="environment" hidden><label class="btn" for="kGal">Z galérie</label><input type="file" id="kGal" accept="image/*" hidden><button class="btn" type="button" id="kAdd">+ Kontakt</button></div></div>
    ${stateBanner()}${cdPanel()}${formPanel()}
    <div class="toolbar"><input type="search" id="kQ" data-keep placeholder="Hľadať meno, firmu, telefón, poznámku…" value="${esc(S.kq||"")}" aria-label="Hľadať kontakt"></div>
    <div class="kfilt">${fl.map(([k,l])=>`<button type="button" data-krel="${k}" aria-pressed="${rel===k}">${l}</button>`).join("")}<span class="count" style="margin-left:auto">${L.length} / ${C.people.length}</span></div>
    <div class="cards">${L.map(contactCard).join("")||`<div class="card" style="color:var(--muted)">${C.people.length?"Nič sa nenašlo.":"Zatiaľ žiadne kontakty. Odfoť prvú vizitku – Claude prečíta údaje a ty nadiktuješ, čo s ňou."}</div>`}</div>
    <div class="dash"><section class="panel"><div class="panel-h"><h2>Narodeniny a meniny · 30 dní</h2><span class="count">${up.length}</span></div><ul class="list">${up.slice(0,10).map(e=>`<li class="li"><span class="dot" style="background:var(--c-${e.it.cal})"></span><div class="li-main"><div class="li-title">${esc(e.it.title)}</div><div class="li-meta"><span class="due ${dayDiff(e.d)<=1?"soon":""}">${esc(shortWhen(e))}</span></div></div></li>`).join("")||`<li class="empty">Doplň narodeniny pri kontaktoch. Meniny dopĺňam podľa krstného mena.</li>`}</ul></section>
    <section class="panel"><div class="panel-h"><h2>Ozvať sa</h2><span class="count">${due.length}</span></div><ul class="list">${due.map(({p,c})=>`<li class="li"><span class="dot" style="background:${c.days<0?"var(--crit)":"var(--warn)"}"></span><div class="li-main"><div class="li-title">${esc(personLabel(p))}</div><div class="li-meta"><span>${esc(REL[p.relation]||"")}</span><span>${c.days<0?(-c.days)+" d po intervale":c.days===0?"dnes":"o "+c.days+" d"}</span><button class="btn sm ghost" type="button" data-ptouch="${esc(p.id)}">Hovoril som dnes</button></div></div></li>`).join("")||`<li class="empty">Pri dôležitých ľuďoch nadiktuj „ozvať sa raz za mesiac“.</li>`}</ul></section></div></div>`; }
function bindKontakty(){
  bindCd();
  const pick=e=>{ const f=e.target.files[0]; e.target.value=""; if(f) startCard(f); };
  $("#kCam").onchange=pick; $("#kGal").onchange=pick;
  $("#kAdd").onclick=()=>{ S.cd=null; personForm(null); };
  const q=$("#kQ"); if(q){ let t; q.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{ S.kq=q.value; renderView(); },200); }; }
  document.querySelectorAll("[data-krel]").forEach(b=>b.onclick=()=>{ S.kRel=b.dataset.krel; renderView(); });
  document.querySelectorAll("[data-kdo]").forEach(b=>b.onclick=()=>cardForPerson(byId("people",b.dataset.kdo)));
  document.querySelectorAll("[data-kmore]").forEach(b=>b.onclick=()=>{ S.kOpen=b.dataset.kmore; renderView(); });
  document.querySelectorAll("[data-pedit]").forEach(b=>b.onclick=()=>{ S.cd=null; personForm(byId("people",b.dataset.pedit)); });
  document.querySelectorAll("[data-ptouch]").forEach(b=>b.onclick=async()=>{ const p=byId("people",b.dataset.ptouch); if(p&&await put("people",p.id,{...noId(p),lastContact:today(),updated:nowIso()})) toast("Zapísané: "+personLabel(p)); });
  if(S.kOpen&&!S.cd){ const el=document.getElementById("pc_"+S.kOpen); if(el&&!S.kScrolled){ S.kScrolled=true; setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),60); } }
}
function kontaktyTile(){ const n=C.people.length, ev=peopleEvents(today(),addDays(today(),14)).sort((a,b)=>a.d.localeCompare(b.d))[0], due=C.people.filter(p=>{ const c=contactDue(p); return c&&c.days<=0; }).length;
  return {big:String(n),sub:plural(n,"kontakt","kontakty","kontaktov"),line:due?`Ozvať sa: ${due}`:ev?`${shortWhen(ev)}: ${ev.it.title}`:"Odfoť vizitku a nadiktuj, čo s ňou"}; }

/* ----- Nástenka a kontext ----- */
function ludiaTile(){ const n=inboxNew().length, w=waitLate().length, o=waitOpen().length; const ev=peopleEvents(today(),addDays(today(),7)).sort((a,b)=>a.d.localeCompare(b.d))[0];
  return {big:String(n||w||o),sub:n?plural(n,"nový odkaz","nové odkazy","nových odkazov"):w?"urgovať":"čakám na",line:ev?`${shortWhen(ev)}: ${ev.it.title}`:o?`Čakám na: ${o}`:"Odkazy, čakám na, kontakty"}; }
function peopleContext(){ const L=[];
  for(const x of inboxNew().slice(0,10)) L.push(`- Nepotvrdený odkaz od ${x.from}: ${String(x.text||"").slice(0,200)}${x.due?" (termín "+x.due+")":""}`);
  for(const w of waitOpen().slice(0,20)) L.push(`- Čakám na: ${w.what} od ${w.who||"?"} (od ${w.since}${w.follow?", urgovať "+w.follow:""})`);
  for(const p of C.people.slice(0,80)) L.push(`- Kontakt ${p.name} (${REL[p.relation]||""}${p.company?", "+p.company:""})${pBirth(p)?", narodeniny "+pBirth(p).slice(5):""}${p.lastContact?", naposledy "+p.lastContact:""}${p.notes?": "+String(p.notes).slice(0,160):""}`);
  const sc=weekScore(weekStart(today())); L.push(`- Skóre tohto týždňa ${pctR(sc.score)} (priority ${pctR(sc.pri)}, návyky ${pctR(sc.hab)}, pohyb ${fmtN(sc.mv,0)} min)`);
  const wp=weekPriorities(); if(wp.length) L.push(`- Priority týždňa: ${wp.join("; ")}`);
  return L.join("\n"); }

document.addEventListener("change",e=>{ const t=e.target; if(t&&(t.id==="photoAny"||t.id==="photoAnyH")){ const f=t.files&&t.files[0]; t.value=""; if(f) photoAny(f); } });
/* ---------- Záloha / import ---------- */
$("#btnExport").addEventListener("click",async()=>{
  const data=JSON.stringify({app:"druhy-mozog",exported:new Date().toISOString(),count:S.items.size,items:items()},null,2);
  if(!S.downloads){ toast("Sťahovanie nie je v tomto zobrazení dostupné."); return; }
  try{ await S.downloads.save({filename:`druhy-mozog-zaloha-${today()}.json`,data}); toast("Záloha uložená"); }
  catch(e){ if(e?.code!=="declined") toast("Zálohu sa nepodarilo uložiť."); }
});
$("#importFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const arr=Array.isArray(j)?j:j.items; if(!Array.isArray(arr)) throw 0;
    let n=0; toast(`Importujem ${arr.length} záznamov…`);
    for(const x of arr){ if(!x||typeof x!=="object") continue; const id=/^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(String(x.id||""))?String(x.id):newId(); const ok=await saveItem(id,{...x,type:TYPES[x.type]?x.type:"poznamka"}); if(ok) n++; }
    toast(`Importované: ${n} záznamov`);
  }catch(err){ toast("Súbor nie je platná záloha Druhého mozgu (JSON)."); }
});

/* ---------- Štart ---------- */
async function init(){
  const h=(location.hash||"").slice(1); if(VIEWS.some(v=>v[0]===h)) S.view=h;
  S.capture.text=lsGet("draft","")||"";
  renderNav(); renderView();
  if(!window.claude||typeof claude.use!=="function"){ S.dbState="none"; renderNav(); renderView(); return; }
  const use=n=>claude.use(n).catch(()=>null);
  const [db,assets,sample,downloads]=await Promise.all([use("db"),use("assets"),use("sample"),use("downloads")]);
  S.assets=assets; S.sample=sample; S.downloads=downloads;
  if(!db){ S.dbState="none"; renderNav(); renderView(); return; }
  try{ S.col=db.collection("items"); }catch(e){ S.dbState="error"; S.dbErr="cesta"; renderView(); return; }
  S.col.orderBy("updated","desc").limit(1000).onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs){ const x=d.data(); if(x) m.set(d.id,{id:d.id,type:"poznamka",title:"",body:"",tags:[],links:[],...x}); }
    const first=S.dbState!=="ready"; S.items=m; S.dbState="ready";
    if(first){ buildEdges(); renderNav(); renderView(); refreshDrawerSide(); } else refreshData();
  },err=>{ S.dbState="error"; S.dbErr=err?.code||"chyba"; renderNav(); if(S.view!=="otazka") renderView(); });
  S.db=db;
  try{ db.collection("mail").orderBy("received","desc").limit(300).onSnapshot(s=>{ S.mail=s.docs.map(d=>({...d.data(),id:d.id})); onData(); },()=>{}); }catch(e){}
  try{ db.doc("meta/mail").onSnapshot(s=>{ S.mailMeta=s.exists?s.data():null; onData(); },()=>{}); }catch(e){}
  watch("reminders",c=>c.limit(500));
  watch("assets",c=>c.limit(200));
  watch("income",c=>c.orderBy("date","desc").limit(1000));
  watch("bizcf",c=>c.limit(3000));
  watch("budget",c=>c.limit(240));
  watch("subs",c=>c.limit(300));
  watch("advice",c=>c.orderBy("date","desc").limit(40));
  watch("loans",c=>c.limit(100));
  watch("cars",c=>c.limit(20));
  watch("trips",c=>c.limit(100));
  watch("goals",c=>c.limit(200));
  watch("journal",c=>c.orderBy("date","desc").limit(120));
  watch("habits",c=>c.limit(50));
  watch("settings",c=>c.limit(50));
  watch("verse",c=>c.orderBy("date","desc").limit(3));
  watch("measures",c=>c.limit(500));
  watch("workouts",c=>c.orderBy("date","desc").limit(400));
  watch("wplans",c=>c.limit(50));
  watch("meals",c=>c.orderBy("date","desc").limit(800));
  watch("selfcare",c=>c.orderBy("date","desc").limit(400));
  watch("care",c=>c.limit(30));
  watch("hday",c=>c.limit(120));
  watch("people",c=>c.limit(500));
  watch("waiting",c=>c.limit(300));
  watch("inbox",c=>c.orderBy("received","desc").limit(200));
  watch("reviews",c=>c.limit(120));
  watch("wheel",c=>c.limit(60));
  if(S.view==="zapis"||S.view==="otazka"||S.view==="prehlad") renderView();
}
init();
</script>
