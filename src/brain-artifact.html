html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{padding:20px 18px 16px;display:flex;gap:10px;align-items:center}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--fg);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;left:5px;right:5px;bottom:6px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--pe-g) 0 4px,var(--pe-y) 4px 8px)}
.brand-name{font-family:var(--f-display);font-weight:750;font-stretch:118%;font-size:17px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-sec{padding:16px 18px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.side-types{display:flex;flex-direction:column;padding:0 10px 10px}
.side-types button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--fg);font-size:14px}
.side-types button:hover{background:var(--surface-2)}
.side-foot{margin-top:auto;padding:12px 18px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.side-foot .row{display:flex;gap:6px;flex-wrap:wrap}

.main{min-width:0;min-height:0;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:1080px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.view-head h1{font-size:28px;font-weight:760}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{color:var(--muted);max-width:62ch;margin:4px 0 0}

.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;color:var(--fg)}
.tag{display:inline-flex;align-items:center;font-size:12px;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);font-family:var(--f-mono);white-space:nowrap;cursor:pointer}
.tag:hover{color:var(--fg);border-color:var(--line-2)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--faint)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15px;font-weight:700;font-stretch:108%}
.panel-b{padding:14px 16px}

input[type=text],input[type=search],input[type=date],input[type=time],input[type=url],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}

/* Prehľad */
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.summary b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li-main{min-width:0;flex:1}
.li-title{font-weight:500;overflow-wrap:anywhere}
.li-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.li .dot{margin-top:7px}
.due{font-family:var(--f-mono);font-size:12px}
.due.late{color:var(--crit);font-weight:500}
.due.soon{color:var(--warn)}
.chk{appearance:none;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:4px;flex:none;margin-top:2px;cursor:pointer;background:var(--surface)}
.chk:checked{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--surface)}
.empty{padding:18px 16px;color:var(--muted);font-size:14px}
.stripe-crit{box-shadow:inset 3px 0 0 var(--crit)}
.stripe-warn{box-shadow:inset 3px 0 0 var(--warn)}

/* Zápis */
.capture{display:flex;flex-direction:column;gap:12px}
.capture textarea{min-height:220px;font-size:15px;padding:14px}
.typepick{display:flex;flex-wrap:wrap;gap:6px}
.typepick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 9px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:500}
.typepick button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:14px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:flex;gap:8px;flex-wrap:wrap}
.fileb{display:inline-flex;gap:6px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 6px 4px 4px;background:var(--surface-2);max-width:100%}
.fileb img{width:28px;height:28px;object-fit:cover;border-radius:4px}
.fileb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.fileb button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.proposal{display:flex;flex-direction:column;gap:10px}
.prop{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.prop .pf{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}
.prop textarea{min-height:90px;font-size:14px}
.prop-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}

/* Knižnica */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 260px}
.toolbar select{width:auto}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 9px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:13px}
.filters button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.rows .li{padding:12px 16px}
.snip{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.activetag{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

/* Opýtaj sa */
.chat{display:flex;flex-direction:column;gap:16px}
.q{align-self:flex-end;max-width:80%;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px 12px 2px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.a{background:var(--surface);border:1px solid var(--line);border-radius:2px 12px 12px 12px;padding:14px 16px;max-width:100%;min-width:0}
.a.thinking{color:var(--muted)}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);align-items:center}
.askbar{position:sticky;bottom:0;padding-block:12px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px;align-items:flex-end}
.askbar textarea{min-height:48px;max-height:180px}
.suggest{display:flex;gap:8px;flex-wrap:wrap}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;text-align:left}
.suggest button:hover{border-color:var(--accent)}

/* Mapa */
.graph-wrap{position:relative;height:min(70vh,680px);min-height:380px;padding:0;overflow:hidden}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.graph-ctl{position:absolute;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* Markdown */
.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{font-size:16px;margin:16px 0 6px;font-stretch:108%}
.md h1{font-size:18px}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:2px 0}
.md code{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);padding:0 4px;border-radius:3px}
.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.md a{color:var(--accent)}
.md .wl{color:var(--accent);text-decoration:none;border-bottom:1px dashed currentColor;cursor:pointer}
.md .wl.miss{color:var(--faint)}
.md blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid var(--line-2);color:var(--muted)}

/* Detail */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:31;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.d-head .status{font-size:12px;color:var(--faint);margin-right:auto}
.d-body{overflow:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:16px;min-height:0;flex:1 1 auto}
.d-foot{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface)}
.d-foot .btn.primary{flex:1;max-width:320px;padding:11px 16px;font-size:15px}
.d-title{font-family:var(--f-display);font-stretch:112%;font-weight:720;font-size:22px;border:0;padding:4px 0;border-radius:0;border-bottom:1px solid transparent;background:none}
.d-title:focus{border-bottom-color:var(--line-2);outline:none}
.d-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.d-body textarea.body{min-height:260px;font-size:14.5px}
.mdview{min-height:120px;padding:4px 2px}
.sec-t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.linkrow:first-child{border-top:0}
.linkrow .t{flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere}
.linkrow .t:hover{color:var(--accent)}
.picker{position:relative}
.picker-res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;box-shadow:var(--shadow);z-index:5;max-height:240px;overflow:auto}
.picker-res button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer;font-size:14px}
.picker-res button:hover{background:var(--surface-2)}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.att-i{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.att-i a{display:block;aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-family:var(--f-mono);font-size:13px}
.att-i img{width:100%;height:100%;object-fit:cover}
.att-i .n{font-size:11px;padding:4px 6px;display:flex;gap:4px;align-items:center}
.att-i .n span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-i .n button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;background:var(--surface)}
.tagedit input{border:0;padding:2px;flex:1;min-width:120px;width:auto;background:none}
.tagedit input:focus{outline:none}
.tagedit .tag button{border:0;background:none;padding:0 0 0 4px;cursor:pointer;color:inherit}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--crit);border-radius:7px;font-size:14px}
.aisug{border:1px dashed var(--accent);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}

.banner{padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px}
.banner.err{border-color:var(--crit);color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

/* Dashboard – dlaždice v štýle widgetov */
.view-dash{max-width:1180px}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;grid-auto-flow:row dense}
.w{--ink:var(--w-ink);--ink-2:var(--w-ink-2);--glass:var(--w-glass);--glass-2:var(--w-glass-2);--g1:var(--surface);--g2:var(--surface);
  border-radius:22px;padding:16px 18px 18px;color:var(--ink);min-width:0;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;min-height:170px;
  background:linear-gradient(155deg,var(--g1),var(--g2));box-shadow:var(--w-shadow)}
.w-s{grid-column:span 1}.w-m{grid-column:span 2}.w-l{grid-column:span 2;grid-row:span 2}.w-w{grid-column:1/-1;min-height:0}
.w-plain{--ink:var(--fg);--ink-2:var(--muted);--glass:var(--surface-2);--glass-2:var(--line);border:1px solid var(--line)}
.w-today{--g1:var(--wb-1);--g2:var(--wb-2)}
.w-family{--g1:var(--wo-1);--g2:var(--wo-2)}
.w-tasks{--g1:var(--wg-1);--g2:var(--wg-2)}
.w-proj{--g1:var(--wv-1);--g2:var(--wv-2)}
.w-ideas{--g1:var(--wy-1);--g2:var(--wy-2);--ink:var(--w-ink-dk);--ink-2:var(--w-ink-dk-2);--glass:var(--w-glass-dk);--glass-2:var(--w-glass-dk-2)}
.w-int{--g1:var(--wp-1);--g2:var(--wp-2)}
.w-fin{--g1:var(--wt-1);--g2:var(--wt-2)}
.w-feast{--g1:var(--wf-1);--g2:var(--wf-2)}
.w-forgot{--g1:var(--ws-1);--g2:var(--ws-2)}
.w-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);min-height:30px}
.w-ic{width:18px;height:18px;display:inline-flex;flex:none}
.w-ic svg{width:18px;height:18px}
.w-h .sp{flex:1}
.w-add{width:30px;height:30px;border-radius:50%;border:0;background:var(--glass-2);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.w-add:hover{filter:brightness(1.12)}
.w-big{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.w-sub{font-size:13px;color:var(--ink-2);line-height:1.4}
.w-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.w-row{display:flex;gap:10px;align-items:center;background:var(--glass);border-radius:12px;padding:8px 10px;cursor:pointer;min-width:0;font-size:14px}
.w-row:hover{background:var(--glass-2)}
.w-row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-row .m{font-size:12px;color:var(--ink-2);font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.w-empty{font-size:14px;color:var(--ink-2);line-height:1.45}
.w-in{display:flex;gap:6px}
.w-in input{background:var(--glass);border:1px solid transparent;color:var(--ink);border-radius:12px;padding:9px 12px}
.w-in input::placeholder{color:var(--ink-2)}
.w-in input:focus{outline:none;border-color:var(--ink-2)}
.w .chk{border-color:var(--ink-2);background:transparent;margin-top:0}
.w .chk:checked{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--g2)}
.w-foot{margin-top:auto;font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.w-btn{border:0;background:var(--glass-2);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.w-btn:hover{filter:brightness(1.1)}
.pill{background:var(--glass-2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.alert{background:var(--w-alert);color:var(--w-ink)}
.today-top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.today-num{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:76px;line-height:.82;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.today-wd{font-family:var(--f-display);font-weight:720;font-stretch:112%;font-size:24px;line-height:1.1}
.today-pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.cal-scroll{display:flex;flex-direction:column;gap:12px;min-height:0}
.cal-g{display:flex;flex-direction:column;gap:2px}
.cal-d{font-size:12px;font-weight:700;display:flex;gap:6px;align-items:baseline;padding:0 8px;letter-spacing:.02em}
.cal-d.now{color:var(--t-udalost)}
.cal-d span{font-weight:500;color:var(--ink-2);font-family:var(--f-mono)}
.ev{display:grid;grid-template-columns:4px 66px minmax(0,1fr);gap:10px;align-items:center;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:14px}
.ev:hover{background:var(--glass)}
.ev-bar{width:4px;height:22px;border-radius:2px}
.ev-t{font-size:12px;color:var(--ink-2);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ev-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-n .rep{color:var(--ink-2);font-size:12px}
.cal-legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:auto;padding-top:4px}
.cal-legend span{display:inline-flex;gap:5px;align-items:center}
.prog{height:6px;border-radius:3px;background:var(--glass-2);overflow:hidden;flex:none;width:64px}
.prog i{display:block;height:100%;background:var(--ink);border-radius:3px}
.feast-name{font-family:var(--f-display);font-weight:800;font-stretch:118%;font-size:28px;line-height:1.02;color:var(--wf-gold)}
.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.area{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;min-width:0;font-size:14px;color:var(--fg)}
.area:hover{border-color:var(--line-2)}
.area .dot{width:12px;height:12px}
.area span.nm{min-width:0;line-height:1.3}
.w-s .w-row{flex-direction:column;align-items:flex-start;gap:1px}
.w-s .w-row .n{width:100%}
.area b{margin-left:auto;font-family:var(--f-mono);font-weight:500;color:var(--muted)}

/* Pošta */
.mtabs{display:flex;gap:6px;flex-wrap:wrap}
.mtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--fg);display:inline-flex;gap:6px;align-items:center}
.mtabs button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 10px;border-radius:12px;background:var(--surface-2);align-items:start}
.mrow.done{opacity:.55}
.mrow .mfrom{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.mrow .msub{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1/-1}
.mrow .msum{font-size:13px;color:var(--muted);grid-column:1/-1;line-height:1.4}
.mrow .mact{display:flex;gap:4px;align-items:center}
.mrow .mact a,.mrow .mact button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none;cursor:pointer;font-size:14px}
.mtime{font-family:var(--f-mono);font-size:11px;color:var(--faint);font-weight:400}
.dl{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--crit);border:1px solid var(--crit);border-radius:999px;padding:0 7px;margin-top:4px;justify-self:start;grid-column:1/-1}
.mlist{display:flex;flex-direction:column;gap:6px;min-width:0}

/* Výdavky */
.money{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.hbar .trk{height:10px}
.hbar .trk i{display:block;height:100%;background:var(--t-vydavok);border-radius:0 4px 4px 0;min-width:3px}
.hbar .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
.vbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:180px;padding-top:6px;border-bottom:1px solid var(--line-2)}
.vbar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.vbar i{width:min(48px,100%);background:var(--t-vydavok);opacity:.4;border-radius:4px 4px 0 0;min-height:2px}
.vbar.cur i{opacity:1}
.vbar .v{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.vbar.cur .v{color:var(--fg);font-weight:500}
.vlabels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.expform{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:16px}
.expform .prev{border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);aspect-ratio:3/4;max-width:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--f-mono);font-size:13px;text-align:center;padding:8px}
.expform .prev img{width:100%;height:100%;object-fit:cover}
.expform .prev:has(img){padding:0}
.expfields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.expday{font-size:12px;font-weight:700;color:var(--muted);padding:12px 16px 4px;letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.monthnav{display:inline-flex;align-items:center;gap:6px}
.monthnav b{font-family:var(--f-display);font-stretch:110%;font-weight:700;min-width:9.5em;text-align:center}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* Sekcie */
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.vtabs::-webkit-scrollbar{display:none}
.vtabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.vtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.kpi .v{font-family:var(--f-display);font-stretch:115%;font-weight:760;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--faint)}
.pos{color:var(--ok)}.neg{color:var(--crit)}
.jars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.jar{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.jar .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jar .pc{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.jar .bal{font-family:var(--f-display);font-stretch:112%;font-weight:760;font-size:20px;font-variant-numeric:tabular-nums}
.jar .fill{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.jar .fill i{display:block;height:100%;background:var(--accent);border-radius:3px}
.jargrid{display:grid;grid-template-columns:minmax(0,1.3fr) 90px minmax(0,2fr);gap:8px;align-items:center}
.jargrid .h{font-size:12px;color:var(--muted);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:17px;font-weight:720}
.card .sub{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.dchip{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0;background:var(--surface-2)}
.dchip.warn{border-left-color:var(--warn)}.dchip.crit{border-left-color:var(--crit)}
.dchip .l{font-size:12px;color:var(--muted);font-weight:600}
.dchip .d{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.dchip .r{font-size:12px;color:var(--muted)}
.dchip.crit .r{color:var(--crit);font-weight:600}.dchip.warn .r{color:var(--warn);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.ck{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ck li{display:flex;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);min-width:0}
.ck li:first-child{border-top:0}
.ck li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ck li.done .t{text-decoration:line-through;color:var(--muted)}
.ck li .m{font-size:12px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.ck li .x{border:0;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.ck li .x:hover{color:var(--crit)}
.ck li .chk{margin-top:0}
.addrow{display:flex;gap:6px;margin-top:6px}
.addrow input{flex:1}
.addrow select{width:auto;flex:none}
.cat-h{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px;display:flex;justify-content:space-between}
.tripcard{cursor:pointer}
.tripcard:hover{border-color:var(--line-2)}
.big-cd{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.vision{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.vtile{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;display:flex;align-items:flex-end}
.vtile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vtile .cap{position:relative;width:100%;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:var(--w-ink);font-weight:600;font-size:14px}
.vtile .cap span{display:block;font-weight:400;font-size:12px;opacity:.85}
.vtile.noimg .cap{background:none;color:var(--fg)}
.goalrow{display:grid;grid-template-columns:44px minmax(0,1fr) 110px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.goalrow:first-child{border-top:0}
.goalrow:hover{background:var(--surface-2)}
.goalrow .th{width:44px;height:44px;border-radius:10px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.goalrow .th img{width:100%;height:100%;object-fit:cover}
.goalrow .pc{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.imgprev{width:120px;height:90px;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.imgprev img{width:100%;height:100%;object-fit:cover}
.jrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,190px);gap:8px;align-items:center}
.jrow .num{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--accent);width:22px;text-align:center}
.verse{font-family:var(--f-display);font-stretch:100%;font-size:19px;line-height:1.45;font-weight:500}
.verse-ref{font-size:13px;color:var(--muted);margin-top:6px}
.habgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(14,18px) 48px;gap:4px;align-items:center;font-size:13px}
.habgrid .hd{width:18px;height:18px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.habgrid .hd.on{background:var(--ok);border-color:var(--ok)}
.habgrid .st{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.habgrid .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--glass);font-size:14px;min-width:0}
.prow[data-go],.prow[data-open]{cursor:pointer}
.prow .sv{width:8px;height:8px;border-radius:50%;flex:none}
.prow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .m{font-size:12px;color:var(--ink-2);font-family:var(--f-mono);white-space:nowrap}
.w-verse{--g1:var(--wr-1);--g2:var(--wr-2)}
.w-habits{--g1:var(--wk-1);--g2:var(--wk-2)}
.w-trip{--g1:var(--wt-1);--g2:var(--wt-2)}
.w-car{--g1:var(--ws-1);--g2:var(--ws-2)}
.w-row .ti{display:inline-flex;gap:8px;align-items:center;min-width:0;flex:1}
.wthumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.wthumbs div{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);max-width:100%}
.wthumbs img{width:100%;height:100%;object-fit:cover}
.more-sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.more-sheet button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;cursor:pointer;color:var(--fg)}
.more-sheet button svg{width:22px;height:22px}

/* Živšie pozadie */
.main{background:radial-gradient(1200px 500px at 10% -10%,var(--app-glow1),transparent 60%),radial-gradient(900px 500px at 100% 0%,var(--app-glow2),transparent 55%),radial-gradient(900px 600px at 50% 110%,var(--app-glow3),transparent 60%),var(--bg)}
/* Široký widget */
.hero{--g1:var(--h1);--g2:var(--h3);background:linear-gradient(125deg,var(--h1) 0%,var(--h2) 55%,var(--h3) 100%);min-height:0;gap:14px;padding:18px 20px 20px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.hero-time{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:56px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-date{font-size:16px;font-weight:600;margin-top:6px;color:var(--w-ink-2)}
.hero-side{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero-nd{background:var(--w-glass-2);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;line-height:1.2}
.hero-nd span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--w-ink-2)}
.hero-nd b{font-size:15px}
.hero-btn{border:0;background:var(--w-ink);color:var(--h2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.hchips{display:flex;gap:6px;flex-wrap:wrap}
.hchip{--cc:var(--w-glass-2);display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--w-glass);box-shadow:inset 3px 0 0 var(--cc);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hchip.red{background:var(--w-alert);box-shadow:none}
.hchip.gold{background:var(--wf-gold);color:#04142b;box-shadow:none}
.hchip button{border:0;background:#04142b;color:var(--wf-gold);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;cursor:pointer}
.hp{background:var(--w-glass);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hp-h{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--w-ink-2)}
.hp-row{display:flex;gap:10px;align-items:center;min-height:34px;font-size:15px;font-weight:500}
.hp-row .n{flex:1;min-width:0;overflow-wrap:anywhere}
.hp-row.done .n{text-decoration:line-through;opacity:.7}
.hp-row input[type=text]{flex:1;background:var(--w-glass);border:1px solid transparent;color:var(--w-ink);border-radius:10px;padding:7px 10px}
.hp-row input[type=text]::placeholder{color:var(--w-ink-2)}
.hp-row input[type=text]:focus{outline:none;border-color:var(--w-ink-2)}
.hp-num{width:22px;height:22px;border-radius:50%;background:var(--w-glass-2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.hp-x{border:0;background:none;color:var(--w-ink-2);cursor:pointer;font-size:15px;padding:2px 6px}
.hero .chk{border-color:var(--w-ink-2);background:transparent}
.hero .chk:checked{background:var(--w-ink);border-color:var(--w-ink);box-shadow:inset 0 0 0 3px var(--h2)}
/* Štvorcové widgety */
.sq-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.sq{aspect-ratio:1/1;max-width:100%;min-height:0;padding:14px 15px;gap:6px;cursor:pointer;transition:transform .15s ease}
.sq:hover{transform:translateY(-2px)}
.sq-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.sq-h svg{width:17px;height:17px;flex:none}
.sq .w-big{font-size:38px;margin-top:auto}
.sq .sq-sub{font-size:13px;color:var(--ink-2);line-height:1.3}
.sq .sq-line{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sq .sq-lines{display:flex;flex-direction:column;gap:4px;margin-top:auto;min-width:0}
.sq .sq-lines div{font-size:12.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--glass);border-radius:8px;padding:4px 7px}
.sq-cal-d{display:flex;flex-direction:column;line-height:1}
.sq-cal-d .wd{font-size:13px;font-weight:700;text-transform:capitalize;color:var(--ink-2)}
.sq-cal-d .dn{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:46px}
.sq-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.sq > *:not(.sq-img){position:relative}
.sq-hidden{opacity:.4}
.sq-edit{position:absolute!important;left:8px;right:8px;bottom:8px;display:flex;gap:6px;justify-content:space-between}
.sq-edit button{border:0;border-radius:999px;background:var(--surface);color:var(--fg);font-weight:700;font-size:12px;padding:5px 10px;cursor:pointer;box-shadow:var(--shadow)}
.w-cal2{--g1:var(--wc-1);--g2:var(--wc-2)} .w-sky{--g1:var(--wsk-1);--g2:var(--wsk-2)} .w-navy{--g1:var(--wn-1);--g2:var(--wn-2)} .w-indigo{--g1:var(--wi-1);--g2:var(--wi-2)}
.w-graph{--g1:var(--wgr-1);--g2:var(--wgr-2)} .w-magenta{--g1:var(--wm-1);--g2:var(--wm-2)} .w-rose{--g1:var(--wro-1);--g2:var(--wro-2)}
.dash-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding-top:4px}
/* Farebné hlavičky sekcií */
.band{background:linear-gradient(135deg,var(--b1),var(--b2));color:var(--w-ink);border-radius:22px;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;box-shadow:var(--w-shadow)}
.band h1{color:inherit}
.band .eyebrow,.band .lead{color:var(--w-ink-2)}
.band .btn{background:var(--w-glass-2);border-color:transparent;color:var(--w-ink)}
.band .btn:hover{border-color:var(--w-ink-2)}
.band .btn.primary{background:var(--w-ink);color:var(--b2)}
.band .monthnav b{color:inherit}
/* Kalendár */
.wk{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));min-width:660px}
.wk-col{border-left:1px solid var(--line);padding:8px 6px;min-height:160px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0}
.wk-col:first-child{border-left:0}
.wk-col.today{background:var(--accent-soft)}
.wk-col.sel .wk-h b{background:var(--accent);color:var(--accent-fg)}
.wk-h{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding-bottom:4px}
.wk-h b{font-size:16px;color:var(--fg);width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.wk-ev{--cc:var(--accent);font-size:12px;line-height:1.25;padding:4px 6px;border-radius:6px;background:var(--surface-2);box-shadow:inset 3px 0 0 var(--cc);overflow-wrap:anywhere;cursor:pointer}
.wk-ev span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mo-h{font-size:11px;text-align:center;color:var(--muted);font-weight:600;text-transform:uppercase;padding:2px 0}
.mo-c{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:82px;padding:5px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;cursor:pointer;min-width:0;color:var(--fg)}
.mo-c.out{opacity:.45}
.mo-c.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mo-c.sel{background:var(--accent-soft)}
.mo-c .dn{font-size:13px;font-weight:700}
.mo-ev{--cc:var(--accent);font-size:11px;line-height:1.2;padding:2px 4px;border-radius:4px;background:var(--surface-2);box-shadow:inset 2px 0 0 var(--cc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mo-more{font-size:11px;color:var(--muted)}
/* Financie */
.fhero{background:linear-gradient(135deg,var(--wt-1),var(--wt-2));color:var(--w-ink);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--w-shadow)}
.fhero .lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--w-ink-2)}
.fhero .big{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.fhero .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fhero .box{background:var(--w-glass);border-radius:14px;padding:10px 12px}
.fhero .box b{display:block;font-family:var(--f-display);font-stretch:115%;font-size:22px;font-variant-numeric:tabular-nums}
.splitbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--w-glass);gap:2px}
.splitbar i{display:block;height:100%}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fc{border-radius:18px;padding:14px 16px;color:var(--w-ink);background:linear-gradient(150deg,var(--g1),var(--g2));display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--w-shadow)}
.fc .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--w-ink-2)}
.fc .v{font-family:var(--f-display);font-stretch:115%;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.fc .s{font-size:12px;color:var(--w-ink-2)}
.fc .pr{display:flex;gap:8px;align-items:center;font-size:13px;background:var(--w-glass);border-radius:10px;padding:5px 8px;min-width:0}
.fc .pr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc .pr button{border:0;border-radius:999px;background:var(--w-ink);color:var(--g2);font-weight:700;font-size:11px;padding:2px 8px;cursor:pointer}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.slegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 14px;margin-top:10px;font-size:13px}
.slegend span{display:flex;gap:8px;align-items:center;min-width:0}
.slegend span em{font-style:normal;margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.slegend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.confirmed{font-size:12px;color:var(--ok);font-weight:600}
.fc[data-fintab]{cursor:pointer}
.fc-gold{color:var(--w-ink-dk)}
.fc-gold .k,.fc-gold .s{color:var(--w-ink-dk-2)}

.bottomnav{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side{display:none}
  .bottomnav{display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 6px;cursor:pointer;min-width:56px}

  .mo-c{min-height:52px;padding:4px}
  .wk{min-width:0;grid-template-columns:repeat(7,minmax(0,1fr))}
  .wk-col{padding:6px 2px;min-height:120px;gap:3px}
  .wk-h b{width:26px;height:26px;font-size:14px}
  .wk-ev{font-size:10px;padding:3px 3px 3px 5px;line-height:1.2}
  .wk-ev span{font-size:9px}
  .hchip{white-space:normal;border-radius:14px}

  .mo-ev{font-size:0;height:5px;padding:0;box-shadow:none;background:var(--cc)}
  .bottomnav{align-items:flex-end}

/* ---------- Autá: garáž a detail auta ---------- */
:root{--stage-1:#123067;--stage-2:#03060c;--stage-ink:#f4f6f8;--stage-ink-2:rgba(244,246,248,.66);--stage-glass:rgba(255,255,255,.08);--stage-glass-2:rgba(255,255,255,.14);--stage-ok:#5fd38a;--stage-warn:#f3b544;--stage-crit:#ff7a6e}

const ageDays = (iso)=>iso? Math.floor((Date.now()-new Date(iso).getTime())/864e5) : 9999;
const fmtDate = (iso)=>{ if(!iso) return ""; const d=new Date(iso.length<=10?iso+"T00:00:00":iso); return d.getDate()+". "+(d.getMonth()+1)+". "+d.getFullYear(); };

const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

const ISO_RE=/^\d{4}-\d{2}-\d{2}$/;
/* Výskyty udalosti v intervale <from,to> vrátane opakovania */
function occurrences(it,from,to){
  const out=[], start=it.date||"", r=it.repeat||"";
  if(!ISO_RE.test(start) || start>to) return out;
  if(!r){ if(start>=from) out.push(start); return out; }
  if(r==="tyzdenne"){
    const d=pd(start);
    if(start<from){ const days=Math.round((pd(from)-d)/864e5); d.setDate(d.getDate()+Math.ceil(days/7)*7); }
    while(isoD(d)<=to && out.length<120){ out.push(isoD(d)); d.setDate(d.getDate()+7); }
    return out;
  }
  const s=pd(start), day=s.getDate(), f=pd(from);
  for(let i=0;i<60&&out.length<120;i++){
    let yy,mm;
    if(r==="rocne"){ yy=f.getFullYear()+i; mm=s.getMonth(); }
    else { const k=f.getMonth()+i; yy=f.getFullYear()+Math.floor(k/12); mm=k%12; }
    const last=new Date(yy,mm+1,0).getDate(); const c=isoD(new Date(yy,mm,Math.min(day,last)));
    if(c>to) break; if(c>=from && c>=start) out.push(c);
  }
  return out;
}
/* Agenda: udalosti (s opakovaním) + otvorené úlohy s termínom */
function agenda(from,to,o={}){
  const out=[];
  for(const it of S.items.values()){
    if(o.filter && !o.filter(it)) continue;
    if(it.type==="udalost") for(const d of occurrences(it,from,to)) out.push({d,it});
    else if(o.tasks && isOpenTask(it) && ISO_RE.test(it.due||"") && it.due<=to && (it.due>=from || o.late)) out.push({d:it.due<from?from:it.due,it,late:it.due<from});
  }
  if(!o.noVirtual) for(const v of virtualEvents(from,to)) if(!o.filter||o.filter(v.it)) out.push(v);
  return out.sort((a,b)=>a.d.localeCompare(b.d) || (a.late?-1:0)-(b.late?-1:0) || (a.it.time||"99").localeCompare(b.it.time||"99"));
}

function findByTitle(t){ const n=norm(t).trim(); for(const it of S.items.values()) if(norm(it.title).trim()===n) return it; return null; }
function wikiTargets(body){ const out=[]; String(body||"").replace(/\[\[([^\]\n]{1,160})\]\]/g,(m,t)=>{const it=findByTitle(t); if(it) out.push(it.id); return m;}); return out; }
function outLinks(it){ const s=new Set(it.links||[]); if(it.project) s.add(it.project); wikiTargets(it.body).forEach(x=>s.add(x)); s.delete(it.id); return [...s].filter(id=>S.items.has(id)); }
function buildEdges(){
  const out=new Map(), back=new Map();
  for(const it of S.items.values()){ const o=outLinks(it); out.set(it.id,o); for(const t of o){ if(!back.has(t)) back.set(t,new Set()); back.get(t).add(it.id); } }
  S.edges={out,back};
}

/* ---------- Markdown ---------- */
function inline(s){
  let h=esc(s);
  h=h.replace(/`([^`]+)`/g,"<code>$1</code>");
  h=h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  h=h.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  h=h.replace(/\[\[([^\]\n]{1,160})\]\]/g,(m,t)=>{const tt=t.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'"); const it=findByTitle(tt); return it?`<a class="wl" data-open="${esc(it.id)}">${t}</a>`:`<span class="wl miss" title="Záznam s týmto názvom neexistuje">${t}</span>`;});
  h=h.replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return h;
}
function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n"); let out="", list=null, para=[];
  const flushP=()=>{ if(para.length){ out+="<p>"+para.map(inline).join("<br>")+"</p>"; para=[]; } };
  const flushL=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  for(const raw of lines){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){ flushP(); flushL(); continue; }
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){ flushP(); flushL(); const n=m[1].length; out+=`<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if(/^(-{3,}|\*{3,})$/.test(l.trim())){ flushP(); flushL(); out+="<hr>"; continue; }
    if((m=l.match(/^>\s?(.*)$/))){ flushP(); flushL(); out+=`<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if((m=l.match(/^\s*[-*]\s+(\[( |x|X)\]\s+)?(.*)$/))){ flushP(); if(list!=="ul"){ flushL(); out+="<ul>"; list="ul"; } const box=m[1]?(m[2].trim()?"☑ ":"☐ "):""; out+=`<li>${box}${inline(m[3])}</li>`; continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if(list!=="ol"){ flushL(); out+="<ol>"; list="ol"; } out+=`<li>${inline(m[1])}</li>`; continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL(); return out;
}
function snippet(body,n=180){ return String(body||"").replace(/[#*`>\[\]]/g,"").replace(/\s+/g," ").trim().slice(0,n); }

function dashData(){
  const all=items(), td=today();
  const tasks=all.filter(isOpenTask);
  const late=tasks.filter(t=>t.due && dayDiff(t.due)<0).sort((a,b)=>a.due.localeCompare(b.due));
  const week=tasks.filter(t=>t.due && dayDiff(t.due)>=0 && dayDiff(t.due)<=7).sort((a,b)=>a.due.localeCompare(b.due));
  const nodue=tasks.filter(t=>!t.due).sort((a,b)=>(b.updated||"").localeCompare(a.updated||""));
  const projects=all.filter(i=>i.type==="projekt" && (i.status||"aktivny")==="aktivny");
  const forgotten=all.filter(i=>(isOpenTask(i)||(i.type==="projekt"&&(i.status||"aktivny")==="aktivny")) && ageDays(i.updated)>=21).sort((a,b)=>(a.updated||"").localeCompare(b.updated||""));

  const recent=all.filter(i=>ageDays(i.created)<7).sort((a,b)=>(b.created||"").localeCompare(a.created||""));
  return {all,tasks,late,week,nodue,projects,forgotten,unsorted,recent,td};
}

async function quickSave(text,type){
  if(!S.col){ toast("Úložisko nie je dostupné."); return; }
  const url=(text.match(/https?:\/\/[^\s]+/i)||[""])[0];
  let title=text.replace(url,"").replace(/\s+/g," ").trim();
  if(!title) title=domainOf(url)||"Odkaz";
  if(title.length>90) title=title.slice(0,87)+"…";
  const ok=await saveItem(newId(),{type,title,body:text,tags:[],links:[],area:type==="poznamka"?"napady":"",url,source:"dashboard"});
  if(ok) toast(type==="poznamka"?"Nápad uložený":"Uložené do Zaujímavé");
}

async function runReview(){

  const recentFull=d.recent.slice(0,25).map(i=>`### ${i.title} (${TYPES[i.type].label}, ${fmtDate(i.created)})\n${String(i.body||"").slice(0,1200)}`).join("\n\n");
  const prompt=`Si môj asistent. Napíš po slovensky stručný týždenný prehľad môjho systému Brain (som revízny technik a projektant: FVE, bleskozvody, elektroinštalácie, školenia, obchod). Dnes je ${d.td}.
Vychádzaj VÝHRADNE z údajov nižšie, nič nevymýšľaj. Keď spomínaš záznam, uveď jeho presný názov v tvare [[Názov]].
Štruktúra (Markdown): ## Čo horí (po termíne, do 7 dní a dôležité nevybavené maily), ## Najbližšie v kalendári (rodina a osobné zvlášť), ## Výdavky (tento mesiac, najväčšie kategórie), ## Čo sa za týždeň pohlo, ## Zabudnuté veci, ## Návrh 3 priorít na budúci týždeň (každá s odôvodnením z údajov). Max 250 slov.

PO TERMÍNE:
${d.late.map(line).join("\n")||"-"}
DO 7 DNÍ:
${d.week.map(line).join("\n")||"-"}
BEZ TERMÍNU:
${d.nodue.slice(0,30).map(line).join("\n")||"-"}
AKTÍVNE PROJEKTY:
${d.projects.map(line).join("\n")||"-"}
VÝDAVKY:
${expSummaryText(2)}
DÔLEŽITÉ NEVYBAVENÉ MAILY:
${S.mail.filter(x=>x.cat==="dolezite"&&!x.handled).slice(0,15).map(x=>`- od ${x.from||x.fromEmail}: ${x.subject}${x.deadline?" (termín "+x.deadline+")":""}`).join("\n")||"-"}
UDALOSTI V KALENDÁRI NA 14 DNÍ:
${agenda(d.td,addDays(d.td,13)).map(e=>`- ${e.d}${e.it.time?" "+e.it.time:""} [${CALS[e.it.cal]||"Osobné"}] ${e.it.title}`).join("\n")||"-"}
ZABUDNUTÉ (21+ dní bez zmeny):
${d.forgotten.slice(0,20).map(i=>line(i)+" naposledy "+(i.updated||"").slice(0,10)).join("\n")||"-"}
NOVÉ ZÁZNAMY ZA 7 DNÍ:
${recentFull||"-"}`;
  S.review.busy=true; S.review.text=""; if(S.view==="otazka") renderView();
  const out=()=>$("#reviewOut");
  if(out()) out().innerHTML=`<span style="color:var(--muted)"><span class="spin"></span> Premýšľam…</span>`;
  try{
    const r=await S.sample(prompt.slice(0,200000),{cache:false,onText:({text})=>{S.review.text=text; if(out()) out().innerHTML=md(text);}});
    S.review.text=r.text;
  }catch(e){ S.review.text=e?.text||""; toast(sErr(e)); if(aiOff.includes(e?.code)) S.sample=null; }
  S.review.busy=false; if(S.view==="otazka") renderView();
}

async function uploadFiles(files){

  const extType={csv:"text/csv",md:"text/markdown",txt:"text/plain",json:"application/json",pdf:"application/pdf"};
  for(const f of files){
    try{
      const ext=(f.name.split(".").pop()||"").toLowerCase();
      const opts=(!f.type||!/^(image\/(png|jpeg|gif|webp|svg\+xml)|application\/pdf|text\/(csv|markdown|plain)|application\/json|video\/(mp4|webm))$/.test(f.type))&&extType[ext]?{type:extType[ext]}:undefined;
      const r=await S.assets.upload(f,opts);
      out.push({id:r.id,name:f.name,type:r.contentType,size:r.sizeBytes});
    }catch(e){ toast(`${f.name}: ${e?.code==="unsupported_type"?"nepodporovaný typ súboru":e?.code==="too_large"?"príliš veľký súbor":e?.code==="quota_or_state"?"úložisko príloh je plné":"nahratie zlyhalo"}.`); }
  }

}

const monthKey=d=>String(d||"").slice(0,7);
const curMonth=()=>S.exp.month||today().slice(0,7);
function shiftMonth(m,n){ const [y,mm]=m.split("-").map(Number); const d=new Date(y,mm-1+n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
const monthName=m=>{ const [y,mm]=m.split("-").map(Number); return MONTHS_N[mm-1]+" "+y; };
const expensesReal=()=>items().filter(i=>i.type==="vydavok"&&i.amount!=null&&Number.isFinite(+i.amount)&&ISO_RE.test(i.date||""));
const expenses=()=>{ const r=expensesReal(); return C.subs.length?r.concat(subExpenses(r)):r; };
const sumC=arr=>arr.reduce((s,i)=>s+Math.round(+i.amount*100),0)/100;
function expStats(m){
  const all=expenses();
  const list=all.filter(i=>monthKey(i.date)===m).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||"").localeCompare(a.created||""));
  const cats={}; for(const i of list){ const k=EXPCAT[i.expcat]?i.expcat:"ine"; cats[k]=(cats[k]||0)+Math.round(+i.amount*100); }
  const catArr=Object.entries(cats).map(([k,c])=>[k,c/100]).sort((a,b)=>b[1]-a[1]);
  const prevM=shiftMonth(m,-1);
  const months=[]; for(let k=5;k>=0;k--){ const mk=shiftMonth(m,-k); months.push([mk,sumC(all.filter(i=>monthKey(i.date)===mk))]); }
  return {list,total:sumC(list),catArr,prev:sumC(all.filter(i=>monthKey(i.date)===prevM)),prevM,months};
}
function expSummaryText(n=6){
  const m0=today().slice(0,7); const out=[];
  for(let k=0;k<n;k++){ const m=shiftMonth(m0,-k); const st=expStats(m); if(!st.list.length) continue;
    out.push(`- ${monthName(m)}: spolu ${eur(st.total)} (${st.list.length} dokladov); ${st.catArr.map(([c,v])=>(EXPCAT[c]||c)+" "+eur(v)).join(", ")}`); }
  return out.join("\n")||"- žiadne výdavky v evidencii";
}

async function startReceipt(file){
  if(file.size>20*1024*1024){ toast("Súbor je väčší ako 20 MB."); return; }
  clearExp(); newExpForm(); S.exp.file=file;
  const readable=/^image\/(jpeg|png|webp|gif)$/.test(file.type);
  if(readable) S.exp.preview=URL.createObjectURL(file);
  go("vydavky");
  if(!readable){ toast(file.type==="application/pdf"?"PDF doklad sa priloží, údaje vyplň ručne.":"Tento formát Claude nevie prečítať. Vyplň údaje ručne."); return; }
  if(!S.sample){ toast("Čítanie bločkov cez AI funguje po otvorení stránky v Claude. Vyplň údaje ručne."); return; }
  const lim=await S.sample.limits().catch(()=>null);
  if(!lim?.images){ toast("Posielanie fotiek do Claude tu nie je dostupné. Vyplň údaje ručne."); return; }
  S.exp.busy=true; renderView();
  const prompt=`Na obrázku je pokladničný doklad (bloček, často slovenský eKasa doklad) alebo faktúra za súkromný nákup. Dnes je ${today()}.

- date: dátum nákupu YYYY-MM-DD
- total: celková suma na úhradu v EUR ako číslo s bodkou (riadok SPOLU / NA ÚHRADU / CELKOM), nie medzisúčet ani DPH
- category: jedna z ${Object.keys(EXPCAT).join(", ")}
- payment: "karta", "hotovost", "prevod" alebo "" ak nie je jasné
- items: najviac 5 najdrahších položiek [{"name":"...","price":0.00}]
- note: krátky opis nákupu po slovensky, max 80 znakov
Ak údaj nevieš prečítať, daj null. Nikdy neuvádzaj číslo platobnej karty, účtu ani autorizačný kód.
Odpovedz IBA JSON: {"merchant":null,"date":null,"total":null,"category":"ine","payment":"","items":[],"note":null}`;
  expCtl=new AbortController(); const ctl=expCtl;
  try{
    const r=await S.sample.json(prompt,{images:[file],cache:false,signal:ctl.signal});
    const F=S.exp.form; if(!F||S.exp.file!==file) return;
    if(r?.merchant) F.merchant=String(r.merchant).slice(0,120);
    if(r?.total!=null&&Number.isFinite(+r.total)&&+r.total>0) F.amount=String(Math.round(+r.total*100)/100);
    if(ISO_RE.test(String(r?.date||""))) F.date=String(r.date);
    if(EXPCAT[r?.category]) F.expcat=r.category;
    F.pay=PAY[r?.payment]!==undefined?String(r.payment||""):"";
    const its=Array.isArray(r?.items)?r.items.slice(0,5).filter(x=>x&&x.name).map(x=>`- ${String(x.name).slice(0,60)}${x.price!=null&&Number.isFinite(+x.price)?" – "+eur(+x.price):""}`).join("\n"):"";
    F.note=[r?.note?String(r.note).slice(0,200):"",its].filter(Boolean).join("\n");
    toast("Bloček prečítaný. Skontroluj údaje a ulož.");
  }catch(e){ if(e?.code!=="cancelled"){ toast(sErr(e)+" Vyplň údaje ručne."); if(aiOff.includes(e?.code)) S.sample=null; } }
  if(S.exp.file===file){ S.exp.busy=false; if(S.view==="financie") renderView(); }
}

function retrieve(q){
  const all=items(); const words=norm(q).split(/[^a-z0-9]+/).filter(w=>w.length>=3);
  const stem=w=>w.length>5?w.slice(0,w.length-2):w;
  const scored=all.map(i=>{
    const T=norm(i.title), B=norm(i.body), G=norm((i.tags||[]).join(" "));
    let s=0; for(const w of words){ const st=stem(w); if(T.includes(st)) s+=5; if(G.includes(st)) s+=3; const c=B.split(st).length-1; s+=Math.min(c,6); }
    return {i,s};
  });
  const totalLen=all.reduce((a,i)=>a+(i.title.length+i.body.length),0);
  let pick;
  if(totalLen<90000) pick=scored.sort((a,b)=>b.s-a.s||(b.i.updated||"").localeCompare(a.i.updated||"")).map(x=>x.i);
  else {
    const hits=scored.filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.i).slice(0,40);
    const ids=new Set(hits.map(i=>i.id)); for(const h of hits.slice(0,10)) for(const n of [...(S.edges.out.get(h.id)||[]),...backlinks(h.id)]) ids.add(n);
    const recent=all.sort((a,b)=>(b.updated||"").localeCompare(a.updated||"")).slice(0,15); recent.forEach(i=>ids.add(i.id));
    pick=[...ids].map(id=>S.items.get(id)).filter(Boolean);
  }
  let budget=110000; const out=[];
  for(const i of pick){
    const extra=[i.status&&"stav: "+i.status,i.due&&"termín: "+i.due,i.date&&"dátum: "+i.date+(i.time?" "+i.time:"")+(i.repeat?" ("+REPEAT[i.repeat]+")":""),CALS[i.cal]&&"kalendár: "+CALS[i.cal],i.type==="vydavok"&&i.amount!=null&&"suma: "+eur(i.amount)+", kategória: "+(EXPCAT[i.expcat]||"Iné"),AREAS[i.area]&&"oblasť: "+AREAS[i.area],i.url&&"odkaz: "+i.url,i.project&&S.items.get(i.project)&&"projekt: "+S.items.get(i.project).title,(i.tags||[]).length&&"štítky: "+i.tags.join(", "),(i.attachments||[]).length&&"prílohy: "+i.attachments.map(a=>a.name).join(", ")].filter(Boolean).join("; ");
    const block=`### [[${i.title}]]\n(typ: ${TYPES[i.type]?.label}; vytvorené ${(i.created||"").slice(0,10)}; upravené ${(i.updated||"").slice(0,10)}${extra?"; "+extra:""})\n${String(i.body).slice(0,6000)}`;
    if(budget-block.length<0) break; budget-=block.length; out.push({id:i.id,block});
  }
  return out;
}

${hist?"\nPREDCHÁDZAJÚCA KONVERZÁCIA:\n"+hist+"\n":""}
SÚHRN SÚKROMNÝCH VÝDAVKOV (posledných 6 mesiacov, z evidencie):
${expSummaryText()}
OSOBNÝ PREHĽAD (príjmy, úvery, autá, výlety, ciele, denník):
${lifeContext()}
DÔLEŽITÉ NEVYBAVENÉ MAILY:
${S.mail.filter(x=>x.cat==="dolezite"&&!x.handled).slice(0,15).map(x=>`- ${String(x.received||"").slice(0,10)} od ${x.from||x.fromEmail}: ${x.subject}${x.deadline?" (termín "+x.deadline+")":""} – ${x.summary||""}`).join("\n")||"-"}

ZÁZNAMY (${ctx.length} z ${S.items.size}):
${ctx.map(x=>x.block).join("\n\n")||"(žiadne záznamy)"}

OTÁZKA: ${q}`;
  S.chat.push({role:"user",text:q}); const msg={role:"assistant",text:"",pending:true,sources:ctx.map(x=>x.id)}; S.chat.push(msg);
  if(S.view==="otazka"){ renderView(); }

    msg.text=r.text+(r.truncated?"\n\n_(Odpoveď bola skrátená.)_":"");
  }catch(e){ msg.text=(e?.text||"")+(e?.code==="cancelled"?"\n\n_(Zastavené.)_":"\n\n**"+sErr(e)+"**"); if(aiOff.includes(e?.code)) S.sample=null; }
  msg.pending=false; askCtl=null;
  if(S.view==="otazka"){ renderView(); }
}

  <div id="gInfo" style="font-size:13px;color:var(--muted)"></div></div>`;

function graphModel(){
  const nodes=[], idx=new Map(), links=[];
  const old=G?.idx;
  const add=(id,label,type,isTag)=>{ const p=old?.get(id); const n={id,label,type,isTag,x:p?p.x:(Math.random()-.5)*400,y:p?p.y:(Math.random()-.5)*400,vx:0,vy:0,deg:0}; idx.set(id,n); nodes.push(n); return n; };
  for(const it of S.items.values()) if(!S.graph.hidden.has(it.type)) add(it.id,it.title||"Bez názvu",it.type,false);
  const seen=new Set();
  for(const it of S.items.values()){ if(!idx.has(it.id)) continue; for(const t of (S.edges.out.get(it.id)||[])){ if(!idx.has(t)) continue; const k=[it.id,t].sort().join("|"); if(seen.has(k)) continue; seen.add(k); links.push([idx.get(it.id),idx.get(t)]); } }
  if(S.graph.tags){ for(const it of S.items.values()){ if(!idx.has(it.id)) continue; for(const tg of it.tags||[]){ const tid="#"+tg; const tn=idx.get(tid)||add(tid,"#"+tg,"tag",true); links.push([idx.get(it.id),tn]); } } }
  for(const [a,b] of links){ a.deg++; b.deg++; }
  return {nodes,idx,links};
}
function startGraph(){
  const cv=$("#graph"); if(!cv) return;
  G={...graphModel(),cv,ctx:cv.getContext("2d"),scale:1,ox:0,oy:0,alpha:1,raf:0,drag:null,hover:null};
  $("#legend").addEventListener("change",e=>{ if(e.target.id==="gTags") S.graph.tags=e.target.checked; else if(e.target.dataset.gt){ e.target.checked?S.graph.hidden.delete(e.target.dataset.gt):S.graph.hidden.add(e.target.dataset.gt);} rebuildGraph(); });
  $("#gIn").onclick=()=>zoom(1.25); $("#gOut").onclick=()=>zoom(.8); $("#gFit").onclick=fit;
  const ro=new ResizeObserver(()=>{sizeCanvas(); draw();}); ro.observe(cv); G.ro=ro;
  sizeCanvas(); bindGraphPointer(); G.alpha=1; tick(); setTimeout(fit,900);
  info();
}
function info(){ const el=$("#gInfo"); if(el&&G) el.textContent=`${G.nodes.length} uzlov · ${G.links.length} prepojení · ${G.nodes.filter(n=>!n.deg&&!n.isTag).length} samostatných záznamov`; }
function rebuildGraph(){ if(!G) return; Object.assign(G,graphModel()); G.alpha=Math.max(G.alpha,.6); info(); if(!G.raf) tick(); }
function stopGraph(){ if(G){ cancelAnimationFrame(G.raf); G.ro?.disconnect(); } G=null; }
function sizeCanvas(){ const cv=G.cv, r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=Math.max(1,r.width*d); cv.height=Math.max(1,r.height*d); G.w=r.width; G.h=r.height; G.dpr=d; }
function tick(){
  if(!G) return;
  const {nodes,links}=G; const a=G.alpha;
  if(a>0.02){
    for(let i=0;i<nodes.length;i++){ const n=nodes[i]; for(let j=i+1;j<nodes.length;j++){ const m=nodes[j]; let dx=n.x-m.x, dy=n.y-m.y, d2=dx*dx+dy*dy+0.01; if(d2>250000) continue; const f=1800/d2*a; const d=Math.sqrt(d2); dx/=d; dy/=d; n.vx+=dx*f; n.vy+=dy*f; m.vx-=dx*f; m.vy-=dy*f; } }
    for(const [s,t] of links){ let dx=t.x-s.x, dy=t.y-s.y; const d=Math.sqrt(dx*dx+dy*dy)||1; const L=t.isTag||s.isTag?70:90; const f=(d-L)*0.04*a; dx/=d; dy/=d; s.vx+=dx*f; s.vy+=dy*f; t.vx-=dx*f; t.vy-=dy*f; }
    for(const n of nodes){ n.vx-=n.x*0.004*a*(n.deg?1:2.2); n.vy-=n.y*0.004*a*(n.deg?1:2.2); if(G.drag?.node===n) { n.vx=n.vy=0; continue; } n.vx*=0.82; n.vy*=0.82; n.x+=Math.max(-30,Math.min(30,n.vx)); n.y+=Math.max(-30,Math.min(30,n.vy)); }
    G.alpha*=0.985;
  }
  draw();
  G.raf = (G.alpha>0.02||G.drag)? requestAnimationFrame(tick) : 0;
}
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function draw(){
  if(!G) return; const {ctx,dpr,w,h}=G; const c={line:css("--line-2"),fg:css("--fg"),muted:css("--muted"),bg:css("--surface"),acc:css("--accent")};
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  ctx.translate(w/2+G.ox,h/2+G.oy); ctx.scale(G.scale,G.scale);
  const hv=G.hover; const nb=new Set(); if(hv){ for(const [s,t] of G.links){ if(s===hv) nb.add(t); if(t===hv) nb.add(s);} }
  ctx.lineWidth=1/G.scale;
  for(const [s,t] of G.links){ const on=hv&&(s===hv||t===hv); ctx.strokeStyle=on?c.acc:c.line; ctx.globalAlpha=hv&&!on?.35:(s.isTag||t.isTag?.6:1); ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y); ctx.stroke(); }
  ctx.globalAlpha=1;
  for(const n of G.nodes){
    const r=n.isTag?3.5:5+Math.sqrt(n.deg)*2.2; n.r=r;
    ctx.globalAlpha=hv&&n!==hv&&!nb.has(n)?.3:1;
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2);
    if(n.isTag){ ctx.fillStyle=c.bg; ctx.fill(); ctx.strokeStyle=c.muted; ctx.lineWidth=1.2/G.scale; ctx.stroke(); }
    else { ctx.fillStyle=css("--t-"+n.type)||c.fg; ctx.fill(); ctx.strokeStyle=c.bg; ctx.lineWidth=1.5/G.scale; ctx.stroke(); }
  }
  ctx.font=`${12/G.scale}px "IBM Plex Sans",system-ui,sans-serif`; ctx.textBaseline="middle";
  for(const n of G.nodes){
    const show=n===hv||nb.has(n)||n.deg>=3||G.scale>1.4||(n.isTag&&G.scale>1.1)||G.nodes.length<25;
    if(!show) continue; ctx.globalAlpha=hv&&n!==hv&&!nb.has(n)?.3:1;
    const lab=n.label.length>34?n.label.slice(0,33)+"…":n.label;
    ctx.fillStyle=n===hv?c.fg:c.muted; ctx.lineWidth=3/G.scale; ctx.strokeStyle=c.bg; ctx.strokeText(lab,n.x+n.r+4/G.scale,n.y); ctx.fillText(lab,n.x+n.r+4/G.scale,n.y);
  }
  ctx.globalAlpha=1;
}
function toWorld(e){ const r=G.cv.getBoundingClientRect(); return {x:(e.clientX-r.left-G.w/2-G.ox)/G.scale,y:(e.clientY-r.top-G.h/2-G.oy)/G.scale}; }
function hit(p){ let best=null,bd=1e9; for(const n of G.nodes){ const d=Math.hypot(n.x-p.x,n.y-p.y); if(d<(n.r||6)+6/G.scale&&d<bd){bd=d;best=n;} } return best; }
function zoom(f){ if(!G) return; G.scale=Math.max(.2,Math.min(4,G.scale*f)); draw(); }
function fit(){ if(!G||!G.nodes.length) return; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const n of G.nodes){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y);} const sw=(x1-x0)+160, sh=(y1-y0)+80; G.scale=Math.max(.2,Math.min(2,Math.min(G.w/sw,G.h/sh))); G.ox=-(x0+x1)/2*G.scale; G.oy=-(y0+y1)/2*G.scale; draw(); }
function bindGraphPointer(){
  const cv=G.cv;
  cv.addEventListener("pointerdown",e=>{ const p=toWorld(e); const n=hit(p); cv.setPointerCapture(e.pointerId); G.drag={node:n,sx:e.clientX,sy:e.clientY,ox:G.ox,oy:G.oy,moved:false}; cv.style.cursor="grabbing"; if(n){ G.alpha=Math.max(G.alpha,.3); if(!G.raf) tick(); } });
  cv.addEventListener("pointermove",e=>{
    if(!G) return; const p=toWorld(e);
    if(G.drag){ const dx=e.clientX-G.drag.sx, dy=e.clientY-G.drag.sy; if(Math.abs(dx)+Math.abs(dy)>3) G.drag.moved=true;
      if(G.drag.node){ G.drag.node.x=p.x; G.drag.node.y=p.y; } else { G.ox=G.drag.ox+dx; G.oy=G.drag.oy+dy; draw(); } return; }
    const n=hit(p); if(n!==G.hover){ G.hover=n; cv.style.cursor=n?"pointer":"grab"; draw(); }
  });
  const up=e=>{ if(!G?.drag) return; const d=G.drag; G.drag=null; cv.style.cursor="grab"; if(!d.moved&&d.node&&!d.node.isTag) openItem(d.node.id); else if(!d.moved&&d.node?.isTag){ S.lib.tag=d.node.label.slice(1); S.lib.type=""; go("kniznica"); } };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  cv.addEventListener("pointerleave",()=>{ if(G&&!G.drag){ G.hover=null; draw(); }});
  cv.addEventListener("wheel",e=>{ e.preventDefault(); zoom(e.deltaY<0?1.12:.89); },{passive:false});
}

let D=null; // {id, it, timer, tab, confirmDel, sug}
function openItem(id,fresh){
  const src=fresh||S.items.get(id); if(!src) return;
  if(D) flushDraft();
  D={id,it:JSON.parse(JSON.stringify(src)),isNew:!!fresh,tab:fresh?"edit":(src.body?"view":"edit"),confirmDel:false,sug:null,saving:false,dirty:false};
  renderDrawer();
  setTimeout(()=>{ if(fresh) $("#dTitle")?.focus(); },30);
}
function closeDrawer(){ if(!D) return; flushDraft(); D=null; $("#drawerRoot").innerHTML=""; }
function schedule(){ D.dirty=true; setDStatus("Neuložené zmeny…"); clearTimeout(D.timer); D.timer=setTimeout(flushDraft,700); }
function setDStatus(t){ const el=$("#dStatus"); if(el) el.textContent=t; }
function flushDraft(){
  if(!D||!D.dirty) return; clearTimeout(D.timer); D.dirty=false;
  const it=D.it; if(D.isNew && !it.title.trim() && !it.body.trim()) return;
  if(!it.title.trim()) it.title=snippet(it.body,60)||"Bez názvu";
  D.isNew=false; const id=D.id; setDStatus("Ukladám…");
  saveItem(id,it).then(ok=>{ if(D&&D.id===id&&!D.dirty) setDStatus(ok?"Uložené":"Neuložené"); });
}

  $("#dDate")&&($("#dDate").onchange=e=>{it.date=e.target.value; schedule();});
  $("#dTime")&&($("#dTime").onchange=e=>{it.time=e.target.value; schedule();});
  $("#dCal")&&($("#dCal").onchange=e=>{it.cal=e.target.value; schedule();});
  $("#dRep")&&($("#dRep").onchange=e=>{it.repeat=e.target.value; schedule();});
  $("#dUrl")&&($("#dUrl").oninput=e=>{it.url=e.target.value.trim(); schedule();});
  $("#dAmt")&&($("#dAmt").oninput=e=>{it.amount=e.target.value===""?null:+e.target.value; schedule();});
  $("#dExp")&&($("#dExp").onchange=e=>{it.expcat=e.target.value; schedule();});

/* Virtuálne udalosti: splátky úverov, termíny áut, výlety */
function virtualEvents(from,to){
  const out=[];
  for(const l of C.loans){ if(!(num(l.payment)>0)||!l.payDay||(num(l.balance)!=null&&num(l.balance)<=0)) continue; const end=l.endDate||"9999-12-31"; let d=nextPayDate(l.payDay,from), g=0;
    while(d&&d<=to&&d<=end&&g<40){ out.push({d,it:{id:"loan-"+l.id,type:"udalost",title:"Splátka: "+(l.name||"úver")+" · "+eur(l.payment),cal:"financie",area:"financie",time:"",_go:"financie/uvery"}}); d=nextPayDate(l.payDay,addDays(d,1)); g++; } }
  for(const c of C.cars) for(const [k,lb] of carDateKeys(c))
    if(ISO_RE.test(c[k]||"")&&c[k]>=from&&c[k]<=to) out.push({d:c[k],it:{id:"car-"+c.id+k,type:"udalost",title:lb+" – "+(c.name||"auto"),cal:"osobne",time:"",_go:"auta/"+c.id}});
  for(const t of C.trips){ const cal=t.kind==="rodinny"?"rodina":"osobne";
    if(ISO_RE.test(t.start||"")&&t.start>=from&&t.start<=to) out.push({d:t.start,it:{id:"trip-"+t.id,type:"udalost",title:"Odchod: "+(t.name||t.dest||"výlet"),cal,area:t.kind==="rodinny"?"rodina":"",time:"",_go:"vylety/"+t.id}});
    for(const b of (t.bookings||[])) if(ISO_RE.test(b.date||"")&&b.date>=from&&b.date<=to) out.push({d:b.date,it:{id:"tb-"+b.id,type:"udalost",title:(BOOK_KIND[b.kind]||"Program")+": "+b.title,cal,time:b.time||"",_go:"vylety/"+t.id}}); }
  for(const u of units()){ const sh=uShort(u), cal=u.kind==="firma"?"biznis":"financie";
    for(const o of bzOut(u.id)) for(const d of bzOcc(o,from,to)) out.push({d,it:{id:"bz-"+o.id+"-"+d,type:"udalost",title:`${sh} · ${o.title||BZ_OUT[o.kind]||"platba"} · ${eur(o.amount)}`,cal,area:u.kind==="firma"?"biznis":"financie",time:"",_go:"financie/"+u.id}});
    for(const x of bzOpen(u.id)) if(ISO_RE.test(x.due||"")&&x.due>=from&&x.due<=to) out.push({d:x.due,it:{id:"bzi-"+x.id,type:"udalost",title:`${sh} · ${x.inv?"splatnosť":"očakávaná úhrada"}: ${x.title||"faktúra"}${x.inv?" "+x.inv:""} · ${eur(x.amount)}`,cal,area:u.kind==="firma"?"biznis":"financie",time:"",_go:"financie/"+u.id}}); }
  for(const s of C.subs){ if(subPayer(s)==="osobne") for(const d of subOcc(s,from,to)) out.push({d,it:{id:"sub-"+s.id+"-"+d,type:"udalost",title:"Predplatné: "+(s.name||"")+" · "+eur(s.amount),cal:"financie",area:"financie",time:"",_go:"financie/predplatne"}});
    if(subActive(s)&&ISO_RE.test(s.cancelBy||"")&&s.cancelBy>=from&&s.cancelBy<=to) out.push({d:s.cancelBy,it:{id:"subc-"+s.id,type:"udalost",title:"Zrušiť / rozhodnúť: "+(s.name||"predplatné"),cal:subPayer(s)==="osobne"?"financie":"biznis",time:"",_go:"financie/predplatne"}}); }
  out.push(...peopleEvents(from,to));
  return out;
}

function loanCalc(l){
  const P=num(l.payment)||0, B=num(l.balance)||0, r=(num(l.rate)||0)/1200; let n=null, note="";

  const totalLeft=n!=null?Math.round(n*P*100)/100:null;

/* ---------- Firmy a vlastné moduly: Safety Electric Slovakia + ďalšie (firma, pasívny príjem…) ---------- */
const UNIT_KIND={firma:"Firma",pasivny:"Pasívny príjem",ine:"Iný modul"};
/* Sadzby DPH na Slovensku od 1. 1. 2025: 23 % základná, 19 % a 5 % znížené (podnikajte.sk, finančná správa) */
const VAT_RATES={"0":"0 % / bez DPH","5":"5 %","19":"19 %","23":"23 %"};
const AMT_MODE={s:"s DPH (hrubá suma)",b:"bez DPH (z objednávky)"};
const INC_KIND_P={najom:"Nájom",dividendy:"Dividendy",uroky:"Úroky",licencie:"Licencie a autorské",predaj:"Predaj",ine:"Iné"};
const SAFETY_DEF={id:"safety",name:"Safety Electric Slovakia",short:"Safety",kind:"firma",vatPayer:false,vat:0};
function allUnits(){ const s=setting("units"); const L=(Array.isArray(s?.units)?s.units:[]).filter(u=>u&&u.id&&u.name).map(u=>({...u}));
  const i=L.findIndex(u=>u.id==="safety"); if(i<0) L.unshift({...SAFETY_DEF}); else L[i]={...SAFETY_DEF,...L[i],...(L[i].vatSet?{}:{vatPayer:false,vat:0}),archived:false}; return L; }
const units=()=>allUnits().filter(u=>!u.archived);
const unitById=id=>allUnits().find(u=>u.id===id)||null;
const uShort=u=>u?(u.short||u.name):"";
const workOpts=u=>u&&u.kind!=="firma"?INC_KIND_P:BZ_WORK;
let BZ_CO="safety";
const coOf=x=>x.co||"safety";
const bzIn=(co=BZ_CO)=>C.bizcf.filter(x=>coOf(x)===co&&x.dir==="in");
const bzOut=(co=BZ_CO)=>C.bizcf.filter(x=>coOf(x)===co&&x.dir==="out").concat(subBizOut(co));
const bzExp=(co=BZ_CO)=>C.bizcf.filter(x=>coOf(x)===co&&x.dir==="exp"&&ISO_RE.test(x.date||""));
const bzOpen=(co=BZ_CO)=>bzIn(co).filter(x=>x.status!=="prijaty");
const bzPaid=(co=BZ_CO)=>bzIn(co).filter(x=>x.status==="prijaty"&&ISO_RE.test(x.paidDate||""));
const bzPaidAmt=x=>{ const p=num(x.paidAmount); return p!=null?p:(num(x.amount)||0); };
const mEnd=mk=>{ const [y,m]=mk.split("-").map(Number); return isoD(new Date(y,m,0)); };
const vatOf=(x,u)=>{ u=u||unitById(coOf(x||{})); if(!u?.vatPayer) return 0; const v=num(x?.vat); return v!=null?v:(num(u.vat)||0); };
const netOf=(a,v)=>Math.round((num(a)||0)/(1+(num(v)||0)/100)*100)/100;
const r2=n=>Math.round(n*100)/100;
/* Termíny pravidelnej platby v intervale <from,to> */
function bzOcc(o,from,to){ const out=[]; if(!(num(o.amount)>0)||!ISO_RE.test(o.first||"")) return out;
  const st=BZ_STEP[o.freq]??1, end=ISO_RE.test(o.end||"")?o.end:"9999-12-31";
  for(let k=0;k<1200;k++){ const d=st?addMonths(o.first,k*st):o.first; if(d>to||d>end) break; if(d>=from) out.push(d); if(!st) break; }
  return out; }
const bzMonthly=o=>{ const st=BZ_STEP[o.freq]??1; return st?(num(o.amount)||0)/st:0; };
function bzSet(co=BZ_CO){ const s=setting("bizcf_"+co)||{}; return {bal:num(s.balance),date:ISO_RE.test(s.date||"")?s.date:""}; }
/* Mesiac: prijaté (podľa dátumu úhrady), očakávané (podľa splatnosti; v aktuálnom mesiaci aj po splatnosti), pravidelné platby (termíny v mesiaci), výdaje (podľa dátumu) */
function bzMonth(mk,co=BZ_CO){ const st=mk+"-01", en=mEnd(mk), cur=mk===today().slice(0,7);
  const recv=Math.round(bzPaid(co).filter(x=>monthKey(x.paidDate)===mk).reduce((s,x)=>s+Math.round(bzPaidAmt(x)*100),0))/100;
  const exp=sumAmt(bzOpen(co).filter(x=>{ const d=x.due||""; return cur?d<=en:(d>=st&&d<=en); }));
  let out=0; for(const o of bzOut(co)) out+=bzOcc(o,st,en).length*Math.round(num(o.amount)*100); out/=100;
  const spent=sumAmt(bzExp(co).filter(x=>monthKey(x.date)===mk));
  return {recv,exp,out,spent,costs:r2(out+spent),net:r2(recv+exp-out-spent)}; }

function bzBalAt(endD,co=BZ_CO){ const s=bzSet(co); if(s.bal==null||!s.date) return null; let c=Math.round(s.bal*100);
  for(const x of bzPaid(co)) if(x.paidDate>s.date&&x.paidDate<=endD) c+=Math.round(bzPaidAmt(x)*100);
  for(const x of bzOpen(co)) if((x.due||"")<=endD) c+=Math.round((num(x.amount)||0)*100);
  for(const o of bzOut(co)) c-=bzOcc(o,addDays(s.date,1),endD).length*Math.round(num(o.amount)*100);
  for(const x of bzExp(co)) if(x.date>s.date&&x.date<=endD) c-=Math.round((num(x.amount)||0)*100);

/* Obdobie pre grafy: mesiac alebo rok */
function bzRange(){ const td=today(); if(S.bz.per==="y"){ const y=S.bz.py||td.slice(0,4); return {from:y+"-01-01",to:y+"-12-31",label:"rok "+y}; }

function bzExpByCat(from,to,co=BZ_CO){ const u=unitById(co), g={}, n={}; let vat=0;
  const add=(k,a,v)=>{ k=BZ_OUT[k]?k:"ine"; g[k]=(g[k]||0)+Math.round(a*100); const ne=netOf(a,v); n[k]=(n[k]||0)+Math.round(ne*100); vat+=Math.round((a-ne)*100); };
  for(const x of bzExp(co)) if(x.date>=from&&x.date<=to) add(x.cat,num(x.amount)||0,vatOf(x,u));
  for(const o of bzOut(co)){ const k=bzOcc(o,from,to).length; for(let i=0;i<k;i++) add(o.kind,num(o.amount)||0,vatOf(o,u)); }
  const tot=Object.values(g).reduce((s,v)=>s+v,0)/100, net=Object.values(n).reduce((s,v)=>s+v,0)/100;
  return {cats:Object.entries(g).map(([k,c])=>[k,c/100]).sort((a,b)=>b[1]-a[1]),tot,net,vat:vat/100}; }
function bzIncByKind(from,to,co=BZ_CO){ const u=unitById(co), td=today(), g={}; let recv=0,exp=0,net=0;

function donut(arr,labels,{sub="",aria=""}={}){ const tot=arr.reduce((s,x)=>s+x[1],0);

/* Termíny platby v intervale <from,to>: od dátumu platby dozadu aj dopredu po kroku, ohraničené „počítať od“ a dátumom zrušenia */
function subOcc(s,from,to){ const out=[]; if(!(num(s.amount)>0)||!ISO_RE.test(s.first||"")) return out;
  const st=subStep(s), end=subEnd(s); let lo=from>subSince(s)?from:subSince(s); if(s.status==="skusobne"&&s.first>lo) lo=s.first; const hi=end&&end<to?end:to; if(lo>hi) return out;
  const md=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
  let k=Math.floor(md(s.first,lo)/st)-1;
  for(let g=0;g<400;g++,k++){ const d=addMonths(s.first,k*st); if(d>hi) break; if(d>=lo) out.push(d); }
  return out; }
const subNext=s=>{ const td=today(); return subActive(s)?(subOcc(s,td,addMonths(td,13))[0]||""):""; };

function goalFin(g){ const t=num(g.target); if(!(t>0)) return null; const td=today();
  const a=g.assetId?byId("assets",g.assetId):null, saved=a?(num(a.value)||0):(num(g.saved)||0), left=Math.max(0,r2(t-saved));
  const ml=ISO_RE.test(g.due||"")?Math.max(1,(pd(g.due)-pd(td))/864e5/30.4375):null;

  return {t,saved,left,ml,need,mon,eta,late:!!(g.due&&left>0&&(!mon||eta>g.due)),pct:Math.min(100,t>0?saved/t*100:0),asset:a}; }

  const months=ms.filter(m=>incMonth(m).length).length;

function carRowCalc(c,r){
  if(r.t==="date"){ if(!ISO_RE.test(c[r.k]||"")) return null; const n=dayDiff(c[r.k]); return {k:r.k,l:r.l,date:c[r.k],days:n,state:dueState(n,null)}; }
  const ivKm=r.fk||num(c[r.ik]), ivM=r.fm||num(c[r.im]);
  const lastKm=r.lk?num(c[r.lk]):null, lastD=r.ld&&ISO_RE.test(c[r.ld]||"")?c[r.ld]:"";
  const kmNext=lastKm!=null&&ivKm?lastKm+ivKm:null, dNext=lastD&&ivM?addMonths(lastD,ivM):"";
